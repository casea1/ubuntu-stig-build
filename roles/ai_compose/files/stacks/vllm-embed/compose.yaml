# System 2 -- Granite embedding vLLM (RAG embeddings, :8002). Own stack.
# OpenAI-compatible; reached from System 1's Open WebUI. Shares System 2's ONE
# GPU with vllm-vision + docling (all small), so a low gpu-memory-utilization.
name: vllm-embed
networks:
  oi:
    external: true
volumes:
  granite-embed:
    external: true
services:
  vllm-embed:
    image: vllm/vllm-openai:v0.29.0-cu129-ubuntu2404
    container_name: vllm-embed
    ipc: host
    ports:
    - 8002:8002
    volumes:
    - granite-embed:/granite-embed
    - ./fips_off:/proc/sys/crypto/fips_enabled:ro
    command:
    - --model=/granite-embed
    - --served-model-name=granite-embedding-small-english-r2
    - --runner=pooling
    - --tensor-parallel-size=1
    - --max-model-len=8192
    - --gpu-memory-utilization=0.45
    - --port=8002
    - --pooler-config={"pooling_type":"CLS","use_activation":true}
    - --max-num-seqs=128
    - --max-num-batched-tokens=65536
    - --max-num-queued-reqs=256
    - --max-num-queued-tokens=131072
    - --block-size=16
    - --disable-log-stats
    - --trust-remote-code
    networks:
    - oi
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
