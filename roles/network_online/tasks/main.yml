---
# =============================================================================
# network_online -- make network-online.target resolve promptly, without
# removing the guarantee anything depends on.
#
# THE FAULT. On dev-16, `systemd-analyze blame`:
#
#   2min 309ms systemd-networkd-wait-online.service
#      5.988s NetworkManager-wait-online.service
#
# and `networkctl list` showed all ten links `unmanaged`. NetworkManager is the
# netplan renderer on the desktop profiles, so systemd-networkd manages nothing
# -- but its wait-online is enabled, waits for links it does not own, and times
# out at the default 120s on EVERY boot. NetworkManager-wait-online had already
# satisfied network-online.target six seconds in.
#
# WHY NOT JUST DISABLE THE WAIT. Real units order behind network-online.target
# here -- the SMB audit offload mount, the PowerStrux offload, and the FPGA
# licence daemon. Remove the wait and those start before the network is up and
# fail. So this masks only the wait-online that has nothing to wait FOR, and
# only where the other one is present to take over.
#
# The condition is read from the box, not assumed from the profile: an `ai` node
# on Ubuntu Server has networkd as its renderer, where this unit is the one
# doing the real work and masking it would break the target outright.
# =============================================================================

- name: "NET-ONLINE | How many links does systemd-networkd actually manage?"
  ansible.builtin.shell:
    cmd: |
      networkctl list --no-legend 2>/dev/null | awk '$5 != "unmanaged" && $5 != "pending"' | wc -l
  register: _net_managed
  changed_when: false
  failed_when: false
  check_mode: false

- name: "NET-ONLINE | Is NetworkManager the one providing network-online.target?"
  ansible.builtin.command: systemctl is-enabled NetworkManager-wait-online.service
  register: _net_nm_wait
  changed_when: false
  failed_when: false
  check_mode: false

- name: "NET-ONLINE | Decide"
  ansible.builtin.set_fact:
    # Mask only when BOTH are true: networkd owns no links, and NetworkManager's
    # wait-online is enabled to provide the target instead. Either alone is not
    # enough to make it safe.
    _net_mask_networkd_wait: >-
      {{ ((_net_managed.stdout | default('1') | trim | int) == 0)
         and ((_net_nm_wait.stdout | default('') | trim) in ['enabled', 'enabled-runtime']) }}

- name: "NET-ONLINE | Mask systemd-networkd-wait-online (it manages no links here)"
  ansible.builtin.systemd:
    name: systemd-networkd-wait-online.service
    masked: true
    enabled: false
  when: _net_mask_networkd_wait | bool

# Self-correcting: if this box is ever renumbered onto networkd -- a rebuild as
# the `ai` profile, say -- the mask has to come off or network-online.target
# loses its only provider and every unit ordered behind it hangs instead.
- name: "NET-ONLINE | Unmask it again if networkd has taken over the links"
  ansible.builtin.systemd:
    name: systemd-networkd-wait-online.service
    masked: false
  when: not (_net_mask_networkd_wait | bool)

- name: "NET-ONLINE | Result"
  ansible.builtin.debug:
    msg: >-
      {{ 'systemd-networkd-wait-online is MASKED: it manages 0 links and
          NetworkManager-wait-online provides network-online.target. That is
          ~2 minutes off every boot.'
         if _net_mask_networkd_wait | bool
         else 'systemd-networkd manages ' ~ (_net_managed.stdout | default('?') | trim) ~
              ' link(s); leaving systemd-networkd-wait-online alone. It is what
              provides network-online.target on this box.' }}

# =============================================================================
# OFF-NETWORK LATENCY. A deployed box has DNS servers it cannot reach and no
# route off the LAN, and the default behaviour is to WAIT for those rather than
# fail fast. That waiting is indistinguishable from a slow machine.
# =============================================================================

# 1. THE BOX'S OWN NAME. If the hostname is not in /etc/hosts, every
#    gethostbyname() for it -- and there are many, from sudo to GNOME to D-Bus
#    to X -- goes to a DNS server that will not answer, and blocks for the
#    resolver timeout each time. On an air-gapped box that is seconds per
#    lookup, on a path nothing caches.
#
#    127.0.1.1 rather than 127.0.0.1 is the Debian convention for a machine
#    whose name has no permanent address: it resolves without claiming the
#    loopback name.
- name: "NET-ONLINE | This box's own hostname resolves without DNS"
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1[[:space:]]'
    line: "127.0.1.1 {{ ansible_facts.fqdn | default(ansible_facts.hostname) }} {{ ansible_facts.hostname }}"
    owner: root
    group: root
    mode: "0644"
  when: net_hosts_self_entry | default(true) | bool

# 2. NetworkManager's CONNECTIVITY CHECK. It fetches connectivity.ubuntu.com
#    whenever an interface changes and on a timer, to decide whether to show
#    the "limited connectivity" indicator. Off-network it times out every time,
#    and the retry keeps the network state churning -- which the desktop shell
#    reacts to. Nothing on a deployed box needs the answer.
- name: "NET-ONLINE | Is NetworkManager present?"
  ansible.builtin.stat:
    path: /usr/sbin/NetworkManager
  register: _net_nm_bin

- name: "NET-ONLINE | Turn off the connectivity check (it cannot succeed here)"
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/20-no-connectivity-check.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible (network_online) -- do not edit by hand.
      # Off-network this fetch can only time out, repeatedly. See the role.
      [connectivity]
      enabled=false
      uri=
      interval=0
  when:
    - _net_nm_bin.stat.exists | default(false)
    - net_disable_connectivity_check | default(true) | bool
  notify: Reload NetworkManager

- name: "NET-ONLINE | Restore it when switched back on"
  ansible.builtin.file:
    path: /etc/NetworkManager/conf.d/20-no-connectivity-check.conf
    state: absent
  when:
    - _net_nm_bin.stat.exists | default(false)
    - not (net_disable_connectivity_check | default(true) | bool)
  notify: Reload NetworkManager
