---
# VS Code extensions are per-user. Install for the primary user, then seed
# /etc/skel so any future account inherits them + the venv interpreter default.

- name: Ensure the primary user's VS Code config dir exists
  become: true
  become_user: "{{ dev_tools_user }}"
  ansible.builtin.file:
    path: "/home/{{ dev_tools_user }}/.config/Code/User"
    state: directory
    mode: "0700"

- name: Install VS Code extensions for {{ dev_tools_user }}
  become: true
  become_user: "{{ dev_tools_user }}"
  environment:
    HOME: "/home/{{ dev_tools_user }}"
  ansible.builtin.command:
    cmd: code --install-extension {{ item }} --force
  loop: "{{ vscode_extensions }}"
  changed_when: false      # code exits 0 whether it installs or is already present

- name: Set the venv as the VS Code default interpreter (primary user)
  become: true
  become_user: "{{ dev_tools_user }}"
  ansible.builtin.copy:
    dest: "/home/{{ dev_tools_user }}/.config/Code/User/settings.json"
    mode: "0644"
    content: |
      {
        "python.defaultInterpreterPath": "{{ eng_venv_path }}/bin/python"
      }

- name: Ensure /etc/skel VS Code dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/skel/.config/Code/User

# EXTENSIONS ARE NOT SEEDED INTO /etc/skel, deliberately.
#
# `useradd -m` copies the whole of /etc/skel for every account it creates. On
# ASP-2 the seeded extension set measured 3.0 GB across 27,395 files, so a
# single `it-adduser` took 65 seconds and every account carried its own 3 GB
# copy -- including the standing accounts the build itself creates, several
# times per box. The settings.json below is a few hundred bytes and stays.
#
# The set is still available: it_scripts records where it lives and `it-adduser`
# offers to copy it into a new account that actually wants it, showing the size
# first. Set dev_tools_vscode_skel_seed: true to go back to the old behaviour
# and its cost.
- name: "Remove the extension set from /etc/skel (it makes every useradd copy GBs)"
  ansible.builtin.file:
    path: /etc/skel/.vscode
    state: absent
  when: not (dev_tools_vscode_skel_seed | default(false) | bool)

- name: "Seed installed extensions into /etc/skel (opt-in; slows every useradd)"
  when: dev_tools_vscode_skel_seed | default(false) | bool
  block:
    - name: Ensure the /etc/skel extensions dir exists
      ansible.builtin.file:
        path: /etc/skel/.vscode/extensions
        state: directory
        mode: "0755"

    - name: Seed installed extensions into /etc/skel for future accounts
      ansible.builtin.copy:
        src: "/home/{{ dev_tools_user }}/.vscode/extensions/"
        dest: /etc/skel/.vscode/extensions/
        remote_src: true
        mode: preserve

- name: Seed the default interpreter setting into /etc/skel
  ansible.builtin.copy:
    dest: /etc/skel/.config/Code/User/settings.json
    mode: "0644"
    content: |
      {
        "python.defaultInterpreterPath": "{{ eng_venv_path }}/bin/python"
      }
