---
# =============================================================================
# usbguard -- device-authorisation allow-list for USB.
#
# This is a DIFFERENT layer from the existing `dta` USB controls: those gate
# MOUNTING (polkit/udisks2 + the udev node owner). USBGuard gates whether the
# kernel authorises the DEVICE at all. Both are kept; document both.
#
# LOCKOUT IS THE RISK. The initial policy is generated from the devices attached
# AT THAT MOMENT, so the box's own keyboard/trackpad are captured and keep
# working. External HID is NOT blanket-allowed -- a keystroke-injection device
# (BadUSB) presents as a keyboard, so allowing the whole HID class would defeat
# the control. An external keyboard therefore needs authorising once, from the
# console, with `it-usb allow <id> --permanent`.
#
# RECOVERY, if a box is ever locked out: boot to recovery / single-user and run
#   systemctl disable --now usbguard
# then re-generate the policy with the right devices attached (`it-usb regenerate`).
# =============================================================================

- name: "USBGUARD | Configure device allow-listing"
  when: usbguard_enabled | default(false) | bool
  block:
    - name: "USBGUARD | Install usbguard"
      ansible.builtin.apt:
        name: usbguard
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: "USBGUARD | Does a policy already exist?"
      ansible.builtin.stat:
        path: /etc/usbguard/rules.conf
      register: _usbg_rules

    # Generated ONCE. Re-running must never regenerate silently: that would
    # re-baseline the allow-list against whatever happens to be plugged in now,
    # quietly authorising a device someone left in. `it-usb regenerate` is the
    # deliberate, backed-up way to redo it.
    - name: "USBGUARD | Generate the initial allow-list from attached devices"
      ansible.builtin.shell:
        cmd: 'umask 077 && usbguard generate-policy > /etc/usbguard/rules.conf'
      when: not _usbg_rules.stat.exists or _usbg_rules.stat.size == 0
      register: _usbg_gen
      changed_when: _usbg_gen.rc == 0

    # ---- the class policy --------------------------------------------------
    # AT THE END OF THE FILE, and this is load-bearing. USBGuard is
    # FIRST-MATCH-WINS, so:
    #
    #   * the generated per-device allows sit ABOVE it -- the built-in keyboard
    #     and trackpad match their own rule first and are unaffected;
    #   * `it-usb allow <id> --permanent` appends BELOW it, and a HID device
    #     does not match this rule, so evaluation falls through to the new
    #     allow and enrollment still works. Writing this as an explicit
    #     `block ... { 03:*:* }` instead would shadow every keyboard anyone
    #     ever enrolls -- the one class we deliberately kept manual.
    #
    # A device presenting a listed class matches nothing here and falls through
    # to ImplicitPolicyTarget, which is `block`.
    - name: "USBGUARD | Auto-allow every class except {{ usbguard_manual_classes | join(', ') }}"
      ansible.builtin.blockinfile:
        path: /etc/usbguard/rules.conf
        marker: "# {mark} ANSIBLE MANAGED -- fpga/peripheral class policy"
        insertafter: EOF
        block: |
          # Anything that presents none of these still needs `it-usb enroll`:
          # mass storage moves data, HID can inject keystrokes, a radio can
          # pair one. Everything else -- serial adapters, hubs and docks,
          # printers, audio, video, JTAG programmers (vendor-specific) -- is
          # authorised on connect.
          allow with-interface none-of {{ '{' }} {{ usbguard_manual_classes | join(' ') }} {{ '}' }}
      when: usbguard_class_policy_enabled | default(true) | bool
      notify: restart usbguard

    # Removed cleanly if the policy is switched off, rather than left behind to
    # keep authorising devices after someone thought they had turned it off.
    - name: "USBGUARD | Remove the class policy when it is switched off"
      ansible.builtin.blockinfile:
        path: /etc/usbguard/rules.conf
        marker: "# {mark} ANSIBLE MANAGED -- fpga/peripheral class policy"
        state: absent
      when: not (usbguard_class_policy_enabled | default(true) | bool)
      notify: restart usbguard

    - name: "USBGUARD | Lock down the policy file"
      ansible.builtin.file:
        path: /etc/usbguard/rules.conf
        owner: root
        group: root
        mode: "0600"

    - name: "USBGUARD | Daemon configuration"
      ansible.builtin.template:
        src: usbguard-daemon.conf.j2
        dest: /etc/usbguard/usbguard-daemon.conf
        owner: root
        group: root
        mode: "0600"
      notify: restart usbguard

    - name: "USBGUARD | IPC access-control directory"
      ansible.builtin.file:
        path: /etc/usbguard/IPCAccessControl.d
        state: directory
        owner: root
        group: root
        mode: "0700"

    # Written directly rather than via `usbguard add-user`, which is not
    # idempotent and takes the privileges as CLI flags. Note the section
    # privileges are NOT interchangeable: Exceptions only accepts `listen`
    # (see usbguard-daemon.conf(5), "IPC ACCESS CONTROL"). A leading ':' in the
    # basename is what marks the name as a GROUP.
    - name: "USBGUARD | Allow the admin group to query/authorise devices"
      ansible.builtin.copy:
        dest: "/etc/usbguard/IPCAccessControl.d/:{{ ia_it_group | default('sudo') }}"
        content: |
          Devices=modify,list,listen
          Policy=list
          Exceptions=listen
        owner: root
        group: root
        mode: "0600"
      notify: restart usbguard

    - name: "USBGUARD | Enable and start the daemon"
      ansible.builtin.systemd:
        name: usbguard
        enabled: true
        state: started
        daemon_reload: true

    - name: "USBGUARD | Summary"
      ansible.builtin.debug:
        msg: >-
          USBGuard active. Unknown devices are {{ usbguard_implicit_policy | default('block') }}ed.
          The devices attached when the policy was generated are authorised.
          Manage with `it-usb` (list / allow / block / regenerate).
          Lockout recovery: boot to recovery, `systemctl disable --now usbguard`.
