# System 2 -- oikb knowledge-base sync (:8081 -> System 1's Open WebUI API).
# Opt-in: the `oikb` profile only activates when an API key is set in .env.
# Ad hoc:  docker compose --profile oikb up -d
name: oikb
networks:
  oi:
    external: true
services:
  oikb:
    image: oikb:0.3.6-RG
    container_name: oikb
    working_dir: /app
    ports:
    - 8082:8080
    environment:
      OPEN_WEBUI_URL: ${OPEN_WEBUI_URL}
      OPEN_WEBUI_API_KEY: ${OPEN_WEBUI_API_KEY:-}
    volumes:
    - /opt/stacks/oikb/.oikb.yaml:/app/.oikb.yaml
    - magpie_artifacts:/app/artifacts:ro
    entrypoint:
    - oikb
    networks:
    - oi
    command: daemon
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  magpie_artifacts:
    external: true
