---
# powerstrux -- launcher + schedule for the PowerStrux LA audit tool.
#
# PowerStrux itself is NOT installed by this repo: the ReportHTML module and
# Initiate-PowerstruxLA.ps1 are placed by hand, and PowerStruxLAConfig.txt is
# tuned per site. This role only makes the tool easy to RUN -- one script, one
# desktop icon, one schedule -- and deliberately does not touch the config, so
# a hand-tuned config is never overwritten by a pull.
powerstrux_enabled: true

# Where the hand-installed PowerShell entry point lives.
powerstrux_script: /opt/microsoft/powershell/7/Modules/ReportHTML/Initiate-PowerstruxLA.ps1
powerstrux_audit_dir: /opt/_AuditFiles

# Where `it-powerstrux install` looks for the vendor zip. The archive is NOT in
# this repo and never will be -- it is vendor software. Stage it here (or on
# attached media, which install also searches) and run the command.
powerstrux_installer_dir: /opt/it/installers

# The reporting window `install`/`config` write into PowerStruxLAConfig.txt.
# 8 days, so a weekly run always overlaps the previous one and no day falls
# between two reports.
powerstrux_days: 8
powerstrux_log_keep: 26          # ~6 months of weekly runs

# A desktop icon so an auditor can double-click rather than use a shell.
powerstrux_desktop_entry: true

# --- Scheduled run ----------------------------------------------------------
# Wednesday 03:00.
#
# method: 'timer' (systemd) or 'cron' (/etc/cron.d).
#   timer -- Persistent=true, so a run missed while the box was POWERED OFF
#            fires at the next boot. On a laptop that is the difference between
#            a weekly report and no report at all, since 03:00 Wednesday is
#            exactly when a laptop is shut in a bag.
#   cron  -- literal "cron job" if an assessor greps for one; a run missed
#            while powered off is simply lost.
powerstrux_schedule_enabled: true
powerstrux_schedule_method: timer
powerstrux_oncalendar: "Wed *-*-* 03:00:00"
powerstrux_cron: "0 3 * * 3"   # 3 = Wednesday

# --- Weekly offload ---------------------------------------------------------
# The report is the point of the whole role, and until now nothing carried it
# off the box: /etc/cron.weekly/audit-offload collects the AUDITD trail and has
# never looked at /opt/_AuditFiles. This collects the week's report, the run
# logs behind it and the config that produced it into ONE dated folder --
# <YYYY>-W<nn> -- and copies that folder to a Windows file share.
#
# Ordered AFTER the audit rather than guessed at: powerstrux-audit.service
# Wants= the offload and the offload is After= the audit, so the offload runs
# when the audit finishes, however long the audit took.
#
# `it-powerstrux offload setup` writes all of this to /opt/it/site.yml. Set it
# here (or in group_vars) only for a fleet-wide default.
powerstrux_offload_enabled: true
powerstrux_offload_dir: /opt/ia/powerstrux-offload
powerstrux_offload_keep: 26        # week folders kept locally (~6 months)
powerstrux_offload_window_days: 8  # 8, not 7: a run that slipped a day still counts

# Extras. The auditd archive stays OFF by default -- audit-offload owns the
# AU-4 artifact and pushes it separately. Turn it on for one folder per week.
powerstrux_offload_include_audit: false
powerstrux_offload_containers: false
powerstrux_offload_container_names: []   # empty = every container
powerstrux_offload_extra: []             # paths or globs; a directory is copied whole

# The share. OFF until a site sets one -- with it off the week folder is still
# built locally, which is what an air-gapped box carries off on media.
# The PASSWORD never appears here: it lives in the 0600 credentials file that
# `it-powerstrux offload creds` writes.
powerstrux_offload_smb_enabled: false
powerstrux_offload_smb_share: ""                  # //fileserver/audit$
powerstrux_offload_smb_subdir: "{{ ansible_hostname | default('unknown') }}"
powerstrux_offload_smb_credentials: /etc/stig-build/powerstrux-offload.cred
# domain | workgroup | guest -- see the conf template for what each writes.
powerstrux_offload_smb_auth: domain
# vers=3.1.1 is Server 2012 R2 and later. An older NAS or Server 2008 R2 needs
# vers=2.1; `it-powerstrux offload test` says so when the mount fails.
powerstrux_offload_smb_options: "vers=3.1.1,sec=ntlmssp,uid=0,gid=0,file_mode=0640,dir_mode=0750"

# Normally empty: the offload is chained to the audit and needs no timer of its
# own. Set a calendar spec to ALSO run it independently (e.g. a box where the
# reports arrive from somewhere other than the local audit).
powerstrux_offload_oncalendar: ""
