# nginx front-end for `openwiki visualize` (see this image's Dockerfile).
# Included inside nginx's http{} block, so the map below is at the right scope.

# Pass websocket upgrades through untouched (the viewer live-reloads the page
# when a wiki page changes); empty Connection header for ordinary requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # Wiki pages are small; the graph payload can be large.
    client_max_body_size 16m;

    # ---- Vendored front-end libraries (baked into this image) ---------------
    # The viewer asks for https://cdn.jsdelivr.net/npm/<pkg>@<ver>/... ; the
    # sub_filter below rewrites that prefix to /vendor/, and these files are
    # stored under the SAME <pkg>@<ver>/... paths, so the rewrite is a simple
    # prefix swap. Served locally => renders with no internet.
    # `root` (not `alias`) on purpose: /vendor/x -> /usr/share/nginx/vendor/x,
    # and root avoids the well-known alias+try_files edge cases.
    root /usr/share/nginx;
    location /vendor/ {
        access_log off;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # sub_filter cannot rewrite a compressed body -- ask upstream for plain text.
        proxy_set_header Accept-Encoding "";

        # Live reload is a long-lived stream: no buffering, no early timeout.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;

        # ---- The CDN -> local rewrite -------------------------------------
        # Applies to every response body (sub_filter_types *), every occurrence
        # (sub_filter_once off), so all four <script src> tags are redirected.
        sub_filter 'https://cdn.jsdelivr.net/npm/' '/vendor/';
        sub_filter_once off;
        sub_filter_types *;

        # NOTE (cosmetic): the page also links Google Fonts (Inter). That is left
        # alone -- offline the browser simply falls back to a system sans-serif.
        # Everything functional (graph, markdown, mermaid diagrams) is vendored.
    }
}
