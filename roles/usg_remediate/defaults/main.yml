---
# =============================================================================
# usg_remediate defaults -- residual DISA-STIG findings closed after `usg fix`.
# Each block below is individually switchable so a box can opt out of one fix
# without losing the rest.
# =============================================================================

# --- SSH warning banner -----------------------------------------------------
# sshd_enable_warning_banner_net checks for the literal `Banner /etc/issue.net`,
# so a dedicated banner path fails the rule whatever text it holds. The banner
# tasks rewrite /etc/issue.net with the site text on every complete build, so
# pointing sshd there keeps the DCSA/EMI content AND closes the finding.
#
# Set this back to /etc/dcsa-warning-banner if you would rather keep the
# finding and be immune to an interrupted re-run: `usg fix` restores the DoD
# Standard Mandatory Notice to /etc/issue.net and never touches the dedicated
# path, so a build that dies between usg_harden and usg_remediate leaves SSH on
# the DoD text.
usg_ssh_banner_path: /etc/issue.net

usg_fix_log_permissions: true

# Apply the DISA fix for UBTU-24-300009 (chgrp root on any *.so* under
# /lib, /lib64, /usr/lib, /usr/lib64 that is not already group root).
usg_fix_library_group: true

# --- Audited privileged commands (UBTU-24-900080 .. 900330) -----------------
# `usg fix` writes rules for only part of the set the benchmark checks, so ~19
# of these fail an otherwise clean audit. Every path here is exactly what the
# benchmark's OVAL looks for; a path that does not exist on the box is skipped
# (an audit rule naming a missing file makes `augenrules --load` fail).
# --- Legacy audit rule files (pre-USG leftovers) ----------------------------
# A box first built under the ansible-lockdown UBUNTU24-STIG role carries
# /etc/audit/rules.d/stig.rules, whose rules use the OLD form:
#     -F auid!=-1  -k privileged-chage        (lockdown role)
# versus the form the benchmark's OVAL requires, which USG writes:
#     -F auid!=unset -F key=privileged        (usg fix)
#
# Both files load fine -- auditd is happy -- but the OVAL test for each
# privileged command is "every matching line must conform", so ONE stale line
# fails the rule even though a correct line sits right beside it in USG's file.
# On ASP-2 that single file accounted for 22 of 39 findings.
#
# Pruned in place, NOT moved: the same file is the only source of the
# session-event, usergroup-modification, xattr, sudoers, login-event and cron.d
# rules, so removing it wholesale opens 21 findings to close 22. The original is
# kept alongside as <file>.pre-prune.
usg_remove_legacy_audit_rules: true
usg_legacy_audit_rule_files:
  - /etc/audit/rules.d/stig.rules
  - /etc/audit/rules.d/audit.rules.prev
usg_legacy_audit_backup_dir: /root/usg-legacy-audit-rules

# --- Offload audit logs (UBTU-24-900240) ------------------------------------
# The benchmark only checks that /etc/cron.weekly/audit-offload exists and is
# non-empty -- it does not inspect what it does. On a connected box point it at
# a real log host; on an air-gapped box the honest implementation is a local
# staged copy that an operator carries off on removable media, which is what
# the default script does. Set usg_audit_offload_command to replace it.
usg_fix_audit_offload: true
usg_audit_offload_dir: /opt/ia/audit-offload
usg_audit_offload_keep: 8
usg_audit_offload_command: ""

usg_audit_privileged_commands_enabled: true
usg_audit_privileged_commands_key: privileged
usg_audit_privileged_commands:
  - /sbin/apparmor_parser
  - /usr/bin/chacl
  - /usr/bin/chage
  - /usr/bin/chcon
  - /usr/bin/chfn
  - /usr/bin/chsh
  - /usr/bin/crontab
  - /usr/bin/gpasswd
  - /usr/bin/kmod
  - /usr/bin/mount
  - /usr/bin/newgrp
  - /usr/bin/passwd
  - /usr/bin/setfacl
  - /usr/bin/ssh-agent
  - /usr/bin/su
  - /usr/bin/sudo
  - /usr/bin/sudoedit
  - /usr/bin/umount
  - /usr/lib/openssh/ssh-keysign
  - /usr/sbin/modprobe
  - /usr/sbin/pam_timestamp_check
  - /usr/sbin/unix_update
  - /usr/sbin/usermod

# --- systemd-journal permissions (UBTU-24-700020 / 700030) ------------------
# NOTE: journalctl at 0740 is root-execute-only. That is what the benchmark
# requires; admins read logs through `sudo journalctl` (the it-* scripts
# already self-elevate).
usg_fix_journal_permissions: true

# --- Account lockout (UBTU-24-200610) ---------------------------------------
# Written to /etc/security/faillock.conf ONLY -- the PAM stack itself is not
# touched, so this cannot cost anyone a working login.
#
# unlock_time: the STIG's own wording is "until released by an administrator",
# i.e. 0. We default to 900 s instead -- the benchmark accepts any value >= 0,
# and a permanent lock on a standalone laptop is a self-inflicted outage. Set
# it to 0 per box if your ISSM requires the literal reading.
usg_fix_faillock: true
usg_faillock_deny: 3
usg_faillock_fail_interval: 900
usg_faillock_unlock_time: 900

# --- PAM (UBTU-24-300017 / 400220) ------------------------------------------
# faildelay only slows a failed login; rounds only affects password CHANGES.
# Neither can deny an otherwise valid login.
usg_fix_pam_faildelay: true
usg_pam_faildelay_us: 4000000

# The benchmark's value (100000) is an SHA-512-crypt iteration count, but
# Ubuntu 24.04's pam_unix hashes with YESCRYPT, whose cost parameter only
# accepts 1..11 -- measured against libcrypt directly, crypt_gensalt("$y$", N)
# RETURNS NULL for both 5000 and 100000; it does not clamp them. `usg fix`
# already writes rounds=5000, so 100000 is not a new risk: both values are
# equally out of range, and this only changes which one is on the line.
#
# What that means for the box is worth checking once, because it is a bigger
# deal than the finding: if pam_unix passes the value straight through, an
# out-of-range rounds= makes `passwd` fail on EVERY hardened box, and it has
# been that way since `usg fix` first ran. Verify with a throwaway account:
#     sudo useradd -M -s /usr/sbin/nologin pwtest && sudo passwd pwtest
#     sudo getent shadow pwtest | cut -d: -f2 | cut -c1-8   # $y$j9T$ = default
#     sudo userdel pwtest
# A cost prefix of jFT means pam_unix clamped to 11 (~8 s per password change,
# login is unaffected -- it reads the cost from the stored hash). A `passwd`
# that errors means set usg_fix_pam_rounds: false and raise the finding as a
# deviation instead.
usg_fix_pam_rounds: true
usg_pam_unix_rounds: 100000

# Re-assert the file/dir modes immediately before the post-build re-audit, after
# handlers and daemon restarts have had their chance to reset them.
usg_final_permission_sweep: true

# ufw_rate_limit (UBTU-24-600200): SSH only -- see the task for why the other
# listening ports are left alone.
usg_ufw_rate_limit_ssh: true

# PAM stack edits for faillock + faildelay, via pam-auth-update profiles.
#
# OFF until it has been proven on a throwaway box. This closes seven findings
# and it is the right mechanism -- pam-auth-update, not a line edit -- but it
# regenerates /etc/pam.d/common-auth, and the failure mode is an operator who
# cannot log in. That is not hypothetical here: ASP-2 spent an afternoon
# unloggable because a pre-USG role inserted pam_faillock lines without
# recalculating pam_unix's jump offset, and recovery needed a live USB.
#
# The specific thing not yet verified is how pam-auth-update computes
# `success=N` for pam_unix once the two faillock profiles join the Primary
# block. If it counts only the entries it assigns jumps to, pam_unix could
# land on `[default=die] pam_faillock.so authfail` and deny every login --
# byte-identical in shape to the bug that just bit us.
#
# To enable safely: set true on ONE non-production box, run the build, then
# BEFORE logging out of your session open a second TTY and log in there. Or
# check without logging out at all:
#     sudo pam-auth-check /etc/pam.d/common-auth
# The role runs that check itself and rolls back from a backup on failure, but
# a second TTY is the test that cannot lie to you.
usg_fix_pam_stack: false

# Where the PAM auth-stack checker is installed.
pam_auth_check_path: /usr/local/sbin/pam-auth-check

# Remove `nullok` from the PAM stack (UBTU-24-300028). Only narrows what
# pam_unix accepts, so it cannot reject a currently-valid password.
usg_fix_pam_nullok: true
