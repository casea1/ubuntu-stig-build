# System 1 -- Postgres + pgvector (Open WebUI DB + vector index). Password from
# .env (POSTGRES_PASSWORD, auto-generated).
name: pgvector
networks:
  oi:
    external: true
volumes:
  pgvector-data:
    external: true
services:
  pgvector:
    image: pgvector/pgvector:pg16-trixie
    container_name: pgvector
    environment:
      POSTGRES_DB: openwebui
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    command:
    - postgres
    - -c
    - max_connections=250
    - -c
    - shared_buffers=1GB
    - -c
    - effective_cache_size=4GB
    - -c
    - maintenance_work_mem=512MB
    - -c
    - work_mem=32MB
    - -c
    - wal_buffers=16MB
    - -c
    - checkpoint_completion_target=0.9
    - -c
    - max_wal_size=2GB
    - -c
    - min_wal_size=512MB
    - -c
    - random_page_cost=1.1
    - -c
    - effective_io_concurrency=200
    - -c
    - default_statistics_target=100
    - -c
    - max_parallel_workers_per_gather=4
    - -c
    - max_parallel_workers=8
    - -c
    - max_worker_processes=8
    - -c
    - statement_timeout=300000
    - -c
    - idle_in_transaction_session_timeout=600000
    - -c
    - log_connections=off
    - -c
    - log_disconnections=off
    - -c
    - log_min_duration_statement=1000
    volumes:
    - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d openwebui
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
    - oi
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
