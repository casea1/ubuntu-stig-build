---
# =============================================================================
# pro_attach -- Ubuntu Pro attach, and the FIPS enable, EARLY in the play.
#
# Split out of usg_harden so the FIPS enable happens BEFORE fpga_tools turns on
# i386 multiarch. On dev-16 that order was the difference between FIPS working
# and not:
#
#   ubuntu-fips-userspace : Depends: libgcrypt20 (= 1.12.0-2ubuntu0.1~Fips1~rc11)
#                                    but 1.10.3-2ubuntu0.2 is to be installed
#
# libgcrypt20 is `Multi-Arch: same`, so its amd64 and i386 copies MUST hold the
# same version -- and the fips-updates suite publishes binary-amd64 only. Once
# fpga_tools has pulled in libgcrypt20:i386 (via libsystemd0:i386), apt cannot
# move the amd64 copy to the FIPS version without an i386 build that does not
# exist, and the enable is unsatisfiable on a box that was fine an hour earlier.
# Enabling first leaves fpga_tools to install whatever i386 still resolves,
# which it already probes for with `apt-get -s` and skips per package.
#
# usg_harden includes this role rather than duplicating it, so the attach logic
# lives in one place and the second pass is a no-op: the attach is skipped when
# already attached and the FIPS enable when already enabled.
#
# NOT SOLVED HERE: the second unmet dependency, libgnutls30 (= 3.8.3-...+Fips1.2),
# which the box carries as libgnutls30t64 after noble's time_t transition. That
# one is unaffected by ordering. See trap 43.
# =============================================================================

- name: "PRO | Ensure the Ubuntu Pro client is installed"
  ansible.builtin.apt:
    name: ubuntu-pro-client
    state: present
    update_cache: true
    cache_valid_time: 3600

# ---- Resolve the Pro token (secret; out-of-band) ---------------------------
- name: "PRO | Look for an out-of-band Pro token file"
  ansible.builtin.slurp:
    src: "{{ ubuntu_pro_token_file }}"
  register: _pro_token_slurp
  failed_when: false
  when: (ubuntu_pro_token | default('') | length) == 0

- name: "PRO | Resolve the effective Pro token"
  ansible.builtin.set_fact:
    _pro_token: >-
      {{ ubuntu_pro_token if (ubuntu_pro_token | default('') | length) > 0
         else ((_pro_token_slurp.content | b64decode | trim)
               if (_pro_token_slurp is defined and _pro_token_slurp.get('content')) else '') }}
  no_log: true

# ---- Attach ----------------------------------------------------------------
- name: "PRO | Check whether this box is already Pro-attached"
  ansible.builtin.command: pro status --format json
  register: _pro_status_raw
  changed_when: false
  check_mode: false      # read-only probe: must run in --check too
  failed_when: false

- name: "PRO | Determine current attach state"
  ansible.builtin.set_fact:
    _pro_attached: >-
      {{ ((_pro_status_raw.stdout | from_json).attached | default(false))
         if (_pro_status_raw.rc == 0 and (_pro_status_raw.stdout | default('') | length) > 0)
         else false }}

- name: "PRO | Attach to Ubuntu Pro (uses the resolved token)"
  ansible.builtin.command: "pro attach {{ _pro_token }}"
  when:
    - not _pro_attached
    - (_pro_token | length) > 0
  register: _pro_attach
  no_log: true
  changed_when: _pro_attach.rc == 0
  # Safe-by-default: a bad token / network error becomes a POA&M skip (below),
  # not a hard build abort.
  failed_when: false

# Re-read the real attach state instead of trusting the attach rc / first parse.
# This is robust to an already-attached box (attach skipped) AND to any quirk in
# the initial status parse: _usg_active reflects what `pro` actually reports now.
- name: "PRO | Re-check attach state after the attach attempt"
  ansible.builtin.command: pro status --format json
  register: _pro_status_final
  changed_when: false
  check_mode: false      # read-only probe: must run in --check too
  failed_when: false

- name: "PRO | Mark USG active based on the authoritative post-attach status"
  ansible.builtin.set_fact:
    _usg_active: >-
      {{ ((_pro_status_final.stdout | from_json).attached | default(false))
         if (_pro_status_final.rc == 0 and (_pro_status_final.stdout | default('') | length) > 0)
         else false }}

# Which Pro services are ALREADY on. Read from the status document we just
# fetched, because `pro enable <x>` on a service that is already enabled is not
# free: it contacts contracts.canonical.com first ("One moment, checking your
# subscription first") and can fail there for reasons that have nothing to do
# with the service. On dev-15 that was
#   An unexpected error occurred: [CRYPTO] unknown error (_ssl.c:3026)
# -- a TLS failure inside the pro client on a FIPS kernel -- and it stopped the
# whole pull at usg_harden, leaving everything after it unrun, on a box where
# fips-updates was ALREADY ENABLED and nothing needed doing.
#
# The old guard tolerated "is already enabled" in pro's own output, which only
# helps when pro gets far enough to say it. Ask the box, not the command.
- name: "PRO | Which Pro services are already enabled"
  ansible.builtin.set_fact:
    _pro_enabled: >-
      {{ ((_pro_status_final.stdout | from_json).services | default([])
          | selectattr('status', 'equalto', 'enabled')
          | map(attribute='name') | list)
         if (_pro_status_final.rc == 0 and (_pro_status_final.stdout | default('') | length) > 0)
         else [] }}

- name: "PRO | POA&M WARNING -- not Pro-attached, skipping USG hardening"
  ansible.builtin.debug:
    msg: >-
      Ubuntu Pro is NOT attached and no token was supplied
      (ubuntu_pro_token / {{ ubuntu_pro_token_file }}). USG DISA-STIG hardening is
      SKIPPED -- track as a POA&M. Provide a token (bootstrap.sh prompt, or the
      out-of-band file) and re-run to harden this box.
  when: not (_usg_active | default(false) | bool)

- name: "PRO | Enable FIPS (fips-updates) -- swaps the kernel, needs a reboot"
  ansible.builtin.command: pro enable fips-updates --assume-yes
  register: _fips_enable
  when:
    # Attached, or there is nothing to enable against. These tasks used to sit
    # inside usg_harden's `when: _usg_active` block and lost that guard on the
    # way out; without it an unattached box runs a `pro enable` that can only
    # fail, five times, 15s apart.
    - _usg_active | default(false) | bool
    - usg_enable_fips | default(false) | bool
    - "'fips-updates' not in (_pro_enabled | default([]))"
  changed_when: _fips_enable.rc == 0 and 'is already enabled' not in _fips_enable.stdout
  failed_when: false
  # Same transport risk as the usg enable above; same tolerated retry.
  retries: 5
  delay: 15
  until: _fips_enable.rc == 0

# Ask pro what is true now rather than trusting the rc above (trap 40), and
# because `failed_when: false` makes that rc meaningless anyway.
- name: "PRO | Re-read Pro status after the FIPS attempt"
  ansible.builtin.command: pro status --format json
  register: _pro_status_fips
  when:
    - usg_enable_fips | default(false) | bool
    - _fips_enable is defined
    - _fips_enable is not skipped
  changed_when: false
  failed_when: false
  check_mode: false

- name: "PRO | Is fips-updates enabled now?"
  ansible.builtin.set_fact:
    _fips_enabled_now: >-
      {{ ('fips-updates' in (_pro_enabled | default([])))
         or ((_pro_status_fips is defined and _pro_status_fips is not skipped
              and _pro_status_fips.rc | default(1) == 0
              and (_pro_status_fips.stdout | default('') | length) > 0)
             and ('fips-updates' in ((_pro_status_fips.stdout | from_json).services | default([])
                                     | selectattr('status', 'equalto', 'enabled')
                                     | map(attribute='name') | list))) }}

# Only when the enable actually ran AND actually took. Demanding a reboot
# after a FIPS enable that failed would send an operator to reboot a box
# into the kernel it already had, looking for a change that never happened.
- name: "PRO | FIPS enabled -> reboot required"
  ansible.builtin.set_fact:
    usg_reboot_required: true
  when:
    - usg_enable_fips | default(false) | bool
    - _fips_enable is defined
    - _fips_enable is not skipped
    - _fips_enabled_now | default(false) | bool

- name: "PRO | POA&M WARNING -- FIPS requested but NOT enabled"
  ansible.builtin.debug:
    msg: >-
      `pro enable fips-updates` did not succeed, so this box is NOT running
      in FIPS mode. Track as a POA&M. The rest of the baseline still
      applies. pro said:
      {{ ((_fips_enable.stdout | default('')) ~ ' ' ~ (_fips_enable.stderr | default(''))) | trim }}
      On noble this is EXPECTED as of 2026-09-08 and the cause is upstream:
      ubuntu-fips-userspace 1.4.0~rc13 depends on libgnutls30, a name that has
      not existed since noble's time_t rename -- and the FIPS suite itself
      ships libgnutls30t64 at the exact version asked for. Nothing on this box
      fixes that. It is a POA&M and a Canonical case; see trap 43.
      Diagnosing a DIFFERENT failure: the reason is written only to
      /var/log/ubuntu-advantage.log, and `apt-get -s install ubuntu-fips`
      afterwards tells you nothing because pro deletes the repo when the
      install fails. Query apt during its retry window instead (trap 43).
  when:
    - usg_enable_fips | default(false) | bool
    - _fips_enable is defined
    - _fips_enable is not skipped
    - not (_fips_enabled_now | default(false) | bool)
