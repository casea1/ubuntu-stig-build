# System 2 -- OpenWiki generator. On-demand (`tools` profile; never auto-starts):
#   cd /opt/stacks/openwiki && docker compose run --rm openwiki openwiki <args>
# Writes into the openwiki-out volume; browse it via the `openwiki-view` stack.
name: openwiki
networks:
  oi: { external: true }
volumes:
  openwiki-out: { external: true }
services:
  openwiki:
    image: openwiki:latest
    container_name: openwiki
    profiles: ["tools"]
    extra_hosts:
      - "${SYSTEM1_HOSTS_ENTRY:-localhost:127.0.0.1}"
    working_dir: /work
    volumes:
      - openwiki-out:/work
    # Use System 1's vLLM instead of api.openai.com. Read straight from the
    # environment, so no `openwiki auth` step is needed.
    environment:
      OPENWIKI_PROVIDER: "${OPENWIKI_PROVIDER:-openai-compatible}"
      OPENAI_COMPATIBLE_BASE_URL: "${OPENAI_COMPATIBLE_BASE_URL:-http://dev-ai1:8000/v1}"
      OPENAI_COMPATIBLE_API_KEY: "${OPENAI_COMPATIBLE_API_KEY:-not-used}"
      OPENWIKI_MODEL_ID: "${OPENWIKI_MODEL_ID:-gpt-oss-120b}"
    networks: [oi]
