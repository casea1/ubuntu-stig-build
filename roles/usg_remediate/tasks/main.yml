---
# =============================================================================
# usg_remediate -- close the REASONABLE residual DISA-STIG findings that `usg fix`
# leaves open, on BOTH profiles, running AFTER usg_harden AND the firewall roles.
#
# WHY this role exists: `usg fix` is stamped run-once, and the `usg audit` inside
# usg_harden is a snapshot taken MID-BUILD (before the firewall roles bring ufw
# up), so a handful of findings show open in that report. Everything here is
# idempotent and re-applied every ansible-pull (config-drift correction). Nothing
# here can lock out password login.
#
# Deliberately left as POA&M (NOT auto-fixed -- each needs a secret, infra, or a
# kernel swap): FIPS mode (usg_enable_fips), UEFI/GRUB boot-loader password (needs
# a hashed secret), audit-log offload (needs a remote collector). The SSSD/CAC
# rules are de-selected in the tailoring instead (see usg_disable_smartcard_rules).
# =============================================================================

# ---------------------------------------------------------------------------
# 1) SMART CARD / pam_pkcs11 cleanup
# Fixes "ERROR:pam_pkcs11.c:365: no suitable token available / Error 2308: No
# smart card found" on boxes hardened BEFORE the smartcard tailoring opt-out
# existed (smartcard_pam_enabled had already wired pam_pkcs11.so into the stack,
# and `usg fix` is stamped run-once so it won't undo it). We simply COMMENT OUT
# the pam_pkcs11 auth line -- this removes an auth *requirement*, never touches
# pam_unix, so password login cannot be lost.
# ---------------------------------------------------------------------------
- name: "REMED | Smart card / pam_pkcs11 cleanup"
  when: usg_cleanup_pam_pkcs11 | default(true) | bool
  block:
    - name: "REMED | Find pam.d files that still reference pam_pkcs11"
      ansible.builtin.find:
        paths: /etc/pam.d
        patterns: "*"
        contains: 'pam_pkcs11\.so'
        file_type: file
      register: _pkcs11_pam

    - name: "REMED | Comment out active pam_pkcs11 lines (keeps pam_unix intact)"
      ansible.builtin.replace:
        path: "{{ item.path }}"
        # Match an uncommented auth line whose MODULE is pam_pkcs11.so; prefix '#'.
        # The [^#]* (not .*) before the module ensures we never match a line where
        # pam_pkcs11.so only appears in an inline comment after a DIFFERENT module
        # (e.g. `auth required pam_unix.so # pam_pkcs11.so`) -- commenting that out
        # would drop pam_unix and could lock the box out.
        regexp: '(?m)^(?!\s*#)(\s*auth\s+[^#]*\bpam_pkcs11\.so.*)$'
        replace: '#\1  # disabled by usg_remediate (password-login only)'
      loop: "{{ _pkcs11_pam.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"

    # Rare on this fleet (SSG edits common-auth directly rather than shipping a
    # pam-auth-update profile), but if one exists, `pam-auth-update` could re-add
    # the module on a future package trigger. Surface it so the operator can
    # `pam-auth-update` it off; we don't auto-edit pam-configs (regeneration risk).
    - name: "REMED | Detect a pam-auth-update pkcs11 profile (advisory)"
      ansible.builtin.find:
        paths: /usr/share/pam-configs
        patterns: "*"
        contains: 'pam_pkcs11\.so'
        file_type: file
      register: _pkcs11_profile

    - name: "REMED | Warn if a pkcs11 pam-config profile is present"
      ansible.builtin.debug:
        msg: >-
          A pam-auth-update profile referencing pam_pkcs11 exists
          ({{ _pkcs11_profile.files | map(attribute='path') | list | join(', ') }}).
          The active auth line was commented out, but run
          `sudo pam-auth-update` and untick PKCS#11 so it isn't re-added on a
          package update.
      when: (_pkcs11_profile.files | default([]) | length) > 0

# ---------------------------------------------------------------------------
# 1b) LOGIN BANNER for console + SSH
# USG/STIG writes the DoD Standard Mandatory Notice to /etc/issue.net (and points
# sshd at it) on EVERY `usg fix`, so SSH/console logins show the DoD banner. We
# want the box's configured banner instead (gui_banner_text -- the DCSA banner,
# or emi_unclass_banner on the unclassified EMI variant). To make this survive
# interrupted re-runs (USG re-writes /etc/issue.net each run; if a later run dies
# before this role, an sshd pointed at /etc/issue.net would revert to DoD), sshd
# is pointed at a DEDICATED file (/etc/dcsa-warning-banner) that USG never
# touches, via a drop-in that sorts FIRST. /etc/issue.net + /etc/issue are still
# overwritten so no DoD text lingers. Same documented text deviation as the GUI.
# ---------------------------------------------------------------------------
- name: "REMED | Login banner (console + SSH)"
  when:
    - usg_ssh_banner_dcsa | default(true) | bool
    - (gui_banner_text | default('') | length) > 0
  block:
    - name: "REMED | Write the banner to a DEDICATED file USG never rewrites"
      # sshd points HERE, not at /etc/issue.net. `usg fix` re-writes the DoD
      # Standard Mandatory Notice into /etc/issue.net on EVERY run, so an sshd
      # pointed at /etc/issue.net reverts to the DoD banner whenever a later
      # re-run is interrupted before this role runs. USG never touches this
      # dedicated path, so once one complete build writes it, SSH stays on the
      # DCSA banner across interrupted re-runs.
      ansible.builtin.template:
        src: issue.net.j2
        dest: /etc/dcsa-warning-banner
        owner: root
        group: root
        mode: "0644"

    - name: "REMED | Also overwrite /etc/issue.net + /etc/issue (leave no DoD text behind)"
      ansible.builtin.template:
        src: issue.net.j2
        dest: "{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - /etc/issue.net
        - /etc/issue

    - name: "REMED | Pin sshd at the dedicated DCSA banner (sorts FIRST -> wins over USG)"
      # 00-0-... sorts before USG's 00-complianceascode-*.conf; sshd uses the
      # FIRST Banner value it reads, so ours wins regardless of USG's drop-in.
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-0-dcsa-banner.conf
        content: "Banner /etc/dcsa-warning-banner\n"
        owner: root
        group: root
        mode: "0644"
      notify: Restart ssh

    - name: "REMED | Remove the superseded drop-in (older name, pointed at /etc/issue.net)"
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/00-dcsa-banner.conf
        state: absent
      notify: Restart ssh

    - name: "REMED | Swap USG's post-auth DoD acknowledgement (ssh_confirm.sh) to DCSA"
      # `usg fix` drops /etc/profile.d/ssh_confirm.sh with the DoD Standard
      # Mandatory Notice HARDCODED plus a y/N gate, shown AFTER SSH auth (this is
      # the "USG banner" seen post-password). Overwrite it to display the durable
      # /etc/dcsa-warning-banner instead, keeping the acknowledgement gate (a
      # legitimate consent control) but on the DCSA/EMI text. USG regenerates the
      # DoD version on each `usg fix`; this task (running after usg_harden)
      # re-swaps it every complete build.
      ansible.builtin.copy:
        dest: /etc/profile.d/ssh_confirm.sh
        owner: root
        group: root
        mode: "0644"
        content: |
          #!/bin/bash
          # Managed by usg_remediate -- do not edit by hand. Shows the site
          # warning banner (/etc/dcsa-warning-banner: DCSA, or the EMI banner on
          # the unclassified EMI variant) and requires acknowledgement on
          # interactive SSH logins. Replaces USG's hardcoded DoD-text version.
          # `[ -t 0 ]` (stdin is a real terminal) keeps the read loop from
          # spinning on NON-interactive SSH (scp, git, VS Code Remote-SSH), which
          # set $SSH_CLIENT but have no TTY to answer the prompt.
          if [ -t 0 ] && { [ -n "$SSH_CLIENT" ] || [ -n "$SSH_TTY" ]; }; then
              _banner=/etc/dcsa-warning-banner
              while true; do
                  [ -s "$_banner" ] && cat "$_banner"
                  read -p "
          Do you agree? [y/N] " yn
                  case "$yn" in
                      [Yy]* ) break ;;
                      [Nn]* ) exit 1 ;;
                  esac
              done
          fi

# ---------------------------------------------------------------------------
# 2) /var/log FILE PERMS + /var/log/audit DIR MODE
# file_permissions_var_log_stig (UBTU-24-700010) + directory_permissions_var_log_audit
# ---------------------------------------------------------------------------
- name: "REMED | /var/log permission fixes"
  when: usg_fix_log_permissions | default(true) | bool
  block:
    - name: "REMED | Find over-permissive files under /var/log (UBTU-24-700010)"
      # Mirrors the DISA remediation: any file with setuid/setgid/exec or
      # group/other-write/other-read+sticky, excluding the wtmp/btmp/lastlog files.
      ansible.builtin.command:
        cmd: >-
          find -P /var/log/ -perm /u+xs,g+xws,o+xwrt
          ! -name "[bw]tmp" ! -name "[bw]tmp.*" ! -name "[bw]tmp-*"
          ! -name "lastlog" ! -name "lastlog.*"
          -type f -regextype posix-extended -regex ".*"
      register: _var_log_bad
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "REMED | Tighten perms on those files (u-xs,g-xws,o-xwrt)"
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "u-xs,g-xws,o-xwrt"
        state: file
      loop: "{{ _var_log_bad.stdout_lines | default([]) }}"
      loop_control:
        label: "{{ item }}"

    - name: "REMED | Stat /var/log/audit"
      ansible.builtin.stat:
        path: /var/log/audit
      register: _audit_dir

    # The required mode is CONDITIONAL, which is why a flat 0750 failed the
    # scan: the benchmark wants 0750 only when auditd.conf's log_group is a
    # group other than root, and 0700 when it is root (or unset).
    - name: "REMED | Read auditd's log_group"
      ansible.builtin.command:
        cmd: "awk -F= '/^[[:space:]]*log_group[[:space:]]*=/ {gsub(/ /,\"\",$2); print $2}' /etc/audit/auditd.conf"
      register: _audit_log_group
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "REMED | /var/log/audit mode (0750 with a non-root log_group, else 0700)"
      ansible.builtin.file:
        path: /var/log/audit
        state: directory
        mode: "{{ '0750' if (_audit_log_group.stdout | default('') | trim) not in ['', 'root'] else '0700' }}"
      when:
        - _audit_dir.stat.exists | default(false)
        - _audit_dir.stat.isdir | default(false)

# ---------------------------------------------------------------------------
# 3) CHRONY -- remote time source, configured DIRECTLY IN /etc/chrony/chrony.conf.
# The SSG OVAL reads chrony.conf (and its confdir includes) but NOT sourcedir/
# *.sources, so the directives must live in chrony.conf to satisfy:
#   chronyd_specify_remote_server  -> a `server` line
#   chronyd_server_directive       -> `server` (not `pool`)
#   chronyd_or_ntpd_set_maxpoll    -> `maxpoll <N>` on each server line
#   chronyd_sync_clock             -> a `makestep` line
# ---------------------------------------------------------------------------
- name: "REMED | Chrony remote time source (STIG server directive)"
  when: (usg_chrony_servers | default([]) | length) > 0
  block:
    - name: "REMED | Is chrony configured on this box?"
      ansible.builtin.stat:
        path: /etc/chrony/chrony.conf
      register: _chrony_conf

    - name: "REMED | Configure chrony directives in chrony.conf"
      when: _chrony_conf.stat.exists | default(false)
      block:
        - name: "REMED | Comment out `pool` directives (STIG wants server-only)"
          ansible.builtin.replace:
            path: /etc/chrony/chrony.conf
            regexp: '(?m)^(?!\s*#)(\s*)(pool\s+.*)$'
            replace: '\1# \2  # disabled by usg_remediate (STIG: server directive)'
          notify: Restart chrony

        - name: "REMED | Write the STIG time servers into chrony.conf (server + iburst + maxpoll)"
          ansible.builtin.blockinfile:
            path: /etc/chrony/chrony.conf
            marker: "# {mark} ANSIBLE MANAGED -- usg_remediate DISA-STIG time source"
            block: |
              {% for s in usg_chrony_servers %}
              server {{ s }} iburst maxpoll {{ usg_chrony_maxpoll | default(16) }}
              {% endfor %}
          notify: Restart chrony

        - name: "REMED | Ensure a makestep directive is present (chronyd_sync_clock)"
          ansible.builtin.lineinfile:
            path: /etc/chrony/chrony.conf
            regexp: '^\s*#?\s*makestep\b.*$'
            line: "{{ usg_chrony_makestep }}"
            state: present
          when: (usg_chrony_makestep | default('') | length) > 0
          notify: Restart chrony

        - name: "REMED | Remove the stale sources.d drop-in from the old approach"
          ansible.builtin.file:
            path: /etc/chrony/sources.d/stig.sources
            state: absent
          notify: Restart chrony

# ---------------------------------------------------------------------------
# 4) UFW ACTIVE (check_ufw_active) -- belt-and-suspenders. The firewall roles
# already enable ufw before this role; re-assert so an audit-only build (USG
# skipped) is never left with an inactive firewall.
# ---------------------------------------------------------------------------
- name: "REMED | Ensure ufw is active"
  community.general.ufw:
    state: enabled

# ---------------------------------------------------------------------------
# 5) SYSTEM REBOOT / SHUTDOWN AUDITING (all profiles).
# USG's STIG ruleset does not ship an explicit reboot-audit rule; auditd records
# SYSTEM_BOOT/SYSTEM_SHUTDOWN natively but without a searchable audit key. Drop a
# rule for the reboot(2) + kexec_load syscalls -- the kernel entry points for
# reboot/poweroff/halt/kexec no matter which tool (shutdown, reboot, systemctl,
# ...) triggered them -- keyed so it's greppable (`ausearch -k {{ audit_reboot_rules_key }}`).
# augenrules concatenates *.rules in name order; 71- keeps this BEFORE USG's
# 99-*-finalize `-e 2` (immutable) line. Because `usg fix` has already set the
# running config immutable, a live `augenrules --load` is refused -- the rule is
# staged in rules.d and loaded by the audit service on the post-build REBOOT.
# ---------------------------------------------------------------------------
- name: "REMED | System reboot/shutdown audit rule"
  when: audit_reboot_rules_enabled | default(true) | bool
  block:
    - name: "REMED | Is auditd's rules.d present? (skip on a box without auditd)"
      ansible.builtin.stat:
        path: /etc/audit/rules.d
      register: _audit_rulesd

    - name: "REMED | Install the reboot/shutdown audit rule (key={{ audit_reboot_rules_key | default('reboot') }})"
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/71-reboot.rules
        owner: root
        group: root
        mode: "0600"          # file_permissions_etc_audit_rulesd wants 0600
        content: |
          ## Managed by usg_remediate -- do not edit by hand.
          ## Audit system reboot / shutdown / power-off / kexec. reboot(2) is the
          ## kernel entry point for reboot, poweroff and halt; kexec_load(2) is the
          ## kexec reboot path. Keyed '{{ audit_reboot_rules_key | default('reboot') }}'
          ## -> find them with: ausearch -k {{ audit_reboot_rules_key | default('reboot') }}
          -a always,exit -F arch=b64 -S reboot -S kexec_load -k {{ audit_reboot_rules_key | default('reboot') }}
          -a always,exit -F arch=b32 -S reboot -S kexec_load -k {{ audit_reboot_rules_key | default('reboot') }}
      when: _audit_rulesd.stat.exists | default(false)
      notify: Load audit rules

# ---------------------------------------------------------------------------
# 5c) AUDIT THE PRIVILEGED COMMANDS THE BENCHMARK CHECKS (UBTU-24-900080..900330)
# `usg fix` writes this class of rule for only part of the set -- su, fdisk,
# kmod, modprobe and unix_update pass while chfn/chsh/chage/passwd/gpasswd/
# usermod/newgrp/crontab/mount/umount/sudo/sudoedit/ssh-agent/ssh-keysign/
# pam_timestamp_check/apparmor_parser/chcon/setfacl/chacl all fail. That single
# gap is the majority of the residual findings on a fully built box.
#
# Only paths that EXIST are written: auditctl rejects a path rule for a missing
# file, which would make `augenrules --load` fail as a whole. Commands already
# covered by another rules.d file are skipped too, so we never load a duplicate
# rule (auditctl errors on "Rule exists"); our own file is excluded from that
# scan or the block would delete its own rules on the next run.
#
# 72- keeps this after USG's own files and before its 99-*-finalize `-e 2`.
# As with 71-reboot.rules, `usg fix` has already made the running config
# immutable, so these load on the next reboot rather than immediately.
# ---------------------------------------------------------------------------
- name: "REMED | Audit rules for privileged commands"
  when: usg_audit_privileged_commands_enabled | default(true) | bool
  block:
    - name: "REMED | Is auditd's rules.d present?"
      ansible.builtin.stat:
        path: /etc/audit/rules.d
      register: _privcmd_rulesd

    - name: "REMED | Which privileged-command binaries exist on this box?"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ usg_audit_privileged_commands }}"
      register: _privcmd_stat
      loop_control:
        label: "{{ item }}"
      when: _privcmd_rulesd.stat.exists | default(false)

    - name: "REMED | Read the audit rules USG already wrote (excluding our own file)"
      ansible.builtin.shell:
        cmd: >-
          find /etc/audit/rules.d -maxdepth 1 -name '*.rules'
          ! -name '72-privileged-commands.rules' -exec cat {} +
      register: _privcmd_existing
      changed_when: false
      failed_when: false
      check_mode: false
      when: _privcmd_rulesd.stat.exists | default(false)

    # Two steps, not one expression with vars: `difference` on a real list is
    # unambiguous. Paths are compared whole, so /usr/bin/su is never mistaken
    # for the /usr/bin/sudo rule the way a substring match would.
    - name: "REMED | Which commands does an existing rule already cover?"
      ansible.builtin.set_fact:
        _privcmd_covered: "{{ _privcmd_existing.stdout | default('') | regex_findall('-F path=(\\S+)') }}"
      when: _privcmd_rulesd.stat.exists | default(false)

    - name: "REMED | Build the list of commands still needing a rule"
      ansible.builtin.set_fact:
        _privcmd_missing: >-
          {{ _privcmd_stat.results
             | selectattr('stat.exists', 'defined') | selectattr('stat.exists')
             | map(attribute='item') | list
             | difference(_privcmd_covered) }}
      when: _privcmd_rulesd.stat.exists | default(false)

    - name: "REMED | Install the privileged-command audit rules (key={{ usg_audit_privileged_commands_key }})"
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/72-privileged-commands.rules
        owner: root
        group: root
        mode: "0600"
        content: |
          ## Managed by usg_remediate -- do not edit by hand.
          ## Privileged commands the DISA benchmark checks that `usg fix` did not
          ## cover. Find them with: ausearch -k {{ usg_audit_privileged_commands_key }}
          {% for cmd in _privcmd_missing %}
          -a always,exit -F path={{ cmd }} -F perm=x -F auid>=1000 -F auid!=unset -F key={{ usg_audit_privileged_commands_key }}
          {% endfor %}
      when: _privcmd_rulesd.stat.exists | default(false)
      notify: Load audit rules

    - name: "REMED | /etc/audit/rules.d/*.rules must be 0600 (UBTU-24-900040)"
      ansible.builtin.shell:
        cmd: >-
          find /etc/audit/rules.d -maxdepth 1 -name '*.rules' -perm /0177
          -exec chmod 0600 {} + -print
      register: _rulesd_perm
      changed_when: (_rulesd_perm.stdout | default('') | trim) | length > 0

# ---------------------------------------------------------------------------
# 5d) SYSTEMD-JOURNAL PERMISSIONS (UBTU-24-700020 / 700030)
# The journal directories must be 2750 or tighter and `journalctl` itself 0740.
# 0740 means journalctl is root-execute-only -- admins read logs with `sudo
# journalctl`, which is what every it-* script already does.
# ---------------------------------------------------------------------------
- name: "REMED | systemd-journal permissions"
  when: usg_fix_journal_permissions | default(true) | bool
  block:
    - name: "REMED | Journal directories must be 2750 or less permissive"
      ansible.builtin.shell:
        cmd: >-
          find /run/log/journal /var/log/journal -maxdepth 1 -type d
          -perm /0027 -exec chmod g-w,o-rwx {} + -print 2>/dev/null || true
      register: _journal_dirs
      changed_when: (_journal_dirs.stdout | default('') | trim) | length > 0

    - name: "REMED | journalctl must be mode 0740"
      ansible.builtin.file:
        path: /usr/bin/journalctl
        mode: "0740"
        state: file

# ---------------------------------------------------------------------------
# 5e) ACCOUNT LOCKOUT (UBTU-24-200610)
# Five rules -- deny / fail_interval / unlock_time / audit / silent -- all read
# from /etc/security/faillock.conf. We write ONLY that file; pam_faillock is
# already wired into the PAM stack by USG, so nothing here can cost a working
# login. See defaults/main.yml for the unlock_time reasoning.
# ---------------------------------------------------------------------------
- name: "REMED | Account lockout policy (faillock.conf)"
  when: usg_fix_faillock | default(true) | bool
  block:
    - name: "REMED | Is faillock.conf present? (skip where pam_faillock is absent)"
      ansible.builtin.stat:
        path: /etc/security/faillock.conf
      register: _faillock_conf

    - name: "REMED | Set the faillock directives"
      ansible.builtin.lineinfile:
        path: /etc/security/faillock.conf
        regexp: "{{ item.re }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { re: '^\s*#?\s*deny\s*=', line: "deny = {{ usg_faillock_deny }}" }
        - { re: '^\s*#?\s*fail_interval\s*=', line: "fail_interval = {{ usg_faillock_fail_interval }}" }
        - { re: '^\s*#?\s*unlock_time\s*=', line: "unlock_time = {{ usg_faillock_unlock_time }}" }
        - { re: '^\s*#?\s*audit\s*$', line: "audit" }
        - { re: '^\s*#?\s*silent\s*$', line: "silent" }
      loop_control:
        label: "{{ item.line }}"
      when: _faillock_conf.stat.exists | default(false)

# ---------------------------------------------------------------------------
# 5f) PAM: FAILED-LOGON DELAY + PASSWORD HASHING ROUNDS
# UBTU-24-300017 (pam_faildelay) and UBTU-24-400220 (pam_unix rounds).
# faildelay only slows a login that already failed; rounds only applies when a
# password is CHANGED. Neither can reject a valid password, which is what keeps
# them inside this role's "cannot lock out password login" rule. The
# pam_faildelay.so module is checked for first -- a `required` line naming a
# module that isn't installed WOULD break login.
# ---------------------------------------------------------------------------
- name: "REMED | PAM faildelay + hashing rounds"
  block:
    - name: "REMED | Is pam_faildelay.so actually installed?"
      ansible.builtin.shell:
        cmd: "ls /usr/lib/*/security/pam_faildelay.so /usr/lib/security/pam_faildelay.so /lib/security/pam_faildelay.so 2>/dev/null"
      register: _pam_faildelay_mod
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "REMED | Enforce a delay after a failed logon (UBTU-24-300017)"
      ansible.builtin.lineinfile:
        path: /etc/pam.d/common-auth
        regexp: '^\s*auth\s+(?:\[[^]]*\]|\S+)\s+pam_faildelay\.so'
        line: "auth    required                        pam_faildelay.so delay={{ usg_pam_faildelay_us }}"
        # Must sit BEFORE the terminal `requisite pam_deny.so`: requisite returns
        # immediately on failure, so a faildelay line after it would never run on
        # the very logins it is meant to slow down.
        insertbefore: '^\s*auth\s+requisite\s+pam_deny\.so'
        state: present
        validate: "/bin/grep -q pam_unix.so %s"
      when:
        - usg_fix_pam_faildelay | default(true) | bool
        - (_pam_faildelay_mod.stdout | default('') | trim) | length > 0

    - name: "REMED | Set pam_unix password hashing rounds (UBTU-24-400220)"
      # Appends `rounds=N` to the existing pam_unix.so password line, leaving
      # every other option on it untouched. Skips a line that already has it.
      ansible.builtin.replace:
        path: /etc/pam.d/common-password
        regexp: '^(\s*password\s+(?:\[[^]]*\]|\S+)\s+pam_unix\.so(?!.*\brounds=)(?:\s+\S+)*)\s*$'
        replace: '\1 rounds={{ usg_pam_unix_rounds }}'
      when: usg_fix_pam_rounds | default(false) | bool

# ---------------------------------------------------------------------------
# 5b) DISABLE CUPS PRINTING (all profiles) -- least-functionality hardening.
# CUPS listens on :631 and is unneeded on these boxes; leaving it running is an
# extra attack surface. Disable AND mask cups.service + cups.socket (the socket
# would otherwise re-activate the service on demand) + cups-browsed. failed_when
# false so a box that never installed CUPS (e.g. a headless AI node) is a no-op.
# Set disable_cups: false per box if you genuinely need local printing.
# ---------------------------------------------------------------------------
- name: "REMED | Disable + mask CUPS printing services (all profiles)"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - cups.service
    - cups.socket
    - cups-browsed.service
  failed_when: false          # units may be absent (not installed) -> nothing to do
  when: disable_cups | default(true) | bool

# ---------------------------------------------------------------------------
# 6) RE-AUDIT -- regenerate the USG report so it reflects the fully-built,
# remediated box rather than the mid-build snapshot. Pro-attached boxes only.
# (_usg_active / _usg_target are facts set by usg_harden earlier in this play.)
# ---------------------------------------------------------------------------
- name: "REMED | Regenerate the USG compliance report (post-build)"
  when:
    - usg_remediate_reaudit | default(true) | bool
    - _usg_active | default(false) | bool
  block:
    - name: "REMED | Re-run `usg audit {{ usg_profile }}` after remediation"
      ansible.builtin.command: "usg audit {{ _usg_target | default(usg_profile) }}"
      register: _reaudit
      changed_when: false
      failed_when: false

    - name: "REMED | Collect refreshed audit artifacts from /var/lib/usg"
      ansible.builtin.find:
        paths: /var/lib/usg
        patterns: ["*.html", "*.xml"]
        file_type: file
      register: _reaudit_art

    - name: "REMED | Ensure the report dir exists"
      ansible.builtin.file:
        path: "{{ usg_report_dir }}"
        state: directory
        owner: "{{ usg_report_dir_owner | default('root') }}"
        group: "{{ usg_report_dir_group | default('root') }}"
        mode: "{{ usg_report_dir_mode | default('0750') }}"

    - name: "REMED | Copy refreshed reports into {{ usg_report_dir }}"
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ usg_report_dir }}/"
        remote_src: true
        owner: "{{ usg_report_dir_owner | default('root') }}"
        group: "{{ usg_report_file_group | default('root') }}"
        mode: "{{ usg_report_file_mode | default('0640') }}"
      loop: "{{ _reaudit_art.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
