---
# =============================================================================
# VS Code extensions -- ONE copy on the box, reached by symlink.
#
# VS Code keeps extensions per-user. The obvious way to give everyone the set
# is to seed /etc/skel, and that is what this used to do: `useradd -m` copies
# /etc/skel in full, the set measured 3.0 GB across 27,395 files on ASP-2, so a
# single account took 65 seconds and carried its own 3 GB -- the build's own
# accounts included, several times per box.
#
# Instead the set is installed ONCE into vscode_shared_extensions_dir, and each
# user's ~/.vscode/extensions holds SYMLINKS into it. /etc/skel holds the same
# symlinks, so useradd copies links (bytes, instantly) and a new account has
# the whole set. Users can still install their own alongside: the directory is
# theirs and writable, only the shared entries are links.
# =============================================================================

- name: "VSCODE | Shared extension store ({{ vscode_shared_extensions_dir }})"
  ansible.builtin.file:
    path: "{{ vscode_shared_extensions_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Installed as root into the shared dir. HOME must be set: ansible-pull runs
# from systemd with none, and `code` dereferences it.
- name: "VSCODE | Install the extension set into the shared store"
  ansible.builtin.command:
    cmd: >-
      code --install-extension {{ item }} --force
      --extensions-dir {{ vscode_shared_extensions_dir }}
      --user-data-dir /root/.vscode-shared-userdata
  environment:
    HOME: /root
  loop: "{{ vscode_extensions }}"
  changed_when: false      # code exits 0 whether it installs or is already present
  register: _vsc_install
  failed_when:
    - _vsc_install.rc != 0
    - "'already installed' not in (_vsc_install.stdout | default(''))"

- name: "VSCODE | Readable by everyone (the store is shared, not per-user)"
  ansible.builtin.file:
    path: "{{ vscode_shared_extensions_dir }}"
    state: directory
    recurse: true
    owner: root
    group: root
    mode: u=rwX,go=rX

# ---------------------------------------------------------------------------
# /etc/skel: the symlinks, so a NEW account gets the set for free.
# ---------------------------------------------------------------------------
- name: "VSCODE | What is in the shared store?"
  ansible.builtin.find:
    paths: "{{ vscode_shared_extensions_dir }}"
    file_type: directory
    recurse: false
  register: _vsc_shared

- name: "VSCODE | /etc/skel dirs"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/skel/.config/Code/User
    - /etc/skel/.vscode/extensions

# The old 3 GB seeding, actively removed -- a box that got it from an earlier
# build keeps it forever otherwise (reference.md trap 3).
- name: "VSCODE | Remove any real extension copy left in /etc/skel"
  ansible.builtin.shell:
    cmd: |
      find /etc/skel/.vscode/extensions -maxdepth 1 -mindepth 1 -type d -exec rm -rf {} +
  changed_when: false

- name: "VSCODE | Symlink the shared set into /etc/skel"
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "/etc/skel/.vscode/extensions/{{ item.path | basename }}"
    state: link
    force: true
    follow: false
  loop: "{{ _vsc_shared.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

# VS Code builds its extension list from this manifest, not by scanning, so the
# symlinks alone are not enough -- the shared manifest has to travel with them.
- name: "VSCODE | Copy the shared manifest into /etc/skel"
  ansible.builtin.copy:
    src: "{{ vscode_shared_extensions_dir }}/extensions.json"
    dest: /etc/skel/.vscode/extensions/extensions.json
    remote_src: true
    mode: "0644"
  failed_when: false      # absent on a first run before any extension installs

- name: "VSCODE | Default interpreter for new accounts"
  ansible.builtin.copy:
    dest: /etc/skel/.config/Code/User/settings.json
    mode: "0644"
    content: |
      {
        "python.defaultInterpreterPath": "{{ eng_venv_path }}/bin/python"
      }

# ---------------------------------------------------------------------------
# Accounts that ALREADY exist. it-vscode does the same linking; the role calls
# it so a pull brings existing users up to date without anyone running it.
# ---------------------------------------------------------------------------
- name: "VSCODE | Install it-vscode"
  ansible.builtin.copy:
    src: vscode-extensions.sh
    dest: "{{ it_scripts_dir | default('/opt/it/scripts') }}/vscode-extensions.sh"
  # root:%s, not root:root. A 0750 root:root script cannot be READ or
  # executed by anyone but root, so the self-elevating first line never gets
  # the chance to run -- `it-<name>` fails with Permission denied instead of
  # prompting for sudo, and `it-help` lists it as "(cannot read its script)".
  # Every it_scripts command uses this group; these did not.
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "0750"

- name: "VSCODE | Short command (it-vscode)"
  ansible.builtin.file:
    src: "{{ it_scripts_dir | default('/opt/it/scripts') }}/vscode-extensions.sh"
    dest: /usr/local/sbin/it-vscode
    state: link
    force: true

- name: "VSCODE | Link the shared set into every existing account"
  ansible.builtin.command:
    cmd: /usr/local/sbin/it-vscode link --all --quiet
  changed_when: false
