# =============================================================================
# System 2 (dev-ai2) -- EXTRACTION / EMBEDDINGS / MONITORING / SYNC node
#   Docling + Tika (extraction) · vLLM embedding + vision · LGTM (monitoring)
#   · MLflow (experiment tracking / model registry) · oikb (knowledge-base sync)
#   · hfcli/repomix/openwiki (utilities)
# Managed by ansible (ai_compose role); placed in {{ ai_compose_dir }}.
# System 2 has ONE 48GB GPU shared by Docling + the embed/vision vLLMs (all small).
#   Run:   cd /opt/it/docker && docker compose up -d
# Cross-node values (System 1's address, oikb secrets) come from the root-only
# `.env` (rendered from site.yml). This file holds NO secrets.
# =============================================================================
name: ai-system2

networks:
  oi:
    driver: bridge

volumes:
  granite-embed: { external: true }        # granite-embedding-small-english-r2 weights
  granite-vision: { external: true }       # granite-vision-4.1-4b weights
  docling-models: { external: true }       # docling HF cache (granite-docling-258M VLM)
  lgtm-data: { external: true }            # Grafana/LGTM state (dashboards, TSDB)
  mlflow-artifacts: { external: true }     # MLflow artifact store
  postgres_mlflow_data: { external: true } # MLflow's internal Postgres data
  openwiki-out: { external: true }         # OpenWiki output workdir

services:
  # ---- Embeddings (RAG) -- OpenAI-compatible, reached from System 1 ----
  vllm-embed:
    image: vllm/vllm-openai:v0.22.1-cu129-ubuntu2404
    container_name: vllm-embed
    ipc: host
    ports:
      - "8002:8002"
    volumes:
      - granite-embed:/granite-embed
      - ./fips_off:/proc/sys/crypto/fips_enabled:ro   # host FIPS carve-out (see docs/operate.md)
    command:
      - --model=/granite-embed
      - --served-model-name=granite-embedding-small-english-r2
      - --runner=pooling                  # embedding mode (replaces the removed --task=embed)
      - --tensor-parallel-size=1          # System 2 has ONE GPU
      - --gpu-memory-utilization=0.10
      - --port=8002
    networks: [oi]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu] }

  # ---- Vision / document understanding -- OpenAI-compatible, from System 1 ----
  vllm-vision:
    image: vllm/vllm-openai:v0.22.1-cu129-ubuntu2404
    container_name: vllm-vision
    ipc: host
    ports:
      - "8003:8003"
    volumes:
      - granite-vision:/granite-vision
      - ./fips_off:/proc/sys/crypto/fips_enabled:ro
    command:
      - --model=/granite-vision
      - --served-model-name=granite-vision-4.1-4b
      - --tensor-parallel-size=1
      - --gpu-memory-utilization=0.35
      - --max-model-len=16384
      - --port=8003
      # granite-vision-4.1-4b ships as a LoRA adapter on Granite-4.1-3B. If vLLM
      # won't serve the adapter repo directly, use `--enable-lora` with the 3B
      # base, or swap for the merged `ibm-granite/granite-4.0-3b-vision`.
    networks: [oi]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu] }

  # ---- Document extraction ----
  docling-serve:
    image: ghcr.io/docling-project/docling-serve-cu128:v1.24.0
    container_name: docling-serve
    ports:
      - "5001:5001"
    volumes:
      # docling bundles OpenCV, whose vendored OpenSSL 1.1.1k runs a FIPS selftest
      # and abort()s on the FIPS host (fips_enabled=1) -> SIGABRT/exit 134 crash-loop.
      # Same host-FIPS carve-out the vLLM services use; the HOST stays FIPS.
      - ./fips_off:/proc/sys/crypto/fips_enabled:ro
      # Persist the granite-docling-258M VLM weights (docling's HF cache).
      - docling-models:/opt/hf-cache
    environment:
      - DOCLING_SERVE_MAX_SYNC_WAIT=6000
      - DOCLING_SERVE_ENABLE_UI=false
      - OMP_NUM_THREADS=4
      - UVICORN_WORKERS=1
      # ---- granite-docling-258M VLM (runs locally on this GPU; default preset) ----
      - DOCLING_SERVE_DEFAULT_VLM_PRESET=granite_docling
      - DOCLING_SERVE_LOAD_MODELS_AT_BOOT=true
      - HF_HOME=/opt/hf-cache
      - HF_HUB_OFFLINE=${DOCLING_HF_OFFLINE:-0}
    networks: [oi]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu] }

  tika:
    image: apache/tika:3.3.1.0
    container_name: tika
    ports:
      - "9998:9998"
    networks: [oi]
    restart: unless-stopped

  # ---- Monitoring: Grafana/LGTM (admin UI :3001, receives OTel from System 1) ----
  lgtm:
    image: grafana/otel-lgtm:0.29.0
    container_name: open-webui-lgtm
    ports:
      - "3001:3000"        # Grafana UI (admins)
      - "4317:4317"        # OTLP gRPC  (from System 1's Open WebUI)
      - "4318:4318"        # OTLP HTTP
    volumes:
      - lgtm-data:/data
      # Pre-provisioned Open WebUI dashboard (auto-loaded at startup; edits in the
      # UI persist to lgtm-data). Placed by ansible (ai_compose) on System 2.
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ubuntu-stig-build.yaml:ro
      - ./grafana/openwebui-dashboard.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/openwebui-dashboard.json:ro
    networks: [oi]
    restart: unless-stopped

  # ---- Knowledge-base sync: oikb -> System 1's Open WebUI API ----
  # OPT-IN: oikb only starts when the `oikb` compose profile is active. The .env
  # sets COMPOSE_PROFILES=oikb automatically when an Open WebUI API key is present
  # (ai_oikb_openwebui_api_key in site.yml); with no key/no source it stays down
  # instead of crash-looping. Force it on ad hoc with:  docker compose --profile oikb up -d
  oikb:
    image: oikb:latest          # built on the box by ansible (ai_compose)
    container_name: oikb
    profiles: ["oikb"]
    working_dir: /app
    ports:
      - "8081:8080"
    # Resolve System 1 (dev-ai1) by name without host DNS: when ai_system1_addr is an
    # IP, .env sets SYSTEM1_HOSTS_ENTRY=dev-ai1:<ip>; otherwise a harmless no-op.
    extra_hosts:
      - "${SYSTEM1_HOSTS_ENTRY:-localhost:127.0.0.1}"
    environment:
      OPEN_WEBUI_URL: "${OPEN_WEBUI_URL:-http://dev-ai1:3000}"   # System 1, cross-node
      OPEN_WEBUI_API_KEY: "${OPEN_WEBUI_API_KEY:-}"
      GITLAB_URL: "${GITLAB_URL:-}"
      GITLAB_TOKEN: "${GITLAB_TOKEN:-}"
      LOG_FORMAT: "json"
    command: oikb daemon
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://0.0.0.0:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./.oikb.yaml:/app/.oikb.yaml
    networks: [oi]
    restart: unless-stopped

  # ---- MLflow: experiment tracking + model registry (CPU-only ops plane) -----
  # Its Postgres backing store is container-internal (no host port; only the
  # MLflow server talks to it). Password comes from .env (MLFLOW_DB_PASSWORD,
  # auto-generated). The MLflow UI/API is on :5000 -- open it to your lab subnet
  # in ai_firewall_allow_ports (it is NOT exposed by default).
  mlflow-db:
    image: pgvector/pgvector:pg16-trixie      # same image as System 1's pgvector
    container_name: mlflow-db
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:?set in .env}
      POSTGRES_DB: mlflow
    volumes:
      - postgres_mlflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [oi]
    restart: unless-stopped

  mlflow:
    image: mlflow:v3.15.1-psycopg2      # built on the box by ansible (ai_compose)
    container_name: mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:${MLFLOW_DB_PASSWORD}@mlflow-db:5432/mlflow
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
      --disable-security-middleware
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    depends_on:
      mlflow-db:
        condition: service_healthy
    networks: [oi]
    restart: unless-stopped
    # NOTE (FIPS): if this container crash-loops with an OpenSSL/FIPS selftest
    # error on the FIPS host, add the same carve-out the vLLM/docling services
    # use:  volumes: - ./fips_off:/proc/sys/crypto/fips_enabled:ro   (host stays FIPS).

  # ---- Utility container: model downloads (does NOT auto-start) ----
  # docker compose run --rm hfcli hf download <repo> --local-dir /<vol>
  hfcli:
    image: hfcli:latest         # built on the box by ansible (ai_compose)
    container_name: hfcli
    profiles: ["tools"]
    volumes:
      - granite-embed:/granite-embed
      - granite-vision:/granite-vision
    networks: [oi]

  # ---- Utility container: OpenWiki -- generate a doc wiki from a repo ---------
  # On-demand (does NOT auto-start; `tools` profile). Reaches System 1's chat
  # endpoint over the network (extra_hosts resolves dev-ai1). Output persists in
  # the openwiki-out volume (/work). Run e.g.:
  #   docker compose run --rm openwiki openwiki <args>
  openwiki:
    image: openwiki:latest      # built on the box by ansible (ai_compose)
    container_name: openwiki
    profiles: ["tools"]
    extra_hosts:
      - "${SYSTEM1_HOSTS_ENTRY:-localhost:127.0.0.1}"
    working_dir: /work
    volumes:
      - openwiki-out:/work
    networks: [oi]
