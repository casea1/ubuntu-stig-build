---
# AI-server profile baseline -- a deliberately LEAN headless set.
# Included from main.yml only when is_ai. We install just what a bare Ubuntu
# Pro server needs before the two big roles take over:
#   - the ai_stack role installs docker-ce + the NVIDIA stack + the containers
#   - the usg_harden role installs `usg` (via Ubuntu Pro) and runs it
# so this file only provides the always-useful essentials and the bits the later
# roles assume are present (curl/gnupg/ca-certificates for adding the Docker &
# NVIDIA apt repos; openssh-server for remote admin of a headless box).
#
# We intentionally do NOT install the desktop app set (wireshark, putty, VS Code,
# PXE provisioning services) -- workstation tooling that would only add attack
# surface + STIG findings on a server. ClamAV IS installed (checklist: AV on every
# box) but headless: the daemon + CLI, no GUI front-end.

- name: "SERVER | Install the lean headless baseline"
  ansible.builtin.apt:
    name:
      - ca-certificates     # needed to trust the Docker/NVIDIA apt repo TLS
      - curl                # ai_stack fetches repo GPG keys with curl
      - gnupg               # de-armoring repo keys
      - apt-transport-https
      - software-properties-common
      - git
      - openssh-server      # headless box: remote admin over SSH
      - openssh-client
      - python3
      - python3-apt         # ansible apt/deb modules rely on it
      - jq                  # handy for inspecting container/API JSON on the box
    state: present

- name: "SERVER | Enable and start sshd (remote admin of a headless box)"
  ansible.builtin.systemd:
    name: ssh
    enabled: true
    state: started

# ---- Anti-virus (checklist: installed, maintained, tuned on every box) -------
# Headless: clamav-daemon + clamav (CLI). No GUI package.
# TUNING MATTERS HERE: an untuned clamd walks /var/lib/docker/volumes, which on
# these nodes holds ~60GB+ of model weights and the databases -- enormous I/O for
# zero detection value. The exclusions below are applied by app_config.
# AIR-GAP: freshclam cannot reach the internet, so signatures go stale. Stage the
# CVD files with the USB workflow (see docs/patching.md) or accept a POA&M.
- name: "SERVER | Install ClamAV (headless: daemon + CLI, no GUI)"
  ansible.builtin.apt:
    name:
      - clamav
      - clamav-daemon
      - clamav-freshclam
    state: present
  when: clamav_enabled | default(true) | bool
