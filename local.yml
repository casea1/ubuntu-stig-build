---
# ansible-pull entrypoint. ansible-pull runs local.yml by default.
#
# TWO PROFILES, selected by `deployment_profile` (group_vars/all.yml, overridable
# with `-e deployment_profile=ai`). Both can run on headless server hardware, and
# BOTH now harden with Canonical's USG (`usg fix disa_stig`); `usg audit` is the
# compliance report for both.
#
#   development (default) -- an engineering workstation. Installs the dev
#     toolchain, then a GNOME desktop + xrdp so users REMOTE IN over RDP for a
#     full GUI (works on a server base with no display). Hardened by USG, then a
#     small desktop_hardening role re-asserts the GUI/RDP and adds the GNOME/GDM
#     and USB carve-outs USG doesn't do. (Needs an Ubuntu Pro token, like ai.)
#
#   ai          -- a headless Ubuntu Pro AI server. Ansible does HOST PREP only
#     (Docker + NVIDIA via ai_stack) and hardens with USG; the AI tools ship as
#     your OWN prebuilt images + compose files. ai_firewall opens their inbound
#     ports after USG's default-deny.
#
#   baseline    -- an ALREADY-BUILT box (software already installed) that only
#     needs org provisioning + STIG. Installs NO app set and NO RDP; runs
#     local_accounts (users/groups/ACL'd folders + USB->dta), managed_dirs,
#     cockpit, USG, and the GUI-preserving pieces of desktop_hardening (graphical
#     target, GDM banner, GNOME dconf, USB re-enable, ufw). For a hand-built
#     Ubuntu Desktop endpoint logged into locally. (Needs an Ubuntu Pro token.)
#
# Run order is deliberate for BOTH: install + configure FIRST, harden SECOND.
# Hardening (umask, noexec /tmp, PAM) can break installs/pip if applied first, and
# the AI images / USG content must download while the box is still online.

- name: Build and harden Ubuntu 24.04 (DoD STIG via USG)
  hosts: localhost
  connection: local
  become: true

  # Profile switches, derived once so every role/when below reads cleanly.
  # deployment_profile defaults to 'development'. The first release shipped the
  # names 'desktop'/'server'; they are accepted here as aliases for continuity.
  vars:
    _raw_profile: "{{ deployment_profile | default('development') }}"
    # Aliases: desktop->development, server->ai, and emi-unclass->emi (the
    # unclassified EMI variant, which also flips emi_classified off in group_vars).
    _deployment_profile: "{{ {'desktop': 'development', 'server': 'ai', 'emi-unclass': 'emi'}.get(_raw_profile, _raw_profile) }}"
    is_development: "{{ _deployment_profile == 'development' }}"
    is_ai: "{{ _deployment_profile == 'ai' }}"
    # baseline -- an ALREADY-PROVISIONED box (all software already installed) that
    # only needs org provisioning + STIG: Ubuntu Pro attach, USG, the local
    # accounts/groups/ACL'd folders, the USB->dta carve-out, Cockpit, and the
    # GUI-preserving desktop_hardening fixups -- but NO app installs and NO RDP.
    # Intended for a hand-built Ubuntu Desktop endpoint logged into locally.
    is_baseline: "{{ _deployment_profile == 'baseline' }}"
    # emi -- a local-GUI, STIG-hardened Dell imaging/field workstation. Reuses the
    # development app set + dev_tools (minus RDP), adds VPN/recon/CJK-IME extras,
    # an imaging-service firewall, and a camera/mic lockdown. Two variants via
    # emi_classified (group_vars): classified-capable (FIPS+LUKS) vs the
    # unclassified-only 'emi-unclass' variant (FIPS/LUKS off).
    is_emi: "{{ _deployment_profile == 'emi' }}"

  # Fail fast on a typo'd profile rather than silently building nothing.
  pre_tasks:
    # -------------------------------------------------------------------------
    # PER-NODE / SITE OVERRIDES. Everything pulls the SAME public repo, so
    # per-machine settings (firewall ports, NTP, the peer node's IP, a Cockpit
    # cert, ...) and anything you don't want in a public repo live in a LOCAL file
    # on the box: /etc/stig-build/site.yml (override with -e site_overrides_file=).
    # Dropped out-of-band per node; loaded here so it beats group_vars/all.yml.
    # Example (System 2): ai_firewall_allow_ports: [{port: 5001, proto: tcp, ...}]
    # -------------------------------------------------------------------------
    # Preferred location is /opt/it/site.yml (the admin folder, easy to find);
    # /etc/stig-build/site.yml is the legacy path, still honoured. Both are loaded
    # if present, later wins, so /opt/it beats /etc/stig-build. An explicit
    # `-e site_overrides_file=...` still works and takes highest precedence.
    - name: "Discover per-node site-override files"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: >-
        {{ ['/etc/stig-build/site.yml', (it_dir | default('/opt/it')) ~ '/site.yml']
           + ([site_overrides_file] if (site_overrides_file is defined) else []) }}
      register: _site_overrides

    - name: "Load per-node overrides (beats group_vars; later files win)"
      ansible.builtin.include_vars: "{{ item.item }}"
      loop: "{{ _site_overrides.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists | default(false)

    - name: "Validate deployment_profile is development, ai, baseline, or emi"
      ansible.builtin.assert:
        that:
          - _deployment_profile in ['development', 'ai', 'baseline', 'emi']
        fail_msg: >-
          deployment_profile must be 'development', 'ai', 'baseline', or 'emi'
          (aliases: 'desktop'->development, 'server'->ai, 'emi-unclass'->emi).
          Got '{{ _raw_profile }}'.
        quiet: true

  roles:
    # -------------------------------------------------------------------------
    # STORAGE  -- runs FIRST so the full disk is available before anything
    # downloads. Ubuntu autoinstall often makes a small root LV (e.g. 100G) on a
    # big disk; this grows it to use the rest of the volume group (online).
    # -------------------------------------------------------------------------
    - role: disk_expand      # grow root LV + fs to all free VG space (idempotent; disk_autoexpand)

    # -------------------------------------------------------------------------
    # OFFLINE APT  -- must run BEFORE base_packages, so everything after it
    # installs from the local repo. Self-skips unless offline_repo_enabled is
    # set (default false; it-offline-repo enable writes it into /opt/it/site.yml).
    # Built for the standalone EMI laptop -- the dev/ai fleet is pointed at the
    # ADM-Toolkit's HTTP repo server instead.
    # -------------------------------------------------------------------------
    - role: offline_repo     # air-gapped: park the online apt sources, read /srv/repo over file://

    # -------------------------------------------------------------------------
    # BASELINE  -- base_packages runs for all profiles; internally it installs
    # the development app set (when is_development) or a lean AI-server baseline
    # (when is_ai). On the baseline profile neither set imports, so only the
    # common packages (cifs-utils/net-tools) are ensured. See
    # roles/base_packages/tasks/main.yml.
    # -------------------------------------------------------------------------
    - role: base_packages    # development: clamav/wireshark/python/editor/putty; ai: lean baseline; baseline: common only

    # -------------------------------------------------------------------------
    # SHARED PROVISIONING  (all profiles)
    # Org access groups (dta/audit/sentry) + standing accounts + ACL'd shared
    # folders + USB->dta policy. Runs before hardening so the accounts exist when
    # PAM/faillock is applied. Toggle with local_accounts_enabled.
    # -------------------------------------------------------------------------
    - role: local_accounts          # org users/groups, ACL'd shared folders, USB->dta policy
      when: local_accounts_enabled | default(true)
    - role: managed_dirs            # /opt/ia (USG report drop) + /opt/it, admin-only (sudo group)
      when: managed_dirs_enabled | default(true)
    - role: cockpit                 # web server-management console (9090); firewall opened post-USG
      when: cockpit_enabled | default(true)

    # GUI classification banner -- ANY profile with a desktop or RDP GUI
    # (development + baseline; ai is headless). Docked top/bottom classification
    # bars (UNCLASSIFIED/SECRET/... in CAPCO colors); switch the level per box with
    # classification_banner_level. Runs before hardening (installs pkgs + forces
    # GDM to Xorg, which the docked bars require).
    - role: classification_banner
      when:
        - is_development or is_baseline or is_emi
        - classification_banner_enabled | default(true) | bool

    # -------------------------------------------------------------------------
    # DEVELOPMENT-ONLY PROVISIONING  (GUI engineering box, RDP-accessible)
    # -------------------------------------------------------------------------
    - role: app_config              # clamav daemon/freshclam (all profiles); wireshark group (development + emi)
      when: is_development or is_emi or is_ai

    # MUST follow app_config: it overrides the clamav units app_config creates.
    # On a FIPS host ClamAV cannot initialise MD5 and silently scans nothing --
    # this points the clamav processes alone at an OpenSSL config that has it.
    - role: clamav_fips             # FIPS MD5 carve-out so ClamAV actually scans (self-skips off FIPS)
      when:
        - is_development or is_emi or is_ai
        - clamav_fips_carveout_enabled | default(true) | bool

    # Runs after clamav_fips, which gets first refusal: if the OpenSSL carve-out
    # ever works, the host engine is used and this is a no-op. On Ubuntu FIPS it
    # cannot (clamav#1786), so clamd moves into a container instead.
    - role: clamav_container        # containerised clamd when the host engine detects nothing
      when:
        - is_development or is_emi or is_ai
        - clamav_container_enabled | default(true) | bool
    - role: dev_tools               # compilers/SDKs, /opt/eng-venv, VS Code extensions, docker.io (development + emi)
      when: is_development or is_emi
    - role: remote_desktop          # GNOME desktop + xrdp (RDP into the dev GUI); runs before hardening. development only -- emi/baseline are local-GUI.
      when: is_development
    # EMI extras that run in the pre-hardening provisioning phase.
    - role: peripheral_lockdown     # emi: disable camera + microphone (defense-in-depth with BIOS)
      when: is_emi

    # -------------------------------------------------------------------------
    # AI-SERVER-ONLY PROVISIONING  (Ubuntu Pro AI server)
    # Runs BEFORE hardening: needs internet (pulls images) and must finish before
    # USG locks the box down.
    # -------------------------------------------------------------------------
    - role: ai_stack                # docker-ce + NVIDIA + selectable Compose stack (vLLM/WebUI/pgvector/Docling)
      when: is_ai
    - role: docker_hardening        # ai: CIS-aligned Docker daemon hardening (USG doesn't cover Docker)
      when:
        - is_ai
        - docker_hardening_enabled | default(true)

    # -------------------------------------------------------------------------
    # HARDENING  -- BOTH profiles harden with Canonical USG.
    # -------------------------------------------------------------------------
    - role: usg_harden              # Ubuntu Pro attach + `usg fix disa_stig` + `usg audit` -> report
    - role: gpu_fips_module         # ai+FIPS: stage the fips-flavour NVIDIA module so GPUs survive the FIPS kernel swap
      when:
        - is_ai
        - gpu_enabled | default(true)
        - usg_enable_fips | default(false)
    - role: desktop_hardening       # development + baseline: GUI-preserving fixups AFTER USG (GNOME/GDM banner, USB, firewall). RDP/Wayland-off bits are development-only (gated on dev_rdp_enabled).
      when: is_development or is_baseline or is_emi
    - role: ai_firewall             # ai: open the prebuilt AI stack's inbound ports AFTER USG's default-deny
      when: is_ai
    - role: emi_firewall            # emi: open the imaging/VPN service ports AFTER USG's default-deny
      when: is_emi
    - role: ai_compose              # ai: bake the node's docker-compose + .env into /opt/it/docker (opt-in `up`)
      when:
        - is_ai
        - ai_compose_enabled | default(false)

    # -------------------------------------------------------------------------
    # RESIDUAL REMEDIATION  (both profiles) -- runs AFTER USG + the firewall
    # roles. Closes the reasonable findings `usg fix` leaves open (pam_pkcs11
    # cleanup, /var/log perms, chrony server directive, ufw active), then
    # re-runs `usg audit` so the report reflects the fully-built box.
    # -------------------------------------------------------------------------
    - role: usg_remediate           # idempotent residual STIG fixes + smartcard/pam_pkcs11 cleanup + re-audit
      when: usg_remediate_enabled | default(true)

    - role: grub_password           # GRUB2 superuser + PBKDF2 password (skips until a real hash is vaulted)
      when: grub_password_enabled | default(true) | bool

    - role: usbguard                # USB device allow-listing (opt-in per profile; see usbguard_enabled)
      when: usbguard_enabled | default(false) | bool

    # -------------------------------------------------------------------------
    # POST-HARDENING  (desktop branding, optional TPM)
    # -------------------------------------------------------------------------
    - role: desktop_branding        # GUI profiles (development + baseline): system-wide DoD SHB wallpaper + lock screen, runs after hardening. (ai is headless -> skipped.)
      when:
        - is_development or is_baseline or is_emi
        - desktop_branding_enabled | default(true) | bool
    - role: tpm_luks_unlock         # OPT-IN: bind LUKS to the TPM2 (works on either profile if encrypted)
      when: tpm_luks_enabled | default(false)

    # -------------------------------------------------------------------------
    # INVENTORY  (both profiles) -- runs LAST so it captures the built state.
    # Writes a basic hardware/system report (serials, MACs, BIOS, disks, GPU) to
    # /opt/it for post-imaging checklist reference. Re-run: `sudo it-inventory`.
    # -------------------------------------------------------------------------
    - role: inventory_report        # both: hardware/system inventory -> /opt/it/inventory-<host>.txt
      when: inventory_report_enabled | default(true)
    - role: it_scripts              # both: admin status scripts in /opt/it/scripts (+ it-* commands)
      when: it_scripts_enabled | default(true)

    # OpenSCAP evaluation + the STIG-checklist inputs. Runs LAST, after
    # it_scripts, so `it-oscap` and `it-ckl` are already installed. Needs
    # INTERNET on the first run -- it fetches the Ubuntu 24.04 SSG datastream
    # (~175 MB), which the distro package does not ship. Do this before the box
    # goes air-gapped; afterwards the content is on disk and scans run offline.
    - role: scap_scan               # SSG content + build-time scan + scheduled re-scan + answers.yml
      when: scap_scan_enabled | default(true) | bool

    # PowerStrux launcher + weekly schedule. Self-skips when the hand-installed
    # PowerShell module is not present, so it is harmless on a box without it.
    - role: powerstrux              # auditor-facing audit launcher, desktop icon, Wednesday 03:00 run
      when: powerstrux_enabled | default(true) | bool

    # DTA transfer folders (/opt/dta/incoming|outgoing) and the `dta-log` record
    # tool. Only on profiles that have a `dta` group -- see dta_log_enabled.
    - role: dta_log                 # data-transfer staging folders + transfer record/scan tool
      when: dta_log_enabled | default(false) | bool
