# System 2 -- Docling: GPU document extraction (:5001). Default extraction engine
# for Open WebUI; Tika is the fallback. See docs/ai-stack.md.
name: docling
networks:
  oi:
    external: true
volumes:
  docling-models:
    external: true
services:
  docling-serve:
    image: ghcr.io/docling-project/docling-serve-cu128:v1.24.0
    container_name: docling-serve
    ports:
    - 5001:5001
    volumes:
    - ./fips_off:/proc/sys/crypto/fips_enabled:ro
    environment:
    - DOCLING_SERVE_MAX_SYNC_WAIT=6000
    - DOCLING_SERVE_ENABLE_UI=false
    - DOCLING_NUM_THREADS=4
    - OMP_NUM_THREADS=4
    - MKL_NUM_THREADS=4
    - UVICORN_WORKERS=4
    networks:
    - oi
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
