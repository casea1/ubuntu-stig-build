---
# =============================================================================
# code-server -- VS Code in the browser, one instance per user.
#
# code-server is SINGLE-USER PER INSTANCE; there is no multi-tenant mode. So
# every user who gets one needs their own port, and the port is derived from
# the UID rather than from a position in a list -- removing one engineer must
# not silently move everyone else's port.
#
#   port = dev_code_server_port + (uid - dev_code_server_uid_base)
#
# Each instance has its OWN generated password, root-only in /etc/code-server.
# desktop_hardening opens the port range, rate-limited, after USG.
# =============================================================================

- name: "CODE-SERVER | Install code-server (coder's official installer)"
  # coder's upstream installer adds their apt repo and installs the .deb (same
  # curl|sh pattern as bootstrap.sh). Pin a version with dev_code_server_version for
  # frozen images; empty = latest. Idempotent via `creates` (skips once installed).
  # HOME is set explicitly: ansible-pull runs from systemd (stig-build.service)
  # with no HOME in the environment, and coder's install.sh runs under `set -u`
  # and dereferences $HOME -> it aborts with "HOME: parameter not set" otherwise.
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://code-server.dev/install.sh | sh -s -- {{ ('--version ' ~ dev_code_server_version) if (dev_code_server_version | default('') | length > 0) else '' }}
    executable: /bin/bash
    creates: /usr/bin/code-server
  environment:
    HOME: /root

  tags: [packages]
- name: "CODE-SERVER | Password store (root-only)"
  ansible.builtin.file:
    path: /etc/code-server
    state: directory
    owner: root
    group: root
    mode: "0700"

# Group membership two ways, because `getent group` lists only SUPPLEMENTARY
# members -- an account whose PRIMARY group is this one would be missed, and on
# these boxes that is a plausible way to create an engineer.
- name: "CODE-SERVER | Who gets an instance?"
  ansible.builtin.shell:
    cmd: |
      g='{{ dev_code_server_group | default('') }}'
      if [ -z "$g" ] || ! getent group "$g" >/dev/null 2>&1; then
        # No group configured, or it does not exist: fall back to the one account
        # this used to serve.
        id -u '{{ dev_tools_user }}' >/dev/null 2>&1 && echo '{{ dev_tools_user }}'
        exit 0
      fi
      gid=$(getent group "$g" | cut -d: -f3)
      { getent group "$g" | cut -d: -f4 | tr ',' '\n'
        awk -F: -v g="$gid" '$4==g {print $1}' /etc/passwd
      } | sed '/^$/d' | sort -u | while read -r u; do
        # Only real human accounts, and only those whose UID maps into the port
        # range -- one outside it would land on a port the firewall does not
        # cover, or on something else's.
        uid=$(id -u "$u" 2>/dev/null) || continue
        [ "$uid" -ge 1000 ] && [ "$uid" -lt 65534 ] || continue
        # An account that cannot log in does not need a browser IDE.
        #
        # TWO checks, because the shell alone is not one. This used to test the
        # shell only, with a comment claiming that skipped auto_audit -- and it
        # never did: auto_audit is created with a LOCKED PASSWORD and a perfectly
        # normal shell, so it sailed through and dev-16 came up with an instance
        # for it (11 users, including the auditor accounts). Those are the units
        # failing on the boot splash: a service for an account nobody can log in
        # as, on a box that is counting listening ports.
        #
        # `passwd -S` field 2 is P (usable), L (locked) or NP (no password).
        # A human account that has not had its password set yet is L too, and
        # skipping it is right -- the next pull picks it up once an admin sets
        # one, so this heals itself.
        case "$(getent passwd "$u" | cut -d: -f7)" in
          */nologin|*/false|"") continue ;;
        esac
        case "$(passwd -S "$u" 2>/dev/null | awk '{print $2}')" in
          P) ;;
          *) continue ;;
        esac
        # Optional per-site exclusions, e.g. the dta and audit accounts, which
        # are in the group too.
        for x in {{ dev_code_server_exclude | default([]) | join(' ') }}; do
          [ "$u" = "$x" ] && continue 2
        done
        off=$((uid - {{ dev_code_server_uid_base }}))
        [ "$off" -ge 0 ] && [ "$off" -lt {{ dev_code_server_port_span }} ] || continue
        echo "$u"
      done
      exit 0
  register: _cs_probe
  changed_when: false
  check_mode: false

- name: "CODE-SERVER | The list"
  ansible.builtin.set_fact:
    _cs_users: "{{ _cs_probe.stdout_lines | default([]) }}"

# The unit every engineer runs. A USER unit: it lives under their own
# `systemd --user`, so starting it needs no root, no sudoers grant and no
# admin -- and because lingering is off, nothing exists at boot.
- name: "CODE-SERVER | The per-user systemd unit"
  ansible.builtin.copy:
    src: code-server-user.service
    dest: /etc/systemd/user/code-server.service
    owner: root
    group: root
    mode: "0644"
  register: _cs_unit
  tags: [scripts]

- name: "CODE-SERVER | Reload systemd so the user unit is visible"
  ansible.builtin.systemd:
    daemon_reload: true
  when: _cs_unit is changed
  tags: [scripts]

- name: "CODE-SERVER | Configure and enable an instance per user"
  ansible.builtin.include_tasks: code_server_user.yml
  loop: "{{ _cs_users }}"
  loop_control:
    loop_var: cs_user
    label: "{{ cs_user }}"
  when: _cs_users | length > 0

# Removing someone from the group has to STOP their instance: systemd units
# enabled by an earlier run stay enabled forever otherwise (trap 3).
- name: "CODE-SERVER | Which instances are enabled right now?"
  ansible.builtin.shell:
    cmd: |
      # NOT `list-unit-files 'code-server@*'`: that matches the TEMPLATE,
      # code-server@.service, whose name contains no user -- so this produced
      # an empty list and the cleanup below has been a no-op since it was
      # written. Twelve failed instances per box survived every pull because
      # nothing ever enumerated them.
      {
        systemctl list-units --all --plain --no-legend 'code-server@*.service' 2>/dev/null \
          | awk '{print $1}'
        ls /etc/systemd/system/*.wants/code-server@*.service 2>/dev/null \
          | xargs -r -n1 basename
      } | sed 's/^code-server@//; s/\.service$//' | grep -vE '^$' | sort -u
      exit 0
  register: _cs_enabled
  changed_when: false
  check_mode: false

# Every system instance now, not only the ex-members'. The instance moved to a
# user unit, so ANY surviving code-server@<user> is a second copy racing the
# first for the same port -- and it is the one that starts at boot, which is
# what this change exists to stop.
- name: "CODE-SERVER | Stop and disable every old system instance"
  ansible.builtin.systemd:
    name: "code-server@{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ _cs_enabled.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item }}"
  failed_when: false

# Disabling a unit does NOT clear its failed state. Twelve dead
# code-server@<locked-user> units sat in `systemctl --failed` on every
# development box -- the first thing anyone reviewing the machine looks at, and
# an assessor among them. The service is correctly off; only the corpse was
# left behind.
- name: "CODE-SERVER | Clear the failed state of instances that should not run"
  ansible.builtin.command: "systemctl reset-failed code-server@{{ item }}.service"
  loop: "{{ _cs_enabled.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  failed_when: false

- name: "CODE-SERVER | Is the short command still the old symlink?"
  ansible.builtin.stat:
    path: /usr/local/sbin/it-codeserver
  register: _cs_link_stat
  tags: [scripts]

- name: "CODE-SERVER | Install it-codeserver"
  ansible.builtin.copy:
    src: code-server-status.sh
    dest: "{{ it_scripts_dir | default('/opt/it/scripts') }}/code-server-status.sh"
    # root:<admin group>, not root:root. A 0750 root:root script cannot be read
    # or executed by anyone but root, so the self-elevating first line never
    # runs -- the command fails with Permission denied instead of prompting.
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "0750"

  tags: [scripts]
# A REAL FILE, not a symlink into /opt/it. That directory is 2770 root:sudo, so
# an engineer cannot traverse it: stat() on the link target fails with EACCES,
# bash skips the PATH entry, and the shell says "command not found" for a
# command they are explicitly meant to run (the same trap as it_scripts_public).
# `it-codeserver mine` is the ONLY way an engineer can find their port and
# password or start their instance, so it has to be reachable by them.
- name: "CODE-SERVER | Drop the old symlink before placing the real file"
  ansible.builtin.file:
    path: /usr/local/sbin/it-codeserver
    state: absent
  when: (_cs_link_stat.stat.islnk | default(false)) | bool
  tags: [scripts]

- name: "CODE-SERVER | Short command (it-codeserver)"
  ansible.builtin.copy:
    src: code-server-status.sh
    dest: /usr/local/sbin/it-codeserver
    owner: root
    group: root
    mode: "0755"
  tags: [scripts]
# ---------------------------------------------------------------------------
# Instances are not started at boot, so without this an engineer simply cannot
# use the IDE they are entitled to: the unit is a SYSTEM unit, starting it needs
# root, and they are not admins.
#
# The grant names `mine` and nothing else. `mine` derives the account from the
# CALLER inside the script and takes no username argument, so a member of the
# group can start, stop and restart their own instance and has no way to name
# somebody else's -- which would run a server as that person, on their port,
# behind their password.
#
# Deliberately NOT NOPASSWD, matching the it-repo grant: the STIG requires sudo
# to authenticate, and this belongs in /var/log/sudo.log with a name against it.
# The sudoers grant this replaced is REMOVED, not merely unused. `systemctl
# --user` needs no privilege, so nothing has to be granted -- and a live sudo
# rule that no longer has a purpose is exactly the finding an assessor writes up.
- name: "CODE-SERVER | Remove the old sudo grant (a user service needs none)"
  ansible.builtin.file:
    path: "/etc/sudoers.d/60-{{ dev_code_server_group }}-codeserver"
    state: absent
  tags: [scripts]

- name: "CODE-SERVER | Where things are"
  ansible.builtin.debug:
    msg: >-
      code-server for {{ _cs_users | length }} user(s):
      {{ _cs_users | join(', ') }}.
      Ports {{ dev_code_server_port }}-{{ dev_code_server_port + dev_code_server_port_span - 1 }}
      on {{ dev_code_server_bind_addr }} (uid {{ dev_code_server_uid_base }} -> {{ dev_code_server_port }}).
      Each has its own password under /etc/code-server/. `sudo it-codeserver`
      lists who is on which port.
