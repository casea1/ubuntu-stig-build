# System 2 -- MLflow tracking + model registry (:5000) with its own Postgres and
# a PgBouncer in front of it. MLflow has NO auth, and ufw cannot filter a
# published container port, so :5000 is published by the nginx proxy (source
# allow-list) and not by mlflow itself.
name: mlflow
networks:
  oi:
    external: true
volumes:
  mlflow-artifacts:
    external: true
  postgres_mlflow_data:
    external: true
services:
  mlflow-db:
    image: pgvector/pgvector:pg16-trixie
    container_name: mlflow-db
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
      POSTGRES_DB: mlflow
      POSTGRES_INITDB_ARGS: -c max_connections=200 -c shared_buffers=256MB
    command:
    - postgres
    - -c
    - max_connections=200
    - -c
    - shared_buffers=256MB
    - -c
    - effective_cache_size=1GB
    - -c
    - maintenance_work_mem=128MB
    - -c
    - checkpoint_completion_target=0.9
    - -c
    - wal_buffers=16MB
    - -c
    - default_statistics_target=100
    - -c
    - random_page_cost=1.1
    - -c
    - effective_io_concurrency=200
    - -c
    - work_mem=4MB
    volumes:
    - postgres_mlflow_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U mlflow -d mlflow
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - oi
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  pg-bouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: pg-bouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://mlflow:${MLFLOW_DB_PASSWORD}@mlflow-db:5432/mlflow
      AUTH_TYPE: plain
      POOL_MODE: transaction
      LISTEN_PORT: 5432
      LISTEN_ADDR: 0.0.0.0
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      MAX_DB_CONNECTIONS: 100
      MAX_USER_CONNECTIONS: 100
      SERVER_LIFETIME: 7200
      SERVER_IDLE_TIMEOUT: 600
      CLIENT_IDLE_TIMEOUT: 900
      SERVER_CONNECT_TIMEOUT: 15
      QUERY_TIMEOUT: 7200
      QUERY_WAIT_TIMEOUT: 120
      SERVER_RESET_QUERY: DISCARD ALL
      SERVER_CHECK_QUERY: select 1
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
      LOG_POOLER_ERRORS: 1
      VERBOSE: 0
      STATS_PERIOD: 60
    ports:
    - 5432:5432
    depends_on:
      mlflow-db:
        condition: service_healthy
    networks:
    - oi
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  mlflow:
    image: mlflow:v3.15.1-psycopg2
    command: 'mlflow server --backend-store-uri postgresql://mlflow:${MLFLOW_DB_PASSWORD}@pg-bouncer:5432/mlflow
      --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000 --disable-security-middleware

      '
    volumes:
    - mlflow-artifacts:/mlflow/artifacts
    depends_on:
      mlflow-db:
        condition: service_healthy
    networks:
    - oi
    deploy:
      replicas: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  mlflow-proxy:
    image: nginx:1.30.4-alpine
    container_name: mlflow-proxy
    ports:
    - 5000:5000
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
    - mlflow
    networks:
    - oi
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
