---
# =============================================================================
# managed_dirs -- create the org IA/IT working directories on BOTH profiles.
#
#   /opt/ia   Information Assurance  (also where the USG compliance report lands)
#   /opt/it   IT / systems admin working area
#
# Requirement: readable/writable ONLY by admins (the sudo group), and usable
# WITHOUT a `sudo` prefix -- an admin can cd in, create/edit files, and run
# commands directly. We do that with owner root, group {{ ia_it_group }} (sudo),
# mode 2770 (setgid + rwx group, NOTHING for other), plus a default POSIX ACL so
# files created inside stay group-accessible even under the STIG's umask 077
# (which would otherwise make new files 0600 and break admin-to-admin sharing).
# Self-contained (installs its own `acl`), so it runs even if local_accounts is off.
# =============================================================================

- name: "DIRS | Ensure 'acl' is installed (POSIX ACLs for the shared dirs)"
  ansible.builtin.apt:
    name: acl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "DIRS | Create the IA/IT dirs (setgid, sudo-only, others denied)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ ia_it_group }}"
    mode: "{{ ia_it_dir_mode }}"
  loop: "{{ managed_dirs }}"
  loop_control:
    label: "{{ item }} (root:{{ ia_it_group }} {{ ia_it_dir_mode }})"

- name: "DIRS | Grant the group rwx on each dir (access ACL)"
  ansible.posix.acl:
    path: "{{ item }}"
    entity: "{{ ia_it_group }}"
    etype: group
    permissions: rwx
    state: present
  loop: "{{ managed_dirs }}"
  loop_control:
    label: "{{ item }} -> g:{{ ia_it_group }}:rwx"

- name: "DIRS | Make group rwx INHERIT to new entries (default ACL beats umask 077)"
  ansible.posix.acl:
    path: "{{ item }}"
    entity: "{{ ia_it_group }}"
    etype: group
    permissions: rwx
    default: true
    state: present
  loop: "{{ managed_dirs }}"
  loop_control:
    label: "{{ item }} -> default g:{{ ia_it_group }}:rwx"

# Drop a ready-to-edit per-node override template where admins actually look
# (/opt/it), so site.yml is easy to find. force:false = NEVER clobber a real one.
# The playbook loads /opt/it/site.yml automatically (see local.yml pre_tasks).
# ---------------------------------------------------------------------------
# ONE-TIME MIGRATION into the subdivided /opt/ia.
#
# Everything used to land flat: usg-report-*.html and usg-results-*.xml in
# /opt/ia itself, and every OpenSCAP artifact in /opt/ia/oscap regardless of
# what produced it. Moving them means an existing box's history stays with the
# new layout instead of the old files sitting alongside as a second, stale set.
#
# Matched by NAME, and only names this baseline writes. `mv -n` never
# overwrites, so re-running is a no-op and a file already in place wins.
# ---------------------------------------------------------------------------
- name: "DIRS | Migrate legacy IA artifacts into the subdivided layout"
  ansible.builtin.shell:
    cmd: |
      set -e
      moved=0
      # usg audit output: /opt/ia/*.{html,xml} -> /opt/ia/usg/
      for f in {{ ia_dir }}/usg-report-*.html {{ ia_dir }}/usg-results-*.xml; do
        [ -e "$f" ] || continue
        mv -n "$f" {{ ia_usg_dir }}/ && moved=$((moved+1))
      done
      # OpenSCAP artifacts sitting directly in the oscap parent. The role wrote
      # date-only stamps (stig-arf-2026-08-24.xml); it-oscap writes date-time
      # (stig-arf-20260824-143656.xml). That is how the two are told apart.
      for f in {{ scap_report_dir }}/stig-*-*.*; do
        [ -f "$f" ] || continue
        b=$(basename "$f")
        case "$b" in
          *-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].*) d={{ scap_build_dir }} ;;
          *) d={{ scap_manual_dir }} ;;
        esac
        mv -n "$f" "$d/" && moved=$((moved+1))
      done
      # DISA content and generated checklists were both loose in stig/.
      for f in {{ scap_stig_dir }}/*xccdf*.xml {{ scap_stig_dir }}/*Benchmark*.xml; do
        [ -f "$f" ] || continue
        mv -n "$f" {{ scap_stig_content_dir }}/ && moved=$((moved+1))
      done
      for f in {{ scap_stig_dir }}/*.cklb {{ scap_stig_dir }}/*.ckl; do
        [ -f "$f" ] || continue
        mv -n "$f" {{ scap_stig_checklist_dir }}/ && moved=$((moved+1))
      done
      for f in {{ scap_stig_dir }}/stig-evidence-*.tar.gz; do
        [ -f "$f" ] || continue
        mv -n "$f" {{ scap_stig_evidence_dir }}/ && moved=$((moved+1))
      done
      echo "moved=$moved"
    executable: /bin/bash
  register: _ia_migrate
  changed_when: "'moved=0' not in (_ia_migrate.stdout | default('moved=0'))"
  when: managed_dirs_migrate | default(true) | bool

- name: "DIRS | Drop a starter site.yml override template in {{ it_dir | default('/opt/it') }}"
  ansible.builtin.copy:
    src: site.yml.starter
    dest: "{{ it_dir | default('/opt/it') }}/site.yml"
    owner: root
    group: "{{ ia_it_group }}"
    mode: "0660"
    force: false
  when: managed_dirs_site_template | default(true) | bool
