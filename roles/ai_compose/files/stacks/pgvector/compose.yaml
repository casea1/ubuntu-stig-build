# System 1 -- Postgres + pgvector (Open WebUI DB + vector index). Password from
# .env (POSTGRES_PASSWORD, auto-generated).
name: pgvector
networks:
  oi: { external: true }
volumes:
  pgvector-data: { external: true }
services:
  pgvector:
    image: pgvector/pgvector:pg16-trixie
    container_name: pgvector
    environment:
      POSTGRES_DB: "openwebui"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in .env}"
    # Tuned for the PgBouncer-fronted workload. max_connections stays above
    # PgBouncer's MAX_DB_CONNECTIONS (150) so the pooler, not Postgres, is what
    # rejects a flood. random_page_cost/effective_io_concurrency assume SSD.
    command:
      - postgres
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "min_wal_size=512MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "statement_timeout=300000"
      - "-c"
      - "idle_in_transaction_session_timeout=600000"
      - "-c"
      - "log_min_duration_statement=1000"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openwebui"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [oi]
    restart: unless-stopped
    # Ceiling, not a target. work_mem is per sort/hash NODE, so the worst case is
    # roughly MAX_DB_CONNECTIONS x work_mem x nodes-per-query (150 x 8MB) on top of
    # shared_buffers -- 2G would leave the OOM killer to settle it.
    deploy:
      resources:
        limits: { memory: 4G }
        reservations: { memory: 1G }
