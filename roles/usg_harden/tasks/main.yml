---
# =============================================================================
# usg_harden -- SERVER-profile hardening via Canonical's Ubuntu Security Guide.
#
# Replaces the desktop's ansible-lockdown role. Flow:
#   1. ensure the Pro client is present
#   2. resolve the Pro token (inline var / out-of-band file) and ATTACH
#   3. install `usg` (+ optional FIPS)
#   4. apply `usg fix <profile>`  -- guarded so it can't lock you out
#   5. `usg audit <profile>`      -- writes the compliance report
#
# SAFE-BY-DEFAULT: if the box can't be Pro-attached (no token, offline) the whole
# role self-skips with a POA&M warning instead of failing the build; and `usg fix`
# refuses to run unless an admin account has a usable password (lockout backstop).
# A REBOOT is required after a fix / FIPS enable for all controls to take effect.
# =============================================================================

- name: "USG | Ensure the Ubuntu Pro client is installed"
  ansible.builtin.apt:
    name: ubuntu-pro-client
    state: present
    update_cache: true
    cache_valid_time: 3600

# ---- Resolve the Pro token (secret; out-of-band) ---------------------------
- name: "USG | Look for an out-of-band Pro token file"
  ansible.builtin.slurp:
    src: "{{ ubuntu_pro_token_file }}"
  register: _pro_token_slurp
  failed_when: false
  when: (ubuntu_pro_token | default('') | length) == 0

- name: "USG | Resolve the effective Pro token"
  ansible.builtin.set_fact:
    _pro_token: >-
      {{ ubuntu_pro_token if (ubuntu_pro_token | default('') | length) > 0
         else ((_pro_token_slurp.content | b64decode | trim)
               if (_pro_token_slurp is defined and _pro_token_slurp.get('content')) else '') }}
  no_log: true

# ---- Attach ----------------------------------------------------------------
- name: "USG | Check whether this box is already Pro-attached"
  ansible.builtin.command: pro status --format json
  register: _pro_status_raw
  changed_when: false
  check_mode: false      # read-only probe: must run in --check too
  failed_when: false

- name: "USG | Determine current attach state"
  ansible.builtin.set_fact:
    _pro_attached: >-
      {{ ((_pro_status_raw.stdout | from_json).attached | default(false))
         if (_pro_status_raw.rc == 0 and (_pro_status_raw.stdout | default('') | length) > 0)
         else false }}

- name: "USG | Attach to Ubuntu Pro (uses the resolved token)"
  ansible.builtin.command: "pro attach {{ _pro_token }}"
  when:
    - not _pro_attached
    - (_pro_token | length) > 0
  register: _pro_attach
  no_log: true
  changed_when: _pro_attach.rc == 0
  # Safe-by-default: a bad token / network error becomes a POA&M skip (below),
  # not a hard build abort.
  failed_when: false

# Re-read the real attach state instead of trusting the attach rc / first parse.
# This is robust to an already-attached box (attach skipped) AND to any quirk in
# the initial status parse: _usg_active reflects what `pro` actually reports now.
- name: "USG | Re-check attach state after the attach attempt"
  ansible.builtin.command: pro status --format json
  register: _pro_status_final
  changed_when: false
  check_mode: false      # read-only probe: must run in --check too
  failed_when: false

- name: "USG | Mark USG active based on the authoritative post-attach status"
  ansible.builtin.set_fact:
    _usg_active: >-
      {{ ((_pro_status_final.stdout | from_json).attached | default(false))
         if (_pro_status_final.rc == 0 and (_pro_status_final.stdout | default('') | length) > 0)
         else false }}

# Which Pro services are ALREADY on. Read from the status document we just
# fetched, because `pro enable <x>` on a service that is already enabled is not
# free: it contacts contracts.canonical.com first ("One moment, checking your
# subscription first") and can fail there for reasons that have nothing to do
# with the service. On dev-15 that was
#   An unexpected error occurred: [CRYPTO] unknown error (_ssl.c:3026)
# -- a TLS failure inside the pro client on a FIPS kernel -- and it stopped the
# whole pull at usg_harden, leaving everything after it unrun, on a box where
# fips-updates was ALREADY ENABLED and nothing needed doing.
#
# The old guard tolerated "is already enabled" in pro's own output, which only
# helps when pro gets far enough to say it. Ask the box, not the command.
- name: "USG | Which Pro services are already enabled"
  ansible.builtin.set_fact:
    _pro_enabled: >-
      {{ ((_pro_status_final.stdout | from_json).services | default([])
          | selectattr('status', 'equalto', 'enabled')
          | map(attribute='name') | list)
         if (_pro_status_final.rc == 0 and (_pro_status_final.stdout | default('') | length) > 0)
         else [] }}

- name: "USG | POA&M WARNING -- not Pro-attached, skipping USG hardening"
  ansible.builtin.debug:
    msg: >-
      Ubuntu Pro is NOT attached and no token was supplied
      (ubuntu_pro_token / {{ ubuntu_pro_token_file }}). USG DISA-STIG hardening is
      SKIPPED -- track as a POA&M. Provide a token (bootstrap.sh prompt, or the
      out-of-band file) and re-run to harden this box.
  when: not (_usg_active | default(false) | bool)

# =============================================================================
# Everything below only runs when the box is Pro-attached.
# =============================================================================
- name: "USG | Enable + apply USG"
  when: _usg_active | default(false) | bool
  block:
    # ---- Install USG (+ optional FIPS) -------------------------------------
    - name: "USG | Enable the usg Pro service (tolerant: some releases ship it in the attached repos)"
      ansible.builtin.command: pro enable usg --assume-yes
      register: _usg_enable
      when: "'usg' not in (_pro_enabled | default([]))"
      changed_when: "'Updating' in _usg_enable.stdout or 'Installing' in _usg_enable.stdout"
      # Not fatal: on releases where `usg` isn't a distinct pro service the enable
      # is a no-op error and the package installs straight from the attached repo.
      failed_when: false

    # NOT fatal. `usg` comes from the Pro `usg` service, and a contract that
    # does not carry that entitlement (an infra-only subscription, say) leaves
    # the package simply absent -- apt then says "No package matching 'usg' is
    # available", which is true and says nothing about why. On dev-16 that
    # aborted the play at this line, so usg_remediate (which does its own STIG
    # remediation and never calls `usg`), usbguard, powerstrux and it_scripts
    # never ran: the box lost the hardening this role could not deliver AND all
    # the hardening it could, and it lost `it-*` -- the tools for diagnosing it.
    - name: "USG | Install the usg package"
      ansible.builtin.apt:
        name: usg
        state: present
        update_cache: true
      register: _usg_apt
      failed_when: false

    # Ask the box, not the exit code (trap 40). failed_when:false makes the task
    # above report success no matter what happened, and `usg version` is NOT a
    # subcommand, so there is nothing to run that proves it works -- the binary
    # existing is the honest test.
    - name: "USG | Is the usg binary actually there?"
      ansible.builtin.shell: command -v usg
      register: _usg_bin
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "USG | Record whether usg is installed"
      ansible.builtin.set_fact:
        _usg_installed: "{{ _usg_bin.rc == 0 }}"

    # NOT fatal, for the third time in this role and for the same reason. On
    # dev-16 this returned rc=1 with
    #   Failed running command 'apt-get install ... ubuntu-fips' [exit(100)].
    #   Message: E: Unable to correct problems, you have held broken packages.
    # -- an apt dependency-resolution failure INSIDE pro, on a box where the
    # Pro repo had been configured and its lists fetched successfully. That
    # aborted the play at usg_harden and cost the box usg_remediate, usbguard,
    # powerstrux and it_scripts: no STIG remediation and no it-* tools, because
    # one kernel package would not resolve. A box without FIPS is a POA&M item;
    # a box without hardening is a different problem entirely.
    # Loud, and it carries the reason. `pro enable usg` is tolerated above, so
    # without this its output is discarded and the operator is left with apt's
    # "no package" -- the symptom, never the cause.
    - name: "USG | POA&M WARNING -- usg unavailable, STIG profile NOT applied"
      ansible.builtin.debug:
        msg: >-
          The usg package could not be installed, so `usg fix` and `usg audit`
          are SKIPPED and this box does NOT carry the DISA-STIG profile. Track
          as a POA&M. The rest of the baseline (usg_remediate, usbguard,
          auditing, the it-* tools) still applies, so this is a partly hardened
          box, not an unhardened one.
          apt said: {{ (_usg_apt.msg | default('')) | trim }}
          `pro enable usg` said:
          {{ ((_usg_enable.stdout | default('')) ~ ' ' ~ (_usg_enable.stderr | default('')))
             | trim | default('(skipped -- pro already reported usg enabled)', true) }}
          Check on the box with `pro status` (does the contract carry usg?),
          then `sudo pro enable usg` and `apt-cache policy usg`.
      when: not (_usg_installed | bool)

    - name: "USG | Enable FIPS (fips-updates) -- swaps the kernel, needs a reboot"
      ansible.builtin.command: pro enable fips-updates --assume-yes
      register: _fips_enable
      when:
        - usg_enable_fips | default(false) | bool
        - "'fips-updates' not in (_pro_enabled | default([]))"
      changed_when: _fips_enable.rc == 0 and 'is already enabled' not in _fips_enable.stdout
      failed_when: false

    # Ask pro what is true now rather than trusting the rc above (trap 40), and
    # because `failed_when: false` makes that rc meaningless anyway.
    - name: "USG | Re-read Pro status after the FIPS attempt"
      ansible.builtin.command: pro status --format json
      register: _pro_status_fips
      when:
        - usg_enable_fips | default(false) | bool
        - _fips_enable is defined
        - _fips_enable is not skipped
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "USG | Is fips-updates enabled now?"
      ansible.builtin.set_fact:
        _fips_enabled_now: >-
          {{ ('fips-updates' in (_pro_enabled | default([])))
             or ((_pro_status_fips is defined and _pro_status_fips is not skipped
                  and _pro_status_fips.rc | default(1) == 0
                  and (_pro_status_fips.stdout | default('') | length) > 0)
                 and ('fips-updates' in ((_pro_status_fips.stdout | from_json).services | default([])
                                         | selectattr('status', 'equalto', 'enabled')
                                         | map(attribute='name') | list))) }}

    # Only when the enable actually ran AND actually took. Demanding a reboot
    # after a FIPS enable that failed would send an operator to reboot a box
    # into the kernel it already had, looking for a change that never happened.
    - name: "USG | FIPS enabled -> reboot required"
      ansible.builtin.set_fact:
        usg_reboot_required: true
      when:
        - usg_enable_fips | default(false) | bool
        - _fips_enable is defined
        - _fips_enable is not skipped
        - _fips_enabled_now | default(false) | bool

    - name: "USG | POA&M WARNING -- FIPS requested but NOT enabled"
      ansible.builtin.debug:
        msg: >-
          `pro enable fips-updates` did not succeed, so this box is NOT running
          in FIPS mode. Track as a POA&M. The rest of the baseline still
          applies. pro said:
          {{ ((_fips_enable.stdout | default('')) ~ ' ' ~ (_fips_enable.stderr | default(''))) | trim }}
          Diagnose on the box with `apt-get -s install ubuntu-fips` (the
          simulate names the unsatisfiable dependency; `apt-cache policy` does
          not -- see trap 27), `apt-mark showhold` and `uname -r`.
      when:
        - usg_enable_fips | default(false) | bool
        - _fips_enable is defined
        - _fips_enable is not skipped
        - not (_fips_enabled_now | default(false) | bool)

    - name: "USG | Apply the STIG profile (needs the usg binary)"
      ansible.builtin.import_tasks: apply.yml
      when: _usg_installed | bool

- name: "USG | Reboot reminder"
  ansible.builtin.debug:
    msg: >-
      USG hardening applied. REBOOT this box now so all controls
      {{ '(including the FIPS kernel) ' if usg_enable_fips | default(false) | bool else '' }}take
      effect, then re-run `sudo usg audit {{ _usg_target | default(usg_profile) }}` for accurate post-reboot results.
  when: usg_reboot_required | default(false) | bool
