---
# =============================================================================
# it_scripts -- admin status/health scripts in /opt/it/scripts, plus short
# `it-*` commands in /usr/local/sbin. Each script self-elevates with sudo, so
# an admin can just run e.g. `it-status`.
#
# The AI-stack tooling (it-ai, it-models, it-model-export/import, it-set-ip,
# it-docker, it-restart) is placed on the `ai` profile ONLY, and REMOVED
# everywhere else -- ansible's copy/link tasks only ever create, so without an
# explicit `state: absent` a box that got them from an earlier build would keep
# them forever. See it_scripts_ai_enabled in defaults/main.yml. `it-vulnscan`
# is placed the same way on the EMI profiles only (it_scripts_emi_enabled).
# =============================================================================

# The scripts need to know which profile this box was built as -- item 23 of
# the org checklist has a different answer on EMI (manual SSD duplication) than
# on dev/ai (nothing local worth backing up). Nothing else on the box records
# it: group_vars is on the ansible-pull side, not here. Plain key=value so a
# shell script can source it.
# copy does not create parents, and /etc/stig-build only exists on a box that
# has generated a secret into it -- which the EMI profile never does.
- name: "IT-SCRIPTS | Ensure /etc/stig-build exists (root-only; holds generated secrets)"
  ansible.builtin.file:
    path: /etc/stig-build
    state: directory
    owner: root
    group: root
    mode: "0700"

# Which revision of this repo the box is actually running. Without it there is
# no way to tell a box that has a fix from one that has not -- and "did you
# pull?" has already cost two rounds of debugging a bug that was fixed.
# playbook_dir is the ansible-pull checkout.
- name: "IT-SCRIPTS | Which revision of the baseline is this?"
  ansible.builtin.command: git -C {{ playbook_dir }} rev-parse --short HEAD
  register: _it_rev
  changed_when: false
  failed_when: false

- name: "IT-SCRIPTS | Record the deployment profile for the scripts to read"
  ansible.builtin.copy:
    dest: /etc/stig-build/profile
    owner: root
    group: root
    mode: "0644"
    content: |
      # Written by ansible (it_scripts). Which profile this box was built as.
      deployment_profile={{ deployment_profile | default('development') }}
      emi_classified={{ (emi_classified | default(true) | bool) | lower }}
      baseline_revision={{ (_it_rev.stdout | default('') | trim) or 'unknown' }}

- name: "IT-SCRIPTS | Ensure the scripts dir exists ({{ it_scripts_dir }})"
  ansible.builtin.file:
    path: "{{ it_scripts_dir }}"
    state: directory
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "2750"

- name: "IT-SCRIPTS | Install the admin scripts"
  ansible.builtin.copy:
    src: "{{ item.file }}"
    dest: "{{ it_scripts_dir }}/{{ item.file }}"
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "0750"
  loop: "{{ it_scripts_common
            + (it_scripts_ai if it_scripts_ai_enabled | bool else [])
            + (it_scripts_emi if it_scripts_emi_enabled | bool else []) }}"
  loop_control:
    label: "{{ item.file }}"

# An entry with an empty `link` is a HELPER invoked by another script, not a
# command of its own -- it gets installed into the scripts dir but no symlink.
- name: "IT-SCRIPTS | Expose short it-* commands in /usr/local/sbin"
  ansible.builtin.file:
    src: "{{ it_scripts_dir }}/{{ item.file }}"
    dest: "/usr/local/sbin/{{ item.link }}"
    state: link
    force: true
  loop: "{{ (it_scripts_common
             + (it_scripts_ai if it_scripts_ai_enabled | bool else [])
             + (it_scripts_emi if it_scripts_emi_enabled | bool else []))
            | selectattr('link', 'defined') | rejectattr('link', 'equalto', '') | list }}"
  loop_control:
    label: "{{ item.link }}"

# Cleanup for non-AI profiles. Also catches a box that was built as `ai` and
# later rebuilt under another profile.
- name: "IT-SCRIPTS | Remove the AI-stack tooling (not an AI node)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ (it_scripts_ai | map(attribute='file') | map('regex_replace', '^', it_scripts_dir ~ '/') | list)
            + (it_scripts_ai | map(attribute='link') | map('regex_replace', '^', '/usr/local/sbin/') | list) }}"
  when: not (it_scripts_ai_enabled | bool)

# Same cleanup for the EMI tooling: a box rebuilt under another profile would
# otherwise keep `it-vulnscan` forever, pointing at an nmap that is no longer
# installed.
- name: "IT-SCRIPTS | Remove the EMI tooling (not an EMI box)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ (it_scripts_emi | map(attribute='file') | map('regex_replace', '^', it_scripts_dir ~ '/') | list)
            + (it_scripts_emi | map(attribute='link') | map('regex_replace', '^', '/usr/local/sbin/') | list) }}"
  when: not (it_scripts_emi_enabled | bool)

- name: "IT-SCRIPTS | Where the scripts are"
  ansible.builtin.debug:
    msg: >-
      Status scripts in {{ it_scripts_dir }}. Run `it-help` to list every
      it-* command on this box, or `it-status` for the health summary.
      {{ 'AI-stack tooling (it-ai, it-models, ...) installed.'
         if it_scripts_ai_enabled | bool
         else 'AI-stack tooling is not installed on this profile.' }}
      They self-elevate with sudo.
