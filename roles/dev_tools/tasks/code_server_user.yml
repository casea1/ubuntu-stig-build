---
# One code-server instance. Included per user from code_server.yml.
#
# The port is derived from the UID so it is stable for a person: deriving it
# from a position in a list would move everyone else's port whenever someone
# left the group.

- name: "CODE-SERVER | {{ cs_user }} | Account details"
  ansible.builtin.getent:
    database: passwd
    key: "{{ cs_user }}"

- name: "CODE-SERVER | {{ cs_user }} | Resolve home, uid and port"
  ansible.builtin.set_fact:
    _cs_home: "{{ ansible_facts.getent_passwd[cs_user][4] }}"
    _cs_group: "{{ ansible_facts.getent_passwd[cs_user][2] }}"
    _cs_port: >-
      {{ dev_code_server_port | int
         + (ansible_facts.getent_passwd[cs_user][1] | int)
         - (dev_code_server_uid_base | int) }}

- name: "CODE-SERVER | {{ cs_user }} | Config dir"
  ansible.builtin.file:
    path: "{{ _cs_home }}/.config/code-server"
    state: directory
    owner: "{{ cs_user }}"
    group: "{{ cs_user }}"
    mode: "0700"

- name: "CODE-SERVER | {{ cs_user }} | config.yaml (own port, own password)"
  ansible.builtin.copy:
    dest: "{{ _cs_home }}/.config/code-server/config.yaml"
    owner: "{{ cs_user }}"
    group: "{{ cs_user }}"
    mode: "0600"
    content: |
      # Managed by ansible (dev_tools/code_server_user.yml) -- do not edit by hand.
      # Port is derived from this account's UID; see group_vars dev_code_server_*.
      bind-addr: {{ dev_code_server_bind_addr }}:{{ _cs_port }}
      auth: password
      password: {{ lookup('ansible.builtin.password',
                          '/etc/code-server/' ~ cs_user ~ '.password chars=ascii_letters,digits length=24') }}
      cert: {{ (dev_code_server_tls | default(true) | bool) | lower }}
  no_log: true
  register: _cs_conf

# Boot-start is OFF by default. code-server is one node process per user and
# the unit is WantedBy=multi-user.target, so enabling every entitled account
# meant N servers launched at every boot -- 11 on dev-16 before the engineers
# are even all added, several of them for accounts that cannot log in and so
# fail visibly on the boot splash. It is also N idle node processes and N
# listening ports for the whole uptime of a box, on a profile whose firewall
# notes already call the range "N IDEs on the LAN".
#
# The instance is a USER service now (see files/code-server-user.service), so
# there is no system unit to enable and nothing for the pull to start. The
# engineer starts their own with `it-codeserver mine start`, which needs no
# root. What the pull still has to do is take away the SYSTEM unit an earlier
# build enabled for them, or it keeps starting a second copy at every boot --
# on the same port, so one of the two loses the bind and fails.
- name: "CODE-SERVER | {{ cs_user }} | Retire the old system unit"
  ansible.builtin.systemd:
    name: "code-server@{{ cs_user }}"
    enabled: false
    state: stopped
    daemon_reload: true
  failed_when: false

- name: "CODE-SERVER | {{ cs_user }} | Clear its failed state if it left one"
  ansible.builtin.command: "systemctl reset-failed code-server@{{ cs_user }}.service"
  changed_when: false
  failed_when: false

# Lingering is what decides whether this person's IDE can run while they are
# not logged in. Off is the default and the reason nothing starts at boot; it
# is turned on per person, deliberately, by naming them in
# dev_code_server_linger_users.
- name: "CODE-SERVER | {{ cs_user }} | Linger (IDE reachable while logged out)"
  ansible.builtin.command:
    cmd: >-
      loginctl {{ 'enable-linger' if cs_user in (dev_code_server_linger_users | default([]))
                  else 'disable-linger' }} {{ cs_user }}
  register: _cs_linger
  changed_when: false
  failed_when: false

# A user who lingers gets their instance back after a reboot only if the unit
# is ENABLED in their own manager. Enabling it for someone who does not linger
# would be harmless but misleading -- it would start at their next login, which
# is not what naming them here asks for.
- name: "CODE-SERVER | {{ cs_user }} | Start it in their own manager when they linger"
  ansible.builtin.command:
    cmd: "systemctl --user --machine={{ cs_user }}@.host enable --now code-server.service"
  register: _cs_user_enable
  changed_when: "'Created symlink' in (_cs_user_enable.stderr | default(''))"
  failed_when: false
  when: cs_user in (dev_code_server_linger_users | default([]))
