# System 2 -- oikb knowledge-base sync (:8081 -> System 1's Open WebUI API).
# Opt-in: the `oikb` profile only activates when an API key is set in .env.
# Ad hoc:  docker compose --profile oikb up -d
name: oikb
networks:
  oi: { external: true }
services:
  oikb:
    image: oikb:latest          # built on the box by ansible (ai_compose)
    container_name: oikb
    profiles: ["oikb"]
    working_dir: /app
    ports: ["8081:8080"]
    # Resolves dev-ai1 in-container when its addr is an IP; no-op otherwise.
    extra_hosts:
      - "${SYSTEM1_HOSTS_ENTRY:-localhost:127.0.0.1}"
    environment:
      OPEN_WEBUI_URL: "${OPEN_WEBUI_URL:-http://dev-ai1:3000}"   # System 1, cross-node
      OPEN_WEBUI_API_KEY: "${OPEN_WEBUI_API_KEY:-}"
      GITLAB_URL: "${GITLAB_URL:-}"
      GITLAB_TOKEN: "${GITLAB_TOKEN:-}"
      LOG_FORMAT: "json"
    command: oikb daemon
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://0.0.0.0:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./.oikb.yaml:/app/.oikb.yaml
    networks: [oi]
    restart: unless-stopped
