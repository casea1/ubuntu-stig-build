# System 2 -- Grafana/LGTM (UI :3001, OTLP :4317/:4318). Receives OpenTelemetry
# from System 1's Open WebUI. ansible places the grafana/ dashboards beside this file.
name: grafana-otel
networks:
  oi:
    external: true
volumes:
  lgtm-data:
    external: true
services:
  lgtm:
    image: grafana/otel-lgtm:0.29.0
    container_name: open-webui-lgtm
    ports:
    - 3001:3000
    - 4317:4317
    - 4318:4318
    volumes:
    - lgtm-data:/data
    - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ubuntu-stig-build.yaml:ro
    - ./grafana/openwebui-dashboard.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/openwebui-dashboard.json:ro
    networks:
    - oi
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
