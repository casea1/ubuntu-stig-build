---
# =============================================================================
# ai_compose :: ai_ops_access.yml -- read access to /opt/stacks and /opt/docker
# for the non-admin AI review team (group `aiops`).
#
# The work is done by it-aiops (roles/it_scripts/files/aiops.sh), run from THIS
# checkout, so a pull applies exactly the rule an admin applies by hand and the
# two cannot drift. `it-aiops on|off` is the way to change it WITHOUT a pull; it
# records ai_ops_enabled in site.yml, so this task then agrees with it.
#
# Runs LAST in the role: ansible writes a changed file as a new inode, which
# carries no ACL, so the entries are re-applied after everything is written.
#
# The first version of this was a `find` that granted every non-hidden file but
# .env -- which included magpie's SSH keys in /opt/stacks/magpie/ssh (root:root
# 0700), because an ACL entry widens even a 0600 file. The script's rule is
# "what an admin sees without sudo", so root-only files are never touched, and
# it removes any entry that first version left behind.
# =============================================================================

- name: "AI-OPS | Grant read access (it-aiops on)"
  ansible.builtin.command:
    argv:
      - bash
      - "{{ playbook_dir }}/roles/it_scripts/files/aiops.sh"
      - "on"
      - --quiet
      - --no-persist
  environment:
    IT_AIOPS_PATHS: "{{ dockge_stacks_dir }} {{ docker_assets_dir }}"
  register: _ai_ops_on
  # --quiet prints only warnings: an item stripped, a grant that failed.
  changed_when: _ai_ops_on.stdout | length > 0
  when: ai_ops_enabled | default(false) | bool

# Ansible only ever creates (trap 3), so off has to take it away. Skipped on a
# box that never had it -- no group and no grant -- so it costs nothing there.
- name: "AI-OPS | Remove it when the feature is off (it-aiops off)"
  ansible.builtin.shell: >-
    getent group aiops >/dev/null || [ -e /etc/sudoers.d/40-aiops ] || exit 0;
    bash "{{ playbook_dir }}/roles/it_scripts/files/aiops.sh" off --quiet --no-persist
  environment:
    IT_AIOPS_PATHS: "{{ dockge_stacks_dir }} {{ docker_assets_dir }}"
  changed_when: false
  when: not (ai_ops_enabled | default(false) | bool)
