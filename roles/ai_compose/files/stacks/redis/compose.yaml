# System 1 -- Redis (Open WebUI websocket coordination + cache).
name: redis
networks:
  oi: { external: true }
volumes:
  redis-data: { external: true }
services:
  redis:
    image: redis:7.2.14-bookworm
    container_name: redis
    entrypoint: ["redis-server"]
    command: "--save 30 1 --appendonly yes --maxclients 10000 --timeout 1800 --maxmemory-policy noeviction"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID, DAC_OVERRIDE]
    logging:
      driver: "json-file"
      options: { max-size: "1m", max-file: "1" }
    networks: [oi]
    restart: unless-stopped
