---
# =============================================================================
# powerstrux -- make the PowerStrux LA audit runnable by an auditor and run it
# on a schedule.
#
# NOT MANAGED HERE: the ReportHTML module, Initiate-PowerstruxLA.ps1, and
# PowerStruxLAConfig.txt. Those are installed and tuned by hand, and this role
# never writes them -- a hand-edited config surviving a pull is the whole point.
# =============================================================================

- name: "POWERSTRUX | Is the PowerShell entry point present?"
  ansible.builtin.stat:
    path: "{{ powerstrux_script }}"
  register: _ps_script

- name: "POWERSTRUX | Not installed -- skipping"
  ansible.builtin.debug:
    msg: >-
      PowerStrux not found at {{ powerstrux_script }}. The launcher and schedule
      are skipped. Install the ReportHTML module + Initiate-PowerstruxLA.ps1,
      then re-run the pull (or set powerstrux_script if it lives elsewhere).
  when: not _ps_script.stat.exists

- name: "POWERSTRUX | Configure the launcher and schedule"
  when: _ps_script.stat.exists
  block:
    - name: "POWERSTRUX | Audit dir exists ({{ powerstrux_audit_dir }})"
      ansible.builtin.file:
        path: "{{ powerstrux_audit_dir }}"
        state: directory
        owner: root
        group: audit
        mode: "2770"

    # 0750 root:audit -- auditors run it, nobody else can read or edit it. The
    # script self-elevates, so group-execute is enough.
    - name: "POWERSTRUX | Install the launcher"
      ansible.builtin.copy:
        src: run-powerstrux.sh
        dest: "{{ powerstrux_audit_dir }}/run-powerstrux.sh"
        owner: root
        group: audit
        mode: "0750"

    - name: "POWERSTRUX | Install the offload engine"
      ansible.builtin.copy:
        src: powerstrux-offload.sh
        dest: "{{ powerstrux_audit_dir }}/powerstrux-offload.sh"
        owner: root
        group: audit
        mode: "0750"

    - name: "POWERSTRUX | Short command for admins (it-powerstrux)"
      ansible.builtin.file:
        src: "{{ powerstrux_audit_dir }}/run-powerstrux.sh"
        dest: /usr/local/sbin/it-powerstrux
        state: link
        force: true

    # In /usr/share/applications it appears in the app grid for every user and
    # needs no per-user "trust this launcher" step, which a file dropped on the
    # Desktop does need under GNOME.
    - name: "POWERSTRUX | Desktop launcher"
      ansible.builtin.copy:
        src: powerstrux-audit.desktop
        dest: /usr/share/applications/powerstrux-audit.desktop
        owner: root
        group: root
        mode: "0644"
      when: powerstrux_desktop_entry | default(true) | bool
      register: _ps_desktop

    # A second entry for the half an auditor actually repeats: reading the
    # report. It opens a COPY in the user's home, because a snap-confined
    # browser cannot see /opt at all -- see run-powerstrux.sh.
    - name: "POWERSTRUX | Desktop launcher for viewing the newest report"
      ansible.builtin.copy:
        src: powerstrux-report.desktop
        dest: /usr/share/applications/powerstrux-report.desktop
        owner: root
        group: root
        mode: "0644"
      when: powerstrux_desktop_entry | default(true) | bool
      register: _ps_desktop_view

    # GNOME reads the desktop DATABASE, not the directory. Without this the
    # launcher can stay out of the app grid until the next reboot -- which is
    # exactly what happened when this role first shipped.
    - name: "POWERSTRUX | Refresh the desktop database"
      ansible.builtin.command: update-desktop-database /usr/share/applications
      changed_when: false
      failed_when: false
      when: _ps_desktop is changed or _ps_desktop_view is changed

    # ---- weekly offload ---------------------------------------------------
    # Placed BEFORE the schedule block so powerstrux-offload.service exists by
    # the time powerstrux-audit.service names it in Wants=.
    - name: "POWERSTRUX | Weekly offload"
      when: powerstrux_offload_enabled | default(true) | bool
      block:
        # The script reads this, not group_vars: `it-powerstrux offload setup`
        # has to take effect immediately, without waiting for a pull. It writes
        # BOTH this file and /opt/it/site.yml, which is what this template
        # renders from -- so an on-box change and a pull agree.
        - name: "POWERSTRUX | Offload configuration"
          ansible.builtin.template:
            src: powerstrux-offload.conf.j2
            dest: /etc/stig-build/powerstrux-offload.conf
            owner: root
            group: root
            mode: "0640"

        - name: "POWERSTRUX | Local staging dir for the week folders"
          ansible.builtin.file:
            path: "{{ powerstrux_offload_dir }}"
            state: directory
            owner: root
            group: audit
            mode: "0750"

        # cifs-utils and smbclient are NOT installed here: base_common_packages
        # already puts both on every box, and an apt call in this role would
        # run under `it-pull scripts`, which is the one mode that has no apt.
        - name: "POWERSTRUX | offload service unit"
          ansible.builtin.copy:
            dest: /etc/systemd/system/powerstrux-offload.service
            owner: root
            group: root
            mode: "0644"
            content: |
              # Managed by the powerstrux role -- do not edit by hand.
              [Unit]
              Description=Offload the week's PowerStrux report and logs
              Documentation=file:///etc/stig-build/powerstrux-offload.conf
              # Ordered after the audit, and pulled in BY the audit (Wants= in
              # powerstrux-audit.service). That is the whole ordering fix: the
              # old audit-offload cron.weekly job could and did run before the
              # week's report existed.
              After=powerstrux-audit.service network-online.target
              Wants=network-online.target

              [Service]
              Type=oneshot
              ExecStart={{ powerstrux_audit_dir }}/powerstrux-offload.sh run --quiet
              # Mounting a share that is not there, then copying a few hundred
              # MB over it, is the slow part -- not the collection.
              TimeoutStartSec=1800
              Nice=10
              IOSchedulingClass=idle
          register: _ps_off_unit

        # Normally absent: the offload is chained to the audit and needs no
        # timer. A site that wants it on its own cadence sets
        # powerstrux_offload_oncalendar and gets one as well.
        - name: "POWERSTRUX | offload timer unit (only if given its own schedule)"
          ansible.builtin.copy:
            dest: /etc/systemd/system/powerstrux-offload.timer
            owner: root
            group: root
            mode: "0644"
            content: |
              # Managed by the powerstrux role -- do not edit by hand.
              [Unit]
              Description=PowerStrux offload ({{ powerstrux_offload_oncalendar }})

              [Timer]
              OnCalendar={{ powerstrux_offload_oncalendar }}
              Persistent=true
              RandomizedDelaySec=600
              Unit=powerstrux-offload.service

              [Install]
              WantedBy=timers.target
          when: powerstrux_offload_oncalendar | default('') | length > 0
          register: _ps_off_timer

        - name: "POWERSTRUX | Remove the offload timer when it has no schedule"
          ansible.builtin.systemd:
            name: powerstrux-offload.timer
            enabled: false
            state: stopped
          failed_when: false
          when: powerstrux_offload_oncalendar | default('') | length == 0

        - name: "POWERSTRUX | Drop the unused offload timer unit"
          ansible.builtin.file:
            path: /etc/systemd/system/powerstrux-offload.timer
            state: absent
          when: powerstrux_offload_oncalendar | default('') | length == 0

        - name: "POWERSTRUX | Enable the offload timer"
          ansible.builtin.systemd:
            name: powerstrux-offload.timer
            enabled: true
            state: started
            daemon_reload: true
          when: powerstrux_offload_oncalendar | default('') | length > 0

        - name: "POWERSTRUX | Reload systemd for the offload units"
          ansible.builtin.systemd:
            daemon_reload: true
          when: _ps_off_unit is changed or (_ps_off_timer is defined and _ps_off_timer is changed)

    # Turning the offload off has to take the units away: copy/template only
    # ever create, so a box that once had it enabled would keep firing it.
    - name: "POWERSTRUX | Offload disabled -- remove its units"
      when: not (powerstrux_offload_enabled | default(true) | bool)
      block:
        - name: "POWERSTRUX | Stop and disable the offload units"
          ansible.builtin.systemd:
            name: "{{ item }}"
            enabled: false
            state: stopped
          loop:
            - powerstrux-offload.timer
            - powerstrux-offload.service
          failed_when: false

        - name: "POWERSTRUX | Remove the offload units"
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/systemd/system/powerstrux-offload.timer
            - /etc/systemd/system/powerstrux-offload.service
          register: _ps_off_gone

        - name: "POWERSTRUX | Reload systemd after removing the offload units"
          ansible.builtin.systemd:
            daemon_reload: true
          when: _ps_off_gone is changed

    # ---- schedule ---------------------------------------------------------
    - name: "POWERSTRUX | Scheduled audit ({{ powerstrux_schedule_method }})"
      when: powerstrux_schedule_enabled | default(true) | bool
      block:
        - name: "POWERSTRUX | systemd service unit"
          ansible.builtin.copy:
            dest: /etc/systemd/system/powerstrux-audit.service
            owner: root
            group: root
            mode: "0644"
            content: |
              # Managed by the powerstrux role -- do not edit by hand.
              [Unit]
              Description=PowerStrux system audit report
              Documentation=file://{{ powerstrux_audit_dir }}
              After=network-online.target
              # The offload is Wants=, not Requires=, and is itself ordered
              # After= this unit -- so it starts when the audit FINISHES,
              # however long the audit took, and still runs if the audit
              # failed (the log of a failed run is worth offloading too).
              {% if powerstrux_offload_enabled | default(true) | bool %}Wants=powerstrux-offload.service{% endif %}

              [Service]
              Type=oneshot
              ExecStart={{ powerstrux_audit_dir }}/run-powerstrux.sh --quiet
              # The audit walks the whole system; give it room rather than
              # having a slow box produce a truncated report.
              TimeoutStartSec=3600
              Nice=10
              IOSchedulingClass=idle
          when: powerstrux_schedule_method == 'timer'
          register: _ps_unit

        - name: "POWERSTRUX | systemd timer unit"
          ansible.builtin.copy:
            dest: /etc/systemd/system/powerstrux-audit.timer
            owner: root
            group: root
            mode: "0644"
            content: |
              # Managed by the powerstrux role -- do not edit by hand.
              [Unit]
              Description=Weekly PowerStrux audit ({{ powerstrux_oncalendar }})

              [Timer]
              OnCalendar={{ powerstrux_oncalendar }}
              # A laptop is shut at 03:00 on a Wednesday. Persistent=true runs
              # the missed audit at the next boot instead of skipping the week.
              Persistent=true
              RandomizedDelaySec=300
              Unit=powerstrux-audit.service

              [Install]
              WantedBy=timers.target
          when: powerstrux_schedule_method == 'timer'
          register: _ps_timer

        - name: "POWERSTRUX | Enable the timer"
          ansible.builtin.systemd:
            name: powerstrux-audit.timer
            enabled: true
            state: started
            daemon_reload: true
          when: powerstrux_schedule_method == 'timer'

        - name: "POWERSTRUX | cron.d entry"
          ansible.builtin.copy:
            dest: /etc/cron.d/powerstrux-audit
            owner: root
            group: root
            mode: "0644"
            content: |
              # Managed by the powerstrux role -- do not edit by hand.
              # A run missed while the box was powered off is LOST; use the
              # systemd timer (powerstrux_schedule_method: timer) if that
              # matters, which on a laptop it does.
              SHELL=/bin/bash
              PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              # `;` not `&&`: a failed audit still has a log worth offloading.
              {{ powerstrux_cron }} root {{ powerstrux_audit_dir }}/run-powerstrux.sh --quiet >/dev/null 2>&1{% if powerstrux_offload_enabled | default(true) | bool %}; {{ powerstrux_audit_dir }}/powerstrux-offload.sh run --quiet >/dev/null 2>&1{% endif %}
          when: powerstrux_schedule_method == 'cron'

        # Only one scheduler may be active, or the audit runs twice.
        - name: "POWERSTRUX | Remove the scheduler that is not in use"
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop: "{{ ['/etc/cron.d/powerstrux-audit'] if powerstrux_schedule_method == 'timer'
                    else ['/etc/systemd/system/powerstrux-audit.timer'] }}"

    - name: "POWERSTRUX | Where things are"
      ansible.builtin.debug:
        msg: >-
          PowerStrux launcher: {{ powerstrux_audit_dir }}/run-powerstrux.sh
          (also `sudo it-powerstrux`, and "PowerStrux Audit" in the app menu).
          Scheduled {{ powerstrux_oncalendar if powerstrux_schedule_method == 'timer' else powerstrux_cron }}
          via {{ powerstrux_schedule_method }}. Config is NOT managed:
          {{ powerstrux_script | dirname }}/PowerStruxLAConfig.txt.
          {% if powerstrux_offload_enabled | default(true) | bool %}Offload:
          {{ 'pushes to ' ~ powerstrux_offload_smb_share ~ '/' ~ powerstrux_offload_smb_subdir
             if powerstrux_offload_smb_enabled | default(false) | bool
             else 'stages locally in ' ~ powerstrux_offload_dir ~ ' only -- set a share with `it-powerstrux offload setup`' }}
          {% else %}Offload: disabled.{% endif %}
