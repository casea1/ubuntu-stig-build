---
# Node.js from the official NodeSource apt repo, pinned to a major LTS line
# (nodejs_major_version, default 22 "Jod"). NodeSource's `nodejs` package bundles
# npm, so there is no separate npm install. Runs before hardening -- needs
# internet + apt, same as the other dev_tools installs.

- name: "Node | Ensure the apt keyrings dir exists"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: "Node | Download the NodeSource signing key"
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: "Node | Add the NodeSource repository (Node {{ nodejs_major_version }}.x)"
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ nodejs_major_version }}.x nodistro main"
    filename: nodesource
    state: present

- name: "Node | Install Node.js (bundles npm)"
  ansible.builtin.apt:
    name: nodejs
    update_cache: true
    state: present
