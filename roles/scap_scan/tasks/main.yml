---
# Runs an OpenSCAP evaluation against the DISA STIG profile and saves both an
# HTML report (human-readable) and a STIG-Viewer-importable result file.
# RUN THIS WHILE THE BOX STILL HAS INTERNET — the SSG content and any remote
# OVAL resources must be available. After this, the box can go air-gapped.

# The distro package (ssg-debderived) currently ships datastreams only through
# Ubuntu 22.04, so we can't rely on it for 24.04. Install it anyway (cheap,
# pulls oscap-friendly content for other releases), then fetch the 24.04
# datastream from a pinned SCAP Security Guide release below.
- name: Install the distro SSG content package (best-effort)
  ansible.builtin.apt:
    name: ssg-debderived
    state: present
  register: ssg_pkg
  failed_when: false

- name: Check whether an Ubuntu 24.04 datastream is already present
  ansible.builtin.find:
    paths: "{{ scap_content_dir }}"
    patterns: "ssg-ubuntu24*-ds*.xml"
  register: ssg_ds_existing

# Only download the (~175 MB) SSG release bundle if apt didn't already provide a
# 24.04 datastream. Idempotent: 'creates' skips re-extraction on re-runs.
- name: Fetch the Ubuntu 24.04 datastream from a SCAP Security Guide release
  when: ssg_ds_existing.matched == 0
  block:
    - name: Ensure the SSG content directory exists
      ansible.builtin.file:
        path: "{{ scap_content_dir }}"
        state: directory
        mode: "0755"

    - name: Download SCAP Security Guide {{ ssg_content_version }} bundle (sha512-verified)
      ansible.builtin.get_url:
        url: "{{ ssg_release_base }}/v{{ ssg_content_version }}/scap-security-guide-{{ ssg_content_version }}.tar.gz"
        dest: "/tmp/scap-security-guide-{{ ssg_content_version }}.tar.gz"
        checksum: "sha512:{{ ssg_release_base }}/v{{ ssg_content_version }}/scap-security-guide-{{ ssg_content_version }}.tar.gz.sha512"
        mode: "0644"

    - name: Extract only the Ubuntu 24.04 datastream into the content dir
      ansible.builtin.command:
        cmd: >
          tar -xzf /tmp/scap-security-guide-{{ ssg_content_version }}.tar.gz
          --wildcards --strip-components=1
          -C {{ scap_content_dir }}
          '*/ssg-ubuntu2404-ds.xml'
        creates: "{{ scap_content_dir }}/ssg-ubuntu2404-ds.xml"

- name: Locate the Ubuntu 24.04 STIG datastream
  ansible.builtin.find:
    paths: "{{ scap_content_dir }}"
    patterns: "ssg-ubuntu24*-ds*.xml"
  register: ssg_ds

- name: Fail clearly if no datastream is present
  ansible.builtin.fail:
    msg: >
      No Ubuntu 24.04 SSG datastream found in {{ scap_content_dir }}.
      The SSG {{ ssg_content_version }} download/extract step produced nothing —
      check internet access at build time and that the release still ships
      ssg-ubuntu2404-ds.xml.
  when: ssg_ds.matched == 0

- name: Set datastream path fact
  ansible.builtin.set_fact:
    scap_datastream: "{{ ssg_ds.files | map(attribute='path') | sort | last }}"

- name: Create report directory
  ansible.builtin.file:
    path: "{{ scap_build_dir }}"
    state: directory
    mode: "0750"

# RE-APPLY /var/log MODES IMMEDIATELY BEFORE THE SCAN.
#
# usg_remediate sweeps these, and then THIS ROLE runs apt (the SSG content
# package, above) -- which recreates /var/log/dpkg.log and /var/log/apt/*.log
# at 0644 after that sweep and before the scan below reads them. That is why
# file_permissions_var_log_stig (UBTU-24-700010) kept failing on a box whose
# remediation had run correctly minutes earlier.
#
# Start the unit usg_remediate installs rather than repeating its find here:
# one definition of "what the STIG wants", in one place. If the unit is absent
# (usg_remediate skipped) this is a no-op and the rule reports honestly.
- name: Re-apply /var/log permissions before scanning (UBTU-24-700010)
  ansible.builtin.systemd:
    name: stig-log-perms.service
    state: started
  register: _log_perms_pre_scan
  failed_when: false
  changed_when: false

- name: "Note when the /var/log sweep could not run"
  ansible.builtin.debug:
    msg: >-
      stig-log-perms.service is not present, so /var/log modes were NOT
      re-applied before this scan. Expect file_permissions_var_log_stig to fail
      on any log apt recreated during this run. Installed by usg_remediate --
      check whether that role was skipped.
  when: _log_perms_pre_scan is failed or (_log_perms_pre_scan.status is not defined)

# ---------------------------------------------------------------------------
# SHOULD THIS PULL SCAN AT ALL?
#
# scap_scan_on_pull: build (default) -- scan only when this box has no
# build-time result yet. A routine pull (a config change, a new it-* script)
# then costs no benchmark evaluation at all, and the evidence still comes from
# the weekly oscap-scan.timer below and from `sudo it-stig run` on demand.
# 'always' is the pre-2026-08 behaviour and is what `it-pull full` passes;
# 'never' leaves the timer as the only source. See group_vars/all.yml.
#
# Everything ABOVE this point still runs on every pull -- staging the SSG
# datastream, the report dir, the /var/log sweep -- and so does everything
# below it except the evaluation itself: answers.yml, the tailoring and the
# timer are configuration, and a light pull is exactly when you want them
# updated.
# ---------------------------------------------------------------------------
- name: "SCAP | Existing build-time results?"
  ansible.builtin.find:
    paths: "{{ scap_build_dir }}"
    patterns: ["stig-*.xml", "stig-*.html"]
    file_type: file
  register: _scap_prior
  changed_when: false
  failed_when: false

- name: "SCAP | Decide whether to evaluate this run"
  ansible.builtin.set_fact:
    _scap_eval_now: >-
      {{ (scap_scan_on_pull | default('build')) == 'always'
         or ((scap_scan_on_pull | default('build')) == 'build'
             and (_scap_prior.files | default([]) | length) == 0) }}

- name: "SCAP | Not evaluating this run"
  ansible.builtin.debug:
    msg: >-
      Skipping the build-time SCAP evaluation (scap_scan_on_pull={{ scap_scan_on_pull | default('build') }},
      {{ _scap_prior.files | default([]) | length }} existing result file(s) in {{ scap_build_dir }}).
      Evidence comes from the weekly oscap-scan timer and `sudo it-stig run`.
      Force one now with `sudo it-pull full` or `sudo it-stig run`.
  when: not (_scap_eval_now | bool)

- name: Run OpenSCAP STIG evaluation
  when: _scap_eval_now | bool
  # oscap returns 0 = all pass, 2 = some rules failed. Both mean "scan ran OK";
  # only treat other codes as a real error.
  ansible.builtin.command:
    cmd: >
      oscap xccdf eval
      --profile {{ scap_profile }}
      --fetch-remote-resources
      --results-arf {{ scap_build_dir }}/stig-arf-{{ ansible_date_time.date }}.xml
      --report {{ scap_build_dir }}/stig-report-{{ ansible_date_time.date }}.html
      --stig-viewer {{ scap_build_dir }}/stig-viewer-{{ ansible_date_time.date }}.xml
      {{ scap_datastream }}
  register: oscap_run
  failed_when: oscap_run.rc not in [0, 2]
  changed_when: false

- name: Report where the results landed
  when: _scap_eval_now | bool
  ansible.builtin.debug:
    msg: >
      SCAP scan complete (rc={{ oscap_run.rc }}).
      HTML report:     {{ scap_build_dir }}/stig-report-{{ ansible_date_time.date }}.html
      STIG Viewer XML: {{ scap_build_dir }}/stig-viewer-{{ ansible_date_time.date }}.xml
      Collect these before air-gapping the machine.

# =============================================================================
# SCHEDULED RE-SCAN -- the build-time scan above is a point-in-time artifact.
# This keeps producing evidence on a cadence, into the IA collection point.
# Runs as ROOT deliberately: oscap needs to read privileged config, and running
# it as auto_audit would need a sudo credential that account does not have.
# =============================================================================
- name: "SCAP | Scheduled re-scan"
  when: scap_schedule_enabled | default(true) | bool
  block:
    - name: "SCAP | Ensure the scheduled-scan dir exists ({{ scap_scheduled_dir }})"
      ansible.builtin.file:
        path: "{{ scap_scheduled_dir }}"
        state: directory
        owner: root
        group: "{{ ia_it_group | default('sudo') }}"
        mode: "2750"        # setgid: results stay readable by the admin group

    # ---- systemd timer (default) --------------------------------------------
    - name: "SCAP | Scheduled scan service unit"
      ansible.builtin.copy:
        dest: /etc/systemd/system/oscap-scan.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=OpenSCAP DISA-STIG evaluation
          Documentation=file://{{ scap_scheduled_dir }}
          [Service]
          Type=oneshot
          Nice=10
          IOSchedulingClass=idle
          ExecStart=/usr/local/sbin/it-oscap --dir {{ scap_scheduled_dir }} --profile {{ scap_profile }} --keep {{ scap_schedule_keep | default(12) }}
      when: scap_schedule_method | default('timer') == 'timer'

    - name: "SCAP | Scheduled scan timer unit"
      ansible.builtin.copy:
        dest: /etc/systemd/system/oscap-scan.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Run the OpenSCAP STIG evaluation on a schedule
          [Timer]
          OnCalendar={{ scap_schedule_oncalendar | default('weekly') }}
          Persistent=true
          RandomizedDelaySec=30m
          [Install]
          WantedBy=timers.target
      when: scap_schedule_method | default('timer') == 'timer'
      notify: reload systemd

    - name: "SCAP | Enable the scan timer"
      ansible.builtin.systemd:
        name: oscap-scan.timer
        enabled: true
        state: started
        daemon_reload: true
      when: scap_schedule_method | default('timer') == 'timer'

    # ---- cron.d (literal "crontab" compliance) ------------------------------
    - name: "SCAP | Scheduled scan cron entry"
      ansible.builtin.copy:
        dest: /etc/cron.d/oscap-scan
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by ansible (scap_scan) -- OpenSCAP DISA-STIG evaluation.
          SHELL=/bin/bash
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          {{ scap_schedule_cron }} root /usr/local/sbin/it-oscap --dir {{ scap_scheduled_dir }} --profile {{ scap_profile }} --keep {{ scap_schedule_keep | default(12) }} >/dev/null 2>&1
      when: scap_schedule_method | default('timer') == 'cron'

    # ---- remove the method that is NOT in use, so only one scheduler runs ----
    - name: "SCAP | Remove the unused scheduler"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ ['/etc/cron.d/oscap-scan'] if (scap_schedule_method | default('timer')) == 'timer' else ['/etc/systemd/system/oscap-scan.timer', '/etc/systemd/system/oscap-scan.service'] }}"

    - name: "SCAP | Scheduled scan summary"
      ansible.builtin.debug:
        msg: >-
          OpenSCAP re-scan scheduled via {{ scap_schedule_method | default('timer') }}
          ({{ scap_schedule_oncalendar if (scap_schedule_method | default('timer')) == 'timer' else scap_schedule_cron }});
          results -> {{ scap_scheduled_dir }}, keeping {{ scap_schedule_keep | default(12) }} sets.
          Run on demand: sudo it-oscap

# ---------------------------------------------------------------------------
# STIG CHECKLIST (.ckl/.cklb) INPUTS
# `it-oscap` already writes the oscap --stig-viewer XML that STIG Viewer
# imports, which covers the automated rules. The manual rules are the slow half
# of building a checklist, and most of those answers are the SAME on every box
# -- the deviations and compensating controls we have already adjudicated. They
# belong in the repo, not retyped per machine, so render them here and let
# `it-ckl` merge them over the scan results.
#
# The one input we cannot generate is DISA's manual STIG XCCDF: it is published
# by DISA, not derived from anything on the box. Drop it into scap_stig_dir
# once per STIG release.
# ---------------------------------------------------------------------------
- name: "SCAP | Checklist working dir ({{ scap_stig_dir }})"
  ansible.builtin.file:
    path: "{{ scap_stig_dir }}"
    state: directory
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "2750"

- name: "SCAP | Render the checklist adjudications for this profile"
  ansible.builtin.template:
    src: ckl-answers.yml.j2
    dest: "{{ scap_stig_dir }}/answers.yml"
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "0640"

# ---------------------------------------------------------------------------
# DISA's manual STIG XCCDF. This used to be the one input an operator had to
# fetch by hand from cyber.mil for every box, and forgetting it meant `it-ckl`
# had no skeleton to fill in. It is public, unclassified, freely
# redistributable content, so it ships in the repo and lands on every box.
#
# Per STIG RELEASE, not per box: when DISA publishes V1R7, drop the new
# Manual-xccdf.xml into roles/scap_scan/files/, update
# scap_stig_manual_xccdf, and delete the old one -- `it-ckl` takes the NEWEST
# match, so leaving both behind would work but makes "which release is this
# checklist against" a guess.
# ---------------------------------------------------------------------------
- name: "SCAP | Ship DISA's manual STIG XCCDF ({{ scap_stig_manual_xccdf }})"
  ansible.builtin.copy:
    src: "{{ scap_stig_manual_xccdf }}"
    dest: "{{ scap_stig_content_dir }}/{{ scap_stig_manual_xccdf }}"
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "0640"
  when: (scap_stig_manual_xccdf | default('')) | length > 0

- name: "SCAP | Is a manual STIG XCCDF staged?"
  ansible.builtin.find:
    paths: "{{ scap_stig_content_dir }}"
    patterns: "*xccdf*.xml"
  register: _stig_manual

- name: "SCAP | No manual STIG XCCDF available"
  ansible.builtin.debug:
    msg: >-
      No manual STIG XCCDF in {{ scap_stig_content_dir }}. Download the Ubuntu
      24.04 STIG from https://public.cyber.mil/stigs/downloads/, unzip it, and
      put the *Manual-xccdf.xml in roles/scap_scan/files/ so every box gets it.
      Until then `it-ckl` has no skeleton to fill in, though `it-oscap` still
      produces the STIG Viewer import.
  when: (_stig_manual.files | length) == 0

# ---------------------------------------------------------------------------
# Build the checklist at the end of the pull. The scan above already ran, so
# this is `it-ckl` alone -- it reads the newest results rather than scanning
# again. Cheap, and it means every box carries a current .cklb without anyone
# remembering to ask for one.
#
# NOT fatal on failure: a missing input or an odd scan should never fail a
# build whose real job is hardening. It says what went wrong instead.
# ---------------------------------------------------------------------------
# Gated on the evaluation having run THIS pull: it-ckl reads the newest scan
# results, so without a new scan it would rewrite an identical checklist on
# every pull -- more files to prune, no new information.
- name: "SCAP | Build the STIG checklist"
  when:
    - scap_ckl_on_pull | default(true) | bool
    - _scap_eval_now | bool
    - (_stig_manual.files | length) > 0
  block:
    - name: "SCAP | Is it-ckl installed?"
      ansible.builtin.stat:
        path: /usr/local/sbin/it-ckl
      register: _ckl_bin

    - name: "SCAP | Generate the .cklb from the newest scan"
      ansible.builtin.command:
        cmd: /usr/local/sbin/it-ckl --format {{ scap_ckl_format | default('cklb') }}
      register: _ckl_run
      changed_when: _ckl_run.rc == 0
      failed_when: false
      when: _ckl_bin.stat.exists

    - name: "SCAP | Checklist result"
      ansible.builtin.debug:
        msg: >-
          {% if not (_ckl_bin.stat.exists | default(false)) %}
          it-ckl is not installed (it_scripts runs before this role -- if it is
          missing, that role failed). No checklist was generated.
          {% elif _ckl_run.rc == 0 %}
          Checklist written to {{ scap_stig_checklist_dir }}. Review it with
          `sudo it-ckl --unjustified` and archive with `sudo it-stig archive`.
          {% else %}
          it-ckl exited {{ _ckl_run.rc }} -- no checklist this run. The build is
          unaffected. Diagnose with `sudo it-stig status`.
          {{ (_ckl_run.stderr | default('')) | trim | truncate(200) }}
          {% endif %}
