---
# =============================================================================
# remote_desktop -- give the DEVELOPMENT box a GUI that users reach over RDP.
# Runs on the development profile only (gated in local.yml), AFTER dev_tools and
# BEFORE hardening -- so it needs internet, and the STIG run then locks the box
# (incl. the RDP service's PAM stack) down around it.
#
#   gui.yml  -- install the GNOME desktop + GDM (so a headless server base gets a
#               GUI), boot to graphical.target, disable Wayland (xrdp needs Xorg)
#   xrdp.yml -- install + configure xrdp for GNOME-over-Xorg, with the Ubuntu
#               24.04 gotchas handled (ssl-cert key access, colord polkit prompt),
#               rate-limited on the host firewall
#   sessions.yml -- session reaping + it-rdp. A session that was never cleaned
#               up makes the NEXT login for that user fail immediately after
#               authentication, which reads as a flaky RDP server.
# =============================================================================

- name: "Install the GNOME desktop environment"
  ansible.builtin.import_tasks: gui.yml
  when: dev_install_gnome | default(true) | bool

- name: "Install and configure xrdp (RDP into the GNOME GUI)"
  ansible.builtin.import_tasks: xrdp.yml
  when: dev_rdp_enabled | default(true) | bool

- name: "Session reaping, so a stale session cannot break the next login"
  ansible.builtin.import_tasks: sessions.yml
  when: dev_rdp_enabled | default(true) | bool

- name: "XFCE as the RDP desktop, or an option (rdp_desktop / rdp_xfce_install)"
  ansible.builtin.import_tasks: xfce.yml
  when:
    - dev_rdp_enabled | default(true) | bool
    - (rdp_xfce_install | default(false) | bool) or (rdp_desktop | default('gnome')) == 'xfce'

# Switched off: stop choosing for RDP sessions. The packages stay (removing a
# desktop under logged-in users is worse than leaving it), so does it-desktop's
# per-user choice file -- without the selector it is simply not read.
- name: "XFCE | Remove the RDP desktop selector when XFCE is off"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/X11/Xsession.d/52it-rdp-desktop
    - /etc/default/it-rdp-desktop
    - /usr/local/bin/it-desktop
  when:
    - not (rdp_xfce_install | default(false) | bool)
    - (rdp_desktop | default('gnome')) != 'xfce'

