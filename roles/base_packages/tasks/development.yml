---
# DEVELOPMENT profile baseline -- the full engineering-workstation app set.
# Included from main.yml only when is_development. The GNOME desktop + xrdp are
# added separately by the remote_desktop role; this file is the CLI/app tooling.
# The apt-cache refresh lives in main.yml (runs for both profiles). Runs BEFORE
# hardening so that umask/mount restrictions don't interfere with package/pip ops.

- name: Install core packages
  ansible.builtin.apt:
    name:
      - clamav
      - clamav-daemon
      - clamav-freshclam
      - wireshark           # pulls tshark/dumpcap; install prompts handled below
      - tshark
      - python3
      - python3-pip
      - python3-venv
      - putty               # PuTTY GUI app
      - putty-tools         # plink / pscp / psftp CLI
      - openssh-client
      - git
      - openscap-scanner    # OpenSCAP scanner (CLI: oscap) — 24.04 pkg name (was libopenscap8)
    state: present

# --- Wireshark non-interactive install --------------------------------------
# The wireshark package asks (via debconf) whether non-root users may capture.
# Preseed the answer so ansible-pull never hangs on the prompt.
- name: Preseed wireshark-common (allow non-root capture, group-gated)
  ansible.builtin.debconf:
    name: wireshark-common
    question: wireshark-common/install-setuid
    value: "true"
    vtype: boolean

- name: Reconfigure wireshark-common to apply preseed
  ansible.builtin.command: dpkg-reconfigure -f noninteractive wireshark-common
  changed_when: false

# --- Editor (conditional) ---------------------------------------------------
- name: Install vim
  ansible.builtin.apt:
    name: vim
    state: present
  when: editor_choice == "vim"

- name: Install neovim
  ansible.builtin.apt:
    name: neovim
    state: present
  when: editor_choice == "neovim"

# Skipped when the box reads a local repo: packages.microsoft.com is
# unreachable air-gapped, and a source entry left pointing at it makes every
# later `apt-get update` stall on a timeout. VS Code has to come from the
# offline repo (or already be installed) in that case.
- name: Add Microsoft VS Code apt key and repo
  when:
    - editor_choice == "vscode"
    - not (offline_repo_enabled | default(false) | bool)
  block:
    - name: Ensure keyrings dir exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Microsoft GPG key
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/keyrings/microsoft.asc
        mode: "0644"

    - name: Add VS Code repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.asc] https://packages.microsoft.com/repos/code stable main"
        filename: vscode
        state: present

    - name: Install VS Code
      ansible.builtin.apt:
        name: code
        update_cache: true
        state: present

# PowerShell now installs on ALL profiles from base_packages/main.yml (common).

# --- Network provisioning services (PXE/imaging) ----------------------------
# tftpd-hpa, isc-dhcp-server, dnsmasq — installed per requirement. These are
# server daemons the SCAP/STIG scan WILL flag (TFTP especially is a classic
# "must not be installed" control); document them as mission-need exceptions
# during triage. The STIG role itself does not remove them.
# Installed but left DISABLED + STOPPED so the box has no unconfigured listening
# services. Enable them deliberately once configured (note: dnsmasq binds :53
# and will collide with systemd-resolved until you reconfigure one of them).
- name: Install network provisioning services (TFTP/DHCP/DNS)
  ansible.builtin.apt:
    name:
      - tftpd-hpa
      - isc-dhcp-server
      - dnsmasq
    state: present

- name: Leave provisioning services disabled + stopped until deliberately configured
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - tftpd-hpa
    - isc-dhcp-server
    - dnsmasq
  failed_when: false
