---
# Post-install configuration that the package install alone doesn't do, and
# that STIG cares about: ClamAV actually running + updating, and Wireshark
# capture restricted to an authorized group.

# --- Wireshark: restrict capture to authorized users ------------------------
- name: Ensure wireshark group exists
  ansible.builtin.group:
    name: wireshark
    state: present
  when: is_development | default(false) | bool or is_emi | default(false) | bool

- name: Add authorized users to wireshark group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: wireshark
    append: true
  loop: "{{ wireshark_users }}"
  when: is_development | default(false) | bool or is_emi | default(false) | bool

- name: Lock down dumpcap to root:wireshark, no world access
  ansible.builtin.file:
    path: /usr/bin/dumpcap
    owner: root
    group: wireshark
    mode: "0750"
  when: is_development | default(false) | bool or is_emi | default(false) | bool

# --- ClamAV: freshclam definition updates -----------------------------------

- name: Configure freshclam update frequency
  ansible.builtin.lineinfile:
    path: /etc/clamav/freshclam.conf
    regexp: '^Checks '
    line: "Checks {{ clamav_freshclam_checks_per_day }}"
    state: present
  notify: restart freshclam
  when: clamav_freshclam_enabled

- name: Enable and start freshclam
  ansible.builtin.systemd:
    name: clamav-freshclam
    enabled: true
    state: started
  when: clamav_freshclam_enabled

# --- ClamAV: daemon ---------------------------------------------------------
# First-run freshclam must populate definitions or clamd won't start. Pull
# definitions now (we still have internet during imaging).
- name: Prime virus definitions (one-time, requires internet)
  ansible.builtin.command: freshclam
  register: freshclam_run
  changed_when: "'Downloading' in freshclam_run.stdout"
  failed_when: false        # don't fail the build if already up to date / locked
  when: clamav_run_daemon

- name: Exclude large immutable data from clamd (model weights, container volumes)
  # An untuned clamd walks /var/lib/docker/volumes, which on the AI nodes holds
  # ~60GB+ of model weights plus the databases: huge I/O, no detection value
  # (the weights are staged from controlled media and are not executable content).
  ansible.builtin.blockinfile:
    path: /etc/clamav/clamd.conf
    marker: "# {mark} ANSIBLE MANAGED -- scan exclusions"
    block: |
      {% for p in clamav_exclude_paths %}
      ExcludePath {{ p }}
      {% endfor %}
    create: false
  notify: restart clamav-daemon
  when: clamav_run_daemon

# clamav_container MASKS this unit on a box where the host engine cannot scan
# (FIPS -- clamav#1786) and the containerised one took over. Enabling a masked
# unit is a hard failure, which would abort the whole play on every subsequent
# pull, so check first.
- name: Is the host clamav-daemon masked (containerised engine in use)?
  ansible.builtin.command: systemctl is-enabled clamav-daemon
  register: _ac_clamd_enabled
  changed_when: false
  failed_when: false
  when: clamav_run_daemon

- name: Enable and start clamav-daemon
  ansible.builtin.systemd:
    name: clamav-daemon
    enabled: true
    state: started
  when:
    - clamav_run_daemon
    - "'masked' not in (_ac_clamd_enabled.stdout | default('') ~ _ac_clamd_enabled.stderr | default(''))"

- name: Host clamav-daemon is masked -- the containerised engine owns scanning
  ansible.builtin.debug:
    msg: >-
      clamav-daemon is masked, so clamav_container is running the scanning
      engine instead (the host engine cannot hash under FIPS -- clamav#1786).
      Confirm with `sudo it-clamav test`. To go back to the host daemon:
      set clamav_container_enabled false, then `systemctl unmask clamav-daemon`.
  when:
    - clamav_run_daemon
    - "'masked' in (_ac_clamd_enabled.stdout | default('') ~ _ac_clamd_enabled.stderr | default(''))"

# --- Scheduled full scan (weekly) -------------------------------------------
- name: Deploy weekly clamav scan timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/clamav-scan.service
    mode: "0644"
    content: |
      [Unit]
      Description=Weekly ClamAV full filesystem scan
      [Service]
      Type=oneshot
      # clamd-container.conf exists only where the host engine cannot scan
      # (FIPS -- clamav#1786); clamdscan --fdpass then routes to the
      # containerised engine. Falls back to host clamscan everywhere else.
      ExecStart=/bin/sh -c 'if [ -r /etc/clamav/clamd-container.conf ]; then \
        exec clamdscan -c /etc/clamav/clamd-container.conf --fdpass -i --recursive / \
          >>/var/log/clamav/weekly-scan.log 2>&1; \
        else \
        exec /usr/bin/clamscan -r -i / {{ clamav_scan_exclude_args }} --log=/var/log/clamav/weekly-scan.log; \
        fi'
  when: clamav_run_daemon

- name: Deploy weekly clamav scan timer unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/clamav-scan.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Run ClamAV full scan weekly
      [Timer]
      OnCalendar=weekly
      Persistent=true
      [Install]
      WantedBy=timers.target
  when: clamav_run_daemon

- name: Enable weekly scan timer
  ansible.builtin.systemd:
    name: clamav-scan.timer
    enabled: true
    state: started
    daemon_reload: true
  when: clamav_run_daemon
