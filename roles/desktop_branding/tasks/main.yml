---
# =============================================================================
# desktop_branding -- system-wide wallpaper (desktop + session lock screen)
# =============================================================================
# Deploys SHB_Background.jpg and sets it as the wallpaper for EVERY user via the
# dconf system database, LOCKED so users cannot change it. Runs on the GUI
# profiles -- development AND baseline (ai is headless, so local.yml skips it).
#
# Runs AFTER hardening (usg_harden + desktop_hardening). It is the SOLE owner of the screensaver (lock screen)
# picture-uri key: desktop_hardening/tasks/gnome.yml deliberately no longer sets that
# key, because showing a lock-screen wallpaper OVERRIDES the STIG "Implement
# Blank Screensaver" control (documented deviation -- see docs/reference.md). The
# desktop background key is not touched by STIG at all.
#
# WHICH image is deployed follows classification_banner_level: the SECRET-marked
# wallpaper is applied only on a box that has actually been taken to that level
# with `it-set-classification`. See the classification-aware block below.
#
# dconf mechanics: keyfile under /etc/dconf/db/local.d/ + a matching lock under
# .../locks/ + `dconf update` to compile the binary db (the existing handler).
# =============================================================================

# ---------------------------------------------------------------------------
# WHICH wallpaper. The classified image carries a SECRET marking, so it is
# applied ONLY when this box's classification_banner_level says it belongs
# there -- which is a DEPLOYMENT-time decision made with
# `it-set-classification SECRET`, not something baked into a gold image.
#
# Both images land at the SAME destination path, so exactly one wallpaper file
# exists and it always matches the current level: dropping back to UNCLASSIFIED
# overwrites the marked image on the next run instead of leaving it on disk.
#
# Gated on the file existing (same pattern as the account avatar below), so the
# build never fails when it has not been added to files/ yet.
# ---------------------------------------------------------------------------
- name: BRANDING | Is a classified-level wallpaper available?
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ branding_wallpaper_classified_src }}"
  register: _branding_classified_wp
  when: (branding_wallpaper_classified_src | default('')) | length > 0

- name: BRANDING | Does this box's classification level call for it?
  ansible.builtin.set_fact:
    _branding_level: "{{ classification_banner_level | default('UNCLASSIFIED') | upper }}"
    _branding_wants_classified: >-
      {{ (classification_banner_level | default('UNCLASSIFIED') | upper)
         in (branding_classified_levels | default([]) | map('upper') | list) }}

- name: BRANDING | Choose the wallpaper
  ansible.builtin.set_fact:
    _branding_wallpaper_src: >-
      {{ branding_wallpaper_classified_src
         if (_branding_wants_classified | bool and (_branding_classified_wp.stat.exists | default(false)))
         else branding_wallpaper_src }}

# Loud, because the failure mode is a classified box wearing an unclassified
# wallpaper and nobody noticing.
- name: BRANDING | Classified wallpaper wanted but not present in files/
  ansible.builtin.debug:
    msg: >-
      This box is at {{ _branding_level }}, which calls for
      {{ branding_wallpaper_classified_src }}, but that file is not in
      roles/desktop_branding/files/. Falling back to {{ branding_wallpaper_src }}
      -- the desktop will NOT carry a classification marking. Add the image to
      the repo, or set branding_wallpaper_classified_src to "" if that is
      deliberate.
  when:
    - _branding_wants_classified | bool
    - not (_branding_classified_wp.stat.exists | default(false))

- name: BRANDING | Install the system wallpaper ({{ _branding_wallpaper_src }} for {{ _branding_level }})
  ansible.builtin.copy:
    src: "{{ _branding_wallpaper_src }}"
    dest: "{{ branding_wallpaper_dest }}"
    owner: root
    group: root
    mode: "0644"

- name: BRANDING | Ensure dconf local + gdm db dirs (and their locks dirs) exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/dconf/db/local.d
    - /etc/dconf/db/local.d/locks
    - /etc/dconf/db/gdm.d

# ---------------------------------------------------------------------------
# CRITICAL: without /etc/dconf/profile/user listing `system-db:local`, dconf
# IGNORES everything under /etc/dconf/db/local.d/ for the user session -- so the
# wallpaper keyfile below (and the STIG GNOME settings) silently never apply.
# Stock Ubuntu does NOT ship this file. We ensure it idempotently and ADDITIVELY
# (only guaranteeing the two required lines; never removing other dbs). It is read
# at login, so it takes effect on the next session.
# ---------------------------------------------------------------------------
- name: BRANDING | Ensure the dconf USER profile pulls in the system db (or local.d is ignored)
  ansible.builtin.lineinfile:
    path: /etc/dconf/profile/user
    line: "{{ item }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - "user-db:user"      # user's own settings (write target, listed first)
    - "system-db:local"   # makes /etc/dconf/db/local.d/ effective for the session

# ---------------------------------------------------------------------------
# Desktop background (always) + session lock screen (when enabled).
# picture-options 'zoom' fills the screen preserving aspect ratio. The dark
# variant mirrors the light one so the wallpaper shows under the GNOME dark theme.
# ---------------------------------------------------------------------------
- name: BRANDING | Write system-wide wallpaper dconf keyfile (local db)
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/05-branding
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by desktop_branding -- do not edit by hand.
      [org/gnome/desktop/background]
      picture-uri='file://{{ branding_wallpaper_dest }}'
      picture-uri-dark='file://{{ branding_wallpaper_dest }}'
      picture-options='zoom'
      primary-color='#000000'
      {% if branding_lockscreen_wallpaper | bool %}

      # SESSION LOCK SCREEN. This intentionally OVERRIDES the STIG "Implement
      # Blank Screensaver" control (which wants picture-uri=''); gnome.yml no
      # longer manages this key. Tracked as an approved deviation in docs/reference.md.
      [org/gnome/desktop/screensaver]
      picture-uri='file://{{ branding_wallpaper_dest }}'
      picture-options='zoom'
      {% endif %}
  notify: dconf update

- name: BRANDING | Lock the wallpaper keys (system-wide; users cannot change them)
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/locks/05-branding
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by desktop_branding -- do not edit by hand.
      /org/gnome/desktop/background/picture-uri
      /org/gnome/desktop/background/picture-uri-dark
      /org/gnome/desktop/background/picture-options
      {% if branding_lockscreen_wallpaper | bool %}
      /org/gnome/desktop/screensaver/picture-uri
      /org/gnome/desktop/screensaver/picture-options
      {% endif %}
  notify: dconf update

# ---------------------------------------------------------------------------
# GDM LOGIN screen -- best effort. Ubuntu 24.04's GDM greeter renders a themed
# background and commonly IGNORES this dconf key; setting it is harmless and
# costs nothing, but a guaranteed login-screen JPG would require patching the
# gnome-shell gresource, which breaks on every shell update -- deliberately NOT
# done. See docs/reference.md.
# ---------------------------------------------------------------------------
- name: BRANDING | Best-effort GDM login-screen background (greeter may ignore it)
  ansible.builtin.copy:
    dest: /etc/dconf/db/gdm.d/06-branding
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by desktop_branding -- do not edit by hand. Best-effort only
      # (Ubuntu's GDM greeter may render its themed background instead).
      [org/gnome/desktop/background]
      picture-uri='file://{{ branding_wallpaper_dest }}'
      picture-options='zoom'
  notify: dconf update

# ---------------------------------------------------------------------------
# ACCOUNT AVATARS -- set every human local user's account picture (GDM greeter +
# Settings) to a shared image, and seed it for future accounts. GNOME reads the
# avatar from AccountsService: /var/lib/AccountsService/users/<user> holds an
# `Icon=` pointer, plus ~/.face as a fallback. Gated on the image existing in the
# role's files/, so the build never fails when it hasn't been added yet.
# ---------------------------------------------------------------------------
- name: BRANDING | Look for the account-avatar image in files/
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ branding_avatar_src }}"
  register: _branding_avatar
  when: (branding_avatar_src | default('')) | length > 0

- name: BRANDING | Apply the shared account avatar
  when: _branding_avatar.stat.exists | default(false)
  block:
    - name: BRANDING | Install the shared avatar image
      ansible.builtin.copy:
        src: "{{ branding_avatar_src }}"
        dest: "{{ branding_avatar_dest }}"
        owner: root
        group: root
        mode: "0644"

    - name: BRANDING | Seed the avatar for future accounts (/etc/skel/.face)
      ansible.builtin.copy:
        src: "{{ branding_avatar_src }}"
        dest: /etc/skel/.face
        owner: root
        group: root
        mode: "0644"

    - name: BRANDING | Enumerate human local users (uid 1000-65533 with a /home)
      ansible.builtin.shell: |
        set -o pipefail
        awk -F: '$3>=1000 && $3<65534 && $6 ~ /^\/home\// {print $1}' /etc/passwd
      args:
        executable: /bin/bash
      register: _human_users
      changed_when: false

    - name: BRANDING | Point AccountsService at the avatar for each user
      community.general.ini_file:
        path: "/var/lib/AccountsService/users/{{ item }}"
        section: User
        option: Icon
        value: "{{ branding_avatar_dest }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ _human_users.stdout_lines }}"

    - name: BRANDING | Drop ~/.face into each existing user's home (fallback)
      ansible.builtin.copy:
        src: "{{ branding_avatar_src }}"
        dest: "/home/{{ item }}/.face"
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: "0644"
      loop: "{{ _human_users.stdout_lines }}"
      failed_when: false
