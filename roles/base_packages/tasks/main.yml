---
# Baseline package install. Runs BEFORE hardening so that umask/mount
# restrictions don't interfere with package and pip operations.
#
# The concrete package set depends on the deployment profile (see local.yml):
#   development -> development.yml  (the full engineering-workstation app set:
#                  clamav, wireshark, putty, editor, VS Code, provisioning svcs)
#   ai          -> ai.yml           (a lean headless baseline; the AI stack and
#                  USG pull in almost everything else they need themselves)
# Common to ALL profiles (below): base_common_packages + PowerShell (PowerStrux).

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: "Full system package upgrade (opt-in; base_packages_full_upgrade)"
  # OFF by default. A full-upgrade can pull a newer kernel or library that
  # conflicts with the pinned NVIDIA driver / FIPS kernel and makes the image
  # non-reproducible, so patching is a deliberate choice. Flip
  # base_packages_full_upgrade: true (per box or fleet-wide) to patch the base
  # OS during the build. Runs BEFORE hardening + the AI/GPU installs, so those
  # land on an already-current base. NOTE (ai profile): this can bump the kernel
  # -- the box reboots for FIPS anyway on the first run; after any kernel change
  # re-check `nvidia-smi` and `/proc/sys/crypto/fips_enabled`. Ongoing security
  # patches otherwise come via Ubuntu Pro (ESM + canonical-livepatch).
  ansible.builtin.apt:
    upgrade: full
    update_cache: true
  when: base_packages_full_upgrade | default(false) | bool

- name: "Install common packages (all profiles)"
  # cifs-utils + smbclient (SMB) + net-tools + unzip. Wanted on every box
  # regardless of profile; edit base_common_packages in group_vars to change it.
  ansible.builtin.apt:
    name: "{{ base_common_packages | default([]) }}"
    state: present
  when: (base_common_packages | default([])) | length > 0

# --- Active Directory join prerequisites ------------------------------------
# development / ai / baseline. NOT the EMI laptop, which stays standalone.
#
# Only the packages that do NOT touch the PAM stack. sssd-ad and sssd-tools
# pull libpam-sss, whose postinst runs `pam-auth-update --package` and
# regenerates /etc/pam.d/common-auth -- on a box that is not joined to
# anything. `it-domain join` installs those at join time, behind a PAM backup
# and a verification step. See ad_prep_packages in group_vars.
- name: "Install Active Directory join prerequisites"
  ansible.builtin.apt:
    name: "{{ ad_prep_packages | default([]) }}"
    state: present
  when:
    - ad_prep_enabled | default(false) | bool
    - (ad_prep_packages | default([])) | length > 0

# --- PowerShell (LTS) -- ALL profiles ---------------------------------------
# Required by the PowerStrux auditing tool (relevant on every box, incl. the AI
# servers). Pinned .deb from the official GitHub release (no third-party apt
# repo). Installs /usr/bin/pwsh; not added to /etc/shells, so it is not a valid
# login shell. Set powershell_enabled: false to skip.
- name: Is PowerShell already installed?
  ansible.builtin.stat:
    path: /usr/bin/pwsh
  register: _pwsh

# AIR-GAPPED BOXES ABORT THE WHOLE PULL HERE.
#
# This is a github.com download in the middle of local.yml. A deployed box
# cannot reach it, get_url fails, the play stops, and EVERY role after this one
# never runs -- so a pull carrying an urgent fix dies on an optional audit
# dependency. That is what `it-pull` was failing on across the deployed fleet.
#
# Two guards: skip entirely when pwsh is already installed (which is the case on
# every box that was imaged with it), and never let the fetch itself be fatal.
- name: "Download pinned PowerShell {{ powershell_version }} .deb"
  ansible.builtin.get_url:
    url: "https://github.com/PowerShell/PowerShell/releases/download/v{{ powershell_version }}/powershell_{{ powershell_version }}-1.deb_amd64.deb"
    dest: "/tmp/powershell_{{ powershell_version }}.deb"
    mode: "0644"
    timeout: 20
  register: _pwsh_dl
  failed_when: false
  when:
    - powershell_enabled | default(true) | bool
    - not _pwsh.stat.exists

- name: "Install PowerShell from the .deb (apt resolves dependencies)"
  ansible.builtin.apt:
    deb: "/tmp/powershell_{{ powershell_version }}.deb"
    state: present
  when:
    - powershell_enabled | default(true) | bool
    - not _pwsh.stat.exists
    - _pwsh_dl is not skipped
    - not (_pwsh_dl.failed | default(false) | bool)

- name: PowerShell could not be fetched -- say so and carry on
  ansible.builtin.debug:
    msg: >-
      PowerShell {{ powershell_version }} could not be downloaded from GitHub,
      which is expected on an air-gapped box. PowerStrux cannot run without it.
      Carry the .deb in on media and install it with
      `sudo apt-get install ./powershell_{{ powershell_version }}-1.deb_amd64.deb`.
      The pull continues -- this is not fatal.
  when:
    - powershell_enabled | default(true) | bool
    - not _pwsh.stat.exists
    - _pwsh_dl is not skipped
    - _pwsh_dl.failed | default(false) | bool

- name: Install the DEVELOPMENT engineering-workstation package set
  # EMI reuses the same engineering app set (VS Code, PowerShell, wireshark,
  # TFTP/DHCP/dnsmasq, ...) plus dev_tools; its extras are added by emi.yml below.
  ansible.builtin.import_tasks: development.yml
  when: (is_development | default(true) | bool) or (is_emi | default(false) | bool)

- name: Install the AI-server baseline package set
  ansible.builtin.import_tasks: ai.yml
  when: is_ai | default(false) | bool

- name: Install the EMI profile extras (VPN, network recon, CJK input methods)
  ansible.builtin.import_tasks: emi.yml
  when: is_emi | default(false) | bool
