---
# code-server on a legacy VM: OPT-IN per VM (dev_code_server_enabled in
# /opt/it/site.yml), and nothing at all on a VM that never had it.
#
# These are the 24.04 fleet's own task files, not a copy, so a port claimed on
# a 22.04 VM works exactly as it does on 24.04 (first my-ide, kept for good in
# /etc/code-server/ports). They are written to run under 22.04's Ansible 2.10.
# The .deb has to be in the VM's jammy mirror -- Coder's package is the same
# for both releases, but the ADM media mirrors them separately.

# Has this baseline ever installed it here? Decides whether "off" has anything
# to remove: the removal deletes ~/.config/code-server, and an engineer's OWN
# code-server on one of these VMs is not ours to delete.
- name: "LEGACY | code-server -- ever installed by this baseline?"
  ansible.builtin.stat:
    path: /etc/code-server/settings
  register: _legacy_cs_ours

- name: "LEGACY | code-server (on)"
  ansible.builtin.import_tasks: "{{ playbook_dir }}/roles/dev_tools/tasks/code_server.yml"
  when: dev_code_server_enabled | default(false) | bool

# Extensions. The 24.04 boxes build /opt/vscode-extensions in dev_tools'
# vscode.yml, which never runs here, so a VM's code-server starts empty and,
# offline, cannot fetch any. A copy of a 24.04 box's store carried in on media
# (procedures 4.4e) is linked into code-server's folder ONLY -- ~/.vscode and
# ~/.vscode-server are not this profile's to manage (--code-server-only).
- name: "LEGACY | it-vscode (links the shared extension store)"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/dev_tools/files/vscode-extensions.sh"
    dest: /opt/it/scripts/vscode-extensions.sh
    owner: root
    group: "{{ ia_it_group }}"
    mode: "0750"
  when: dev_code_server_enabled | default(false) | bool
  tags: [scripts]

- name: "LEGACY | it-vscode command"
  ansible.builtin.file:
    src: /opt/it/scripts/vscode-extensions.sh
    dest: /usr/local/sbin/it-vscode
    state: link
    force: true
  when: dev_code_server_enabled | default(false) | bool
  tags: [scripts]

- name: "LEGACY | Is there a shared extension store?"
  ansible.builtin.stat:
    path: /opt/vscode-extensions
  register: _legacy_vsx
  when: dev_code_server_enabled | default(false) | bool

# Everyone with a claimed port and a config; a new claim links itself.
- name: "LEGACY | Link the store into each code-server user's extensions"
  ansible.builtin.shell: |
    [ -r /etc/code-server/ports ] || exit 0
    grep -vE '^[[:space:]]*(#|$)' /etc/code-server/ports | awk '{print $1}' |
      while read -r u; do
        h=$(getent passwd "$u" | cut -d: -f6) || continue
        [ -r "$h/.config/code-server/config.yaml" ] || continue
        /usr/local/sbin/it-vscode link "$u" --code-server-only --quiet
      done
    exit 0
  changed_when: false
  when:
    - dev_code_server_enabled | default(false) | bool
    - _legacy_vsx.stat.exists | default(false)

- name: "LEGACY | No shared extension store"
  ansible.builtin.debug:
    msg: >-
      code-server is on but /opt/vscode-extensions does not exist, so its
      extensions list is empty. Copy the store from a 24.04 box
      (procedures 4.4e, "code-server extensions"), then pull again.
  when:
    - dev_code_server_enabled | default(false) | bool
    - not (_legacy_vsx.stat.exists | default(false))

- name: "LEGACY | code-server (off: remove what this baseline placed)"
  ansible.builtin.import_tasks: "{{ playbook_dir }}/roles/dev_tools/tasks/code_server_retire.yml"
  when:
    - not (dev_code_server_enabled | default(false) | bool)
    - _legacy_cs_ours.stat.exists

# Here, unlike 24.04, it-vscode exists only for code-server, so it goes with it.
# The store and each user's links are left: ~/.local/share/code-server is theirs.
- name: "LEGACY | code-server off: remove it-vscode"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/sbin/it-vscode
    - /opt/it/scripts/vscode-extensions.sh
  when:
    - not (dev_code_server_enabled | default(false) | bool)
    - _legacy_cs_ours.stat.exists

# The ONE firewall change the legacy profile makes, and only for code-server:
# with ufw active and no rule, nobody could reach the IDE. A VM without ufw
# active is left exactly as it is.
- name: "LEGACY | code-server -- is ufw active?"
  ansible.builtin.command: ufw status
  register: _legacy_ufw
  changed_when: false
  failed_when: false
  check_mode: false
  when: (dev_code_server_enabled | default(false) | bool) or _legacy_cs_ours.stat.exists

- name: "LEGACY | code-server port range in ufw"
  ansible.builtin.import_tasks: "{{ playbook_dir }}/roles/dev_tools/tasks/code_server_firewall.yml"
  when:
    - (dev_code_server_enabled | default(false) | bool) or _legacy_cs_ours.stat.exists
    - "(_legacy_ufw.stdout | default('')) is search('Status: active')"
