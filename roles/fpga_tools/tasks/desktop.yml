---
# =============================================================================
# Launchers + app-grid entries for the vendor GUIs.
#
# WHY THESE EXIST. The vendors' installers create shortcuts only when the
# install config asks for them, and a `--batch Install` run under sudo writes
# them to /root/Desktop -- where no engineer will ever see them. So a correctly
# installed Vivado looks, from the desktop, exactly like a missing one.
#
# System-wide in /usr/share/applications: every user gets them, nothing is
# copied per account, and removing a toolchain removes its entry.
# =============================================================================

# Every Libero version that is actually installed, each in its own
# <root>/Libero_SoC_<version>. The binary is looked for, not assumed: Microchip
# moved it in 2025.1 (Libero/bin64 -> Libero_SoC/Designer/bin64) and a fixed
# path is how a working install came to look missing.
- name: "FPGA | Which Libero versions are installed?"
  ansible.builtin.shell: |
    for v in {{ fpga_libero_versions | map('quote') | join(' ') }}; do
      d={{ fpga_microchip_root | quote }}/"Libero_SoC_$v"
      [ -d "$d" ] || continue
      b=""
      for c in "$d/Libero_SoC/Designer/bin64/libero" "$d/Libero/bin64/libero"; do
        [ -f "$c" ] && { b="$c"; break; }
      done
      [ -n "$b" ] || b=$(find "$d" -maxdepth 6 -type f -path '*/bin64/libero' 2>/dev/null | head -1)
      [ -n "$b" ] && printf '%s\t%s\n' "$v" "$b"
    done
    exit 0
  register: _fpga_libero_found
  changed_when: false
  check_mode: false
  when: fpga_microchip_enabled | bool

- name: "FPGA | Installed Libero versions"
  ansible.builtin.set_fact:
    _fpga_liberos: []

- name: "FPGA | Installed Libero versions (one per line found)"
  ansible.builtin.set_fact:
    _fpga_liberos: >-
      {{ _fpga_liberos + [{'v': item.split()[0], 'bin': item.split()[1],
                           'dir': fpga_microchip_root ~ '/Libero_SoC_' ~ item.split()[0]}] }}
  loop: "{{ _fpga_libero_found.stdout_lines | default([]) }}"

# The installed trees, named once so both the launchers and the access pass
# work from the same list. One entry per Libero version.
- name: "FPGA | The toolchain trees"
  ansible.builtin.set_fact:
    _fpga_trees: >-
      {{
        ([{'name': 'Xilinx', 'path': fpga_xilinx_root,
           'probe': fpga_xilinx_root ~ '/Vivado/' ~ fpga_xilinx_version ~ '/settings64.sh'}]
         if fpga_xilinx_enabled | bool else [])
      }}

- name: "FPGA | The toolchain trees (each Libero version)"
  ansible.builtin.set_fact:
    _fpga_trees: "{{ _fpga_trees + [{'name': 'Libero ' ~ item.v, 'path': item.dir, 'probe': item.bin}] }}"
  loop: "{{ _fpga_liberos }}"
  loop_control:
    label: "{{ item.v }}"

- name: "FPGA | Who may use the toolchains"
  ansible.builtin.import_tasks: access.yml

- name: "FPGA | Is each toolchain actually installed?"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ fpga_xilinx_root }}/Vivado/{{ fpga_xilinx_version }}/bin/vivado"
    - "{{ fpga_xilinx_root }}/Vitis/{{ fpga_xilinx_version }}/bin/vitis"
  register: _fpga_bins
  loop_control:
    label: "{{ item }}"

- name: "FPGA | Build the launcher set from what is present"
  ansible.builtin.set_fact:
    _fpga_apps: >-
      {{
        [
          {
            'cmd': 'vivado', 'name': 'Vivado',
            'generic': 'FPGA Design Suite',
            'comment': 'AMD Vivado ' ~ fpga_xilinx_version ~ ' -- RTL design, synthesis and implementation',
            'root': fpga_xilinx_root,
            'bin': fpga_xilinx_root ~ '/Vivado/' ~ fpga_xilinx_version ~ '/bin/vivado',
            'settings': fpga_xilinx_root ~ '/Vivado/' ~ fpga_xilinx_version ~ '/settings64.sh',
            'icon': fpga_icon_vivado,
            'keywords': 'fpga;vivado;xilinx;amd;hdl;vhdl;verilog;synthesis;',
            'present': _fpga_bins.results[0].stat.exists | default(false),
          },
          {
            'cmd': 'vitis', 'name': 'Vitis',
            'generic': 'Embedded Software IDE',
            'comment': 'AMD Vitis ' ~ fpga_xilinx_version ~ ' -- embedded and accelerated application development',
            'root': fpga_xilinx_root,
            'bin': fpga_xilinx_root ~ '/Vitis/' ~ fpga_xilinx_version ~ '/bin/vitis',
            'settings': fpga_xilinx_root ~ '/Vitis/' ~ fpga_xilinx_version ~ '/settings64.sh',
            'icon': fpga_icon_vitis,
            'keywords': 'fpga;vitis;xilinx;amd;embedded;soc;',
            'present': _fpga_bins.results[1].stat.exists | default(false),
          },
        ]
      }}

# Libero: one launcher AND one tile per installed version (`libero-2025.1`,
# "Libero SoC 2025.1"), so two side by side are told apart. Plain `libero`
# is the default version (fpga_libero_version) and has no tile of its own --
# it would duplicate that version's.
- name: "FPGA | Libero: plain `libero` runs the default version"
  ansible.builtin.set_fact:
    _fpga_apps: >-
      {{ _fpga_apps + [{'cmd': 'libero', 'name': 'Libero SoC ' ~ fpga_libero_version,
           'root': fpga_microchip_root,
           'bin': ((_fpga_liberos | selectattr('v', 'equalto', fpga_libero_version) | map(attribute='bin') | list)
                   + [fpga_libero_bin]) | first,
           'ld_i386': true, 'tile': false,
           'present': (_fpga_liberos | selectattr('v', 'equalto', fpga_libero_version) | list | length) > 0}] }}
  when: fpga_microchip_enabled | bool

- name: "FPGA | Libero: a launcher and a tile per installed version"
  ansible.builtin.set_fact:
    _fpga_apps: >-
      {{ _fpga_apps + [{'cmd': 'libero-' ~ item.v, 'name': 'Libero SoC ' ~ item.v,
           'generic': 'FPGA Design Suite',
           'comment': 'Microchip Libero SoC ' ~ item.v ~ ' -- PolarFire / IGLOO design',
           'root': fpga_microchip_root, 'bin': item.bin, 'icon': fpga_icon_libero,
           'ld_i386': true,
           'keywords': 'fpga;libero;microchip;microsemi;polarfire;igloo;' ~ item.v ~ ';',
           'present': true}] }}
  loop: "{{ _fpga_liberos }}"
  loop_control:
    label: "{{ item.v }}"

- name: "FPGA | Launcher for each installed toolchain"
  ansible.builtin.template:
    src: fpga-launcher.j2
    dest: "/usr/local/bin/{{ item.cmd }}"
    # These are MODULE arguments and were sitting in `vars:` below, where the
    # template never used them -- so the mode was whatever root's umask was
    # during that pull. Interactive `sudo it-pull` under the STIG's umask 077
    # gives 0600; a timer-driven run gives 0644. Neither is executable, and the
    # app-grid tile is still there, so it looks like a broken tile rather than
    # a launcher nobody can run.
    owner: root
    group: root
    mode: "0755"
  vars:
    access_group: "{{ fpga_tools_access_group }}"
    compat_dir: "{{ fpga_libero_compat_dir }}"
  loop: "{{ _fpga_apps | selectattr('present') | list }}"
  loop_control:
    label: "{{ item.cmd }}"

- name: "FPGA | App-grid entry for each installed toolchain"
  ansible.builtin.template:
    src: fpga-desktop.j2
    dest: "/usr/share/applications/fpga-{{ item.cmd }}.desktop"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _fpga_apps | selectattr('present') | rejectattr('tile', 'defined') | list }}"
  loop_control:
    label: "{{ item.cmd }}"
  when: fpga_desktop_entries | default(true) | bool
  register: _fpga_desktop

# copy/template only ever CREATE (reference.md trap 3). A toolchain that was
# uninstalled, or entries switched off, must have its launcher and tile taken
# away -- otherwise the app grid keeps offering something that is not there.
- name: "FPGA | Remove entries for toolchains that are absent"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ _fpga_apps
       | rejectattr('present')
       | map(attribute='cmd')
       | map('regex_replace', '^(.*)$', '/usr/share/applications/fpga-\1.desktop')
       | list
       +
       _fpga_apps
       | rejectattr('present')
       | map(attribute='cmd')
       | map('regex_replace', '^(.*)$', '/usr/local/bin/\1')
       | list }}
  register: _fpga_desktop_gone

# A Libero version that was uninstalled, or dropped from fpga_libero_versions,
# leaves a libero-<version> launcher and tile nothing above knows to remove;
# and the single "Libero SoC" tile of the one-version layout is now per version.
- name: "FPGA | Libero launchers and tiles on disk"
  ansible.builtin.find:
    paths: [/usr/local/bin, /usr/share/applications]
    patterns: ["libero-*", "fpga-libero-*.desktop", "fpga-libero.desktop"]
  register: _fpga_libero_ondisk

- name: "FPGA | Remove Libero launchers and tiles for versions not installed"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ _fpga_libero_ondisk.files | map(attribute='path')
       | reject('in', (_fpga_liberos | map(attribute='v')
                       | map('regex_replace', '^(.*)$', '/usr/local/bin/libero-\1') | list)
                    + (_fpga_liberos | map(attribute='v')
                       | map('regex_replace', '^(.*)$', '/usr/share/applications/fpga-libero-\1.desktop') | list))
       | list }}
  register: _fpga_libero_gone

- name: "FPGA | Remove every app-grid entry when they are switched off"
  ansible.builtin.file:
    path: "/usr/share/applications/fpga-{{ item.cmd }}.desktop"
    state: absent
  loop: "{{ _fpga_apps | rejectattr('tile', 'defined') | list }}"
  loop_control:
    label: "{{ item.cmd }}"
  when: not (fpga_desktop_entries | default(true) | bool)
  register: _fpga_desktop_off

# GNOME reads the desktop DATABASE, not the directory. Without this the tile
# can stay missing until the next reboot -- which is exactly what happened when
# the powerstrux launcher first shipped.
- name: "FPGA | Refresh the desktop database"
  ansible.builtin.command: update-desktop-database /usr/share/applications
  changed_when: false
  failed_when: false
  when: >-
    (_fpga_desktop is defined and _fpga_desktop is changed)
    or (_fpga_desktop_gone is defined and _fpga_desktop_gone is changed)
    or (_fpga_desktop_off is defined and _fpga_desktop_off is changed)
    or (_fpga_libero_gone is defined and _fpga_libero_gone is changed)

- name: "FPGA | Nothing installed yet"
  ansible.builtin.debug:
    msg: >-
      No vendor toolchain found under {{ fpga_xilinx_root }} or
      {{ fpga_microchip_root }}, so no launchers or app-grid entries were
      created. They appear on the next pull once an installer has run --
      the scaffolding does not install the toolchains themselves.
  when: (_fpga_apps | selectattr('present') | list | length) == 0
