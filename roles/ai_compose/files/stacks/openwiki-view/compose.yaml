# System 2 -- OpenWiki viewer: browse a generated wiki at http://<dev-ai2>:4321.
# `openwiki visualize` binds 127.0.0.1 only, so the nginx sidecar shares its
# network namespace to expose it and swaps the viewer's CDN scripts for copies
# vendored in its image (renders air-gapped). Generate with the `openwiki` stack.
name: openwiki-view
networks:
  oi: { external: true }
volumes:
  openwiki-out: { external: true }
services:
  openwiki-view:
    image: openwiki:latest
    container_name: openwiki-view
    working_dir: /work
    # mkdir: visualize exits if ./openwiki is missing (empty viewer, not a crash-loop).
    command: ["sh", "-c", "mkdir -p openwiki && exec openwiki visualize --no-open --port 4321"]
    volumes:
      - openwiki-out:/work
    ports:
      - "4321:8080"      # only the netns owner can publish; the proxy listens on 8080
    networks: [oi]
    restart: unless-stopped

  openwiki-view-proxy:
    image: openwiki-view:latest
    container_name: openwiki-view-proxy
    network_mode: "service:openwiki-view"
    depends_on: [openwiki-view]
    restart: unless-stopped
