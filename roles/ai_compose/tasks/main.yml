---
# =============================================================================
# ai_compose -- stage the AI stack for the node's role. The stack is split into
# one directory PER SERVICE under dockge_stacks_dir (/opt/stacks/<stack>/), so
# each is a first-class, individually-manageable Dockge stack. Every stack on a
# node shares ONE external Docker network (`oi`) and the external named volumes,
# so services resolve each other by name across stacks (pgvector, redis,
# chat-llm, ...).
#
# It: creates the shared `oi` network; places each stack's compose.yaml + the
# per-stack assets it bind-mounts (fips_off, grafana/, .oikb.yaml) + a root-only
# .env (auto-generated DB + WebUI secrets); builds the custom images the stack
# needs (oikb/hfcli/repomix/mlflow/openwiki, not on any registry); creates the
# external named volumes; keeps the OLD single-file compose as a dormant fallback
# (docker-compose.consolidated.yaml under ai_compose_dir); and OPTIONALLY fetches
# models + brings the stacks up.
#
# Gated is_ai + ai_compose_enabled in local.yml. The node's role (system1 |
# system2) is auto-derived from the hostname (see group_vars).
#
# HOST-PREP-FRIENDLY: by default it PLACES files + builds images + creates the
# (empty) volumes, but does NOT `up` (ai_compose_deploy=false), because System
# 1's vLLM volume must be populated with the model first (see docs/operate.md).
# Flip ai_compose_deploy=true once the model is staged to have Ansible run them.
# =============================================================================

- name: "AI-COMPOSE | Validate ai_node_role (auto-derived from hostname)"
  ansible.builtin.assert:
    that:
      - ai_node_role in ['system1', 'system2']
    fail_msg: >-
      Could not auto-select an AI node role for hostname '{{ ansible_hostname }}'
      (got '{{ ai_node_role | default("") | trim }}'). Name the box dev-ai1/dev-ai2,
      add it to ai_node_role_by_hostname, or set ai_node_role: system1|system2 in
      this node's /etc/stig-build/site.yml.
    quiet: true

- name: "AI-COMPOSE | Create the shared external Docker network ({{ ai_stack_network }})"
  # Every per-service stack joins this ONE external network instead of each
  # compose project spinning up its own, so cross-stack name resolution works
  # (Open WebUI -> chat-llm/pgvector/redis; oikb -> dev-ai1). Idempotent.
  ansible.builtin.command: "docker network create {{ ai_stack_network }}"
  register: _net
  changed_when: "'already exists' not in (_net.stderr | default(''))"
  failed_when:
    - _net.rc != 0
    - "'already exists' not in (_net.stderr | default(''))"

- name: "AI-COMPOSE | Ensure the Dockge stacks dir exists ({{ dockge_stacks_dir }})"
  ansible.builtin.file:
    path: "{{ dockge_stacks_dir }}"
    state: directory
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "2750"          # admins (sudo group) can read/manage; others denied

- name: "AI-COMPOSE | Create each stack's directory (/opt/stacks/<stack>)"
  ansible.builtin.file:
    path: "{{ dockge_stacks_dir }}/{{ item }}"
    state: directory
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "2750"
  loop: "{{ ai_stacks_by_role[ai_node_role] | default([]) }}"
  loop_control:
    label: "{{ item }}"

- name: "AI-COMPOSE | Place each stack's compose.yaml"
  ansible.builtin.copy:
    src: "stacks/{{ item }}/compose.yaml"
    dest: "{{ dockge_stacks_dir }}/{{ item }}/compose.yaml"
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "0640"
  loop: "{{ ai_stacks_by_role[ai_node_role] | default([]) }}"
  loop_control:
    label: "{{ item }}"

- name: "AI-COMPOSE | Resolve the peer node via /etc/hosts (only when its addr is an IP)"
  # Hands-off cross-node name resolution: if this node's peer address is an IP (set
  # in site.yml as ai_system2_addr / ai_system1_addr), map the peer's canonical
  # hostname -> that IP in the HOST's /etc/hosts, so admin tooling on the box resolves
  # it with no DNS. (Containers get the same mapping via extra_hosts from .env; the
  # host file does not reach into containers.) Skipped when the addr is already a name.
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^[0-9.]+[[:space:]]+{{ _ai_peer_host }}[[:space:]]*$'
    line: "{{ _ai_peer_addr }} {{ _ai_peer_host }}"
    state: present
  vars:
    _ai_peer_host: "{{ 'dev-ai2' if ai_node_role == 'system1' else 'dev-ai1' }}"
    _ai_peer_addr: "{{ ai_system2_addr if ai_node_role == 'system1' else ai_system1_addr }}"
  when:
    - ai_hosts_manage | default(true) | bool
    - (_ai_peer_addr | default('')) | length > 0
    - (_ai_peer_addr | string)[0] in '0123456789'

- name: "AI-COMPOSE | Stat the per-stack fips_off paths (detect a stray dir from an aborted docker mount)"
  # Docker auto-creates a bind-mount SOURCE as a directory when the path doesn't
  # exist yet. If someone ran `docker run -v /opt/stacks/<stack>/fips_off:...`
  # before this stack dir existed, a stray fips_off/ DIRECTORY is left behind and
  # the copy below fails ("can not use content with a dir as dest"). Detect + clear.
  ansible.builtin.stat:
    path: "{{ dockge_stacks_dir }}/{{ item }}/fips_off"
  register: _fips_off_stat
  loop: "{{ ai_stacks_need_fips[ai_node_role] | default([]) }}"
  loop_control:
    label: "{{ item }}"

- name: "AI-COMPOSE | Remove any stray fips_off DIRECTORY (should be a file)"
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  loop: "{{ _fips_off_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists and item.stat.isdir

- name: "AI-COMPOSE | Drop the non-FIPS override file into each stack that mounts it"
  # The host runs FIPS (kernel fips_enabled=1), but the vLLM / OpenCV-bearing
  # images ship no FIPS OpenSSL provider, so their DRBG can't init and they
  # crash-loop (fips.so not found / FATAL FIPS SELFTEST). Those services aren't
  # FIPS-validated anyway, so they bind-mount THIS file (content "0") over
  # /proc/sys/crypto/fips_enabled and use standard crypto. The HOST stays FIPS.
  # Placed into each such stack's dir (the mount is relative: ./fips_off).
  ansible.builtin.copy:
    content: "0\n"
    dest: "{{ dockge_stacks_dir }}/{{ item }}/fips_off"
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "0644"
  loop: "{{ ai_stacks_need_fips[ai_node_role] | default([]) }}"
  loop_control:
    label: "{{ item }}"

- name: "AI-COMPOSE | Place the pre-provisioned Grafana dashboards (grafana-otel stack)"
  # LGTM bind-mounts ./grafana/*; the files must exist before `up`. Auto-loaded
  # by Grafana at startup (Open WebUI OTel dashboard). System 2 only.
  ansible.builtin.copy:
    src: "grafana/"
    dest: "{{ dockge_stacks_dir }}/grafana-otel/grafana/"
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "0644"
    directory_mode: "0750"
  when: ai_node_role == 'system2'

- name: "AI-COMPOSE | Place the chat-model switch script (System 1)"
  # System 1 alternates gpt-oss-120b <-> Granite-4.1-30b, now two separate stacks
  # (vllm-gptoss / vllm-granite); the script stops one stack and brings up the other.
  ansible.builtin.copy:
    src: switch-model.sh
    dest: "{{ dockge_stacks_dir }}/switch-model.sh"
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "0750"
  when: ai_node_role == 'system1'

# ---- Custom images (not on a registry) -> built on the box ----------------
- name: "AI-COMPOSE | Copy custom-image build contexts"
  ansible.builtin.copy:
    src: "images/{{ item }}/"
    dest: "{{ ai_compose_dir }}/build/{{ item }}/"
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "0640"
    directory_mode: "0750"
  loop: "{{ ai_compose_build_by_role[ai_node_role] | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: ai_compose_build_images | default(true) | bool

- name: "AI-COMPOSE | Check which custom images already exist"
  ansible.builtin.command: "docker image inspect {{ ai_compose_images[item].tag }}"
  register: _img_check
  changed_when: false
  failed_when: false
  loop: "{{ ai_compose_build_by_role[ai_node_role] | default([]) }}"
  loop_control:
    label: "{{ ai_compose_images[item].tag }}"
  when: ai_compose_build_images | default(true) | bool

- name: "AI-COMPOSE | Build custom images (missing, or force)"
  # oikb's Dockerfile git-clones from github.com at build time -> needs internet.
  ansible.builtin.command:
    cmd: >-
      docker build -t {{ ai_compose_images[item.0].tag }}
      -f {{ ai_compose_dir }}/build/{{ item.0 }}/{{ ai_compose_images[item.0].dockerfile }}
      {{ ai_compose_dir }}/build/{{ item.0 }}
  register: _img_build
  changed_when: true
  loop: "{{ (ai_compose_build_by_role[ai_node_role] | default([])) | zip(_img_check.results | default([])) | list }}"
  loop_control:
    label: "{{ ai_compose_images[item.0].tag }}"
  when:
    - ai_compose_build_images | default(true) | bool
    - (ai_compose_build_force | default(false) | bool) or ((item.1.rc | default(1)) != 0)

- name: "AI-COMPOSE | Lock down the secrets dir (holds the auto-generated DB passwords)"
  # The pgvector password (System 1) and MLflow DB password (System 2) are auto-
  # generated + persisted here on first render of .env; 0700 root keeps them
  # root-only regardless of the lookup's file perms. Both live in the same dir.
  ansible.builtin.file:
    path: "{{ ai_pgvector_password_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: "AI-COMPOSE | Render the root-only .env into each stack dir (secrets/site values)"
  # docker compose auto-loads the `.env` next to the compose file, so every stack
  # on the node gets the SAME node-aware .env (env.j2): System 1 stacks get the
  # DB/WebUI secrets + SYSTEM2_ADDR; System 2 stacks get MLflow + oikb's cross-node
  # URL/secrets. Unused vars in a given stack are harmless. Rendering evaluates the
  # password lookups (generate + persist on first run, stable after).
  ansible.builtin.template:
    src: env.j2
    dest: "{{ dockge_stacks_dir }}/{{ item }}/.env"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ ai_stacks_by_role[ai_node_role] | default([]) }}"
  loop_control:
    label: "{{ item }}"
  no_log: true

- name: "AI-COMPOSE | Render the oikb config skeleton (oikb stack; not overwritten on re-run)"
  # oikb (System 2) bind-mounts ./.oikb.yaml, so the file must exist before `up`
  # (else Docker creates a directory there). force:false keeps your edits.
  ansible.builtin.template:
    src: oikb.yaml.j2
    dest: "{{ dockge_stacks_dir }}/oikb/.oikb.yaml"
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "0640"
    force: false
  when: ai_node_role == 'system2'

- name: "AI-COMPOSE | Create the external named volumes (empty; populate the model separately)"
  ansible.builtin.command: "docker volume create {{ item }}"
  register: _vol
  changed_when: "'already exists' not in (_vol.stderr | default(''))"
  failed_when:
    - _vol.rc != 0
    - "'already exists' not in (_vol.stderr | default(''))"
  loop: "{{ ai_compose_volumes[ai_node_role] | default([]) }}"
  loop_control:
    label: "{{ item }}"

# ---- Dormant fallback: keep the old single-file compose on the box ----------
- name: "AI-COMPOSE | Ensure the fallback dir exists ({{ ai_compose_dir }})"
  ansible.builtin.file:
    path: "{{ ai_compose_dir }}"
    state: directory
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "2750"

- name: "AI-COMPOSE | Stage the consolidated compose as a dormant fallback"
  # The pre-split single-file compose, kept for break-glass use (one `docker
  # compose up -d` brings the whole node up in one project). NOT deployed and NOT
  # named docker-compose.yaml, so Dockge/it-ai/the recreate loop never pick it up.
  # It shares the same external volumes, so switching to it needs no data move.
  # Uses ./fips_off + ./grafana + ./switch-model.sh from this dir (staged below).
  ansible.builtin.copy:
    src: "{{ ai_node_role }}-compose.yaml"
    dest: "{{ ai_compose_dir }}/docker-compose.consolidated.yaml"
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "0640"

- name: "AI-COMPOSE | Fallback assets: fips_off (both roles)"
  ansible.builtin.copy:
    content: "0\n"
    dest: "{{ ai_compose_dir }}/fips_off"
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "0644"

- name: "AI-COMPOSE | Fallback assets: grafana/ (System 2)"
  ansible.builtin.copy:
    src: "grafana/"
    dest: "{{ ai_compose_dir }}/grafana/"
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "0644"
    directory_mode: "0750"
  when: ai_node_role == 'system2'

- name: "AI-COMPOSE | Fallback assets: root-only .env (System 1 + System 2)"
  ansible.builtin.template:
    src: env.j2
    dest: "{{ ai_compose_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: "AI-COMPOSE | Fallback assets: oikb config skeleton (System 2)"
  ansible.builtin.template:
    src: oikb.yaml.j2
    dest: "{{ ai_compose_dir }}/.oikb.yaml"
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "0640"
    force: false
  when: ai_node_role == 'system2'

# ---- Optional model fetch (both the split stacks + the fallback use these) ---
- name: "AI-COMPOSE | Fetch models into their volumes (opt-in; needs internet + disk)"
  # Downloads each repo into its volume via the vLLM image's `hf` CLI.
  # COMPLETENESS-CHECKED, not just "config.json exists": a download interrupted
  # partway (e.g. 13 of 14 shards) leaves config.json in place, so the old
  # `test -f config.json && SKIP` treated a PARTIAL model as done and never
  # re-pulled the missing shard -> vLLM loaded broken weights and generated
  # repeating-token garbage (older vLLM) / refused to start (newer vLLM). Now we
  # verify every shard named in model.safetensors.index.json is present and
  # non-empty (or, for single-file repos, model.safetensors), and only then SKIP;
  # otherwise we (re-)run `hf download`, which resumes and fills just the missing
  # files. no_log because the HF token (if any) is on the command line. The
  # fips_off mount is required -- on a FIPS host this image's OpenSSL can't do TLS.
  # Single line (folded scalar): shell stmts are ';'-separated so folding is safe.
  ansible.builtin.command:
    cmd: >-
      docker run --rm
      {{ ('-e HF_TOKEN=' ~ ai_hf_token) if (ai_hf_token | default('') | length > 0) else '' }}
      -v {{ item.volume }}:/model
      -v {{ ai_compose_dir }}/fips_off:/proc/sys/crypto/fips_enabled:ro
      --entrypoint sh
      {{ ai_vllm_image }}
      -c 'ok=0; idx=/model/model.safetensors.index.json; if [ -f /model/config.json ]; then if [ -f $idx ]; then ok=1; for f in $(grep -o [A-Za-z0-9_.-]*\.safetensors $idx | sort -u); do [ -s /model/$f ] || ok=0; done; elif [ -s /model/model.safetensors ]; then ok=1; fi; fi; if [ $ok -eq 1 ]; then echo SKIP; else hf download {{ item.repo }} --local-dir /model && echo FETCHED; fi'
  register: _fetch
  changed_when: "'FETCHED' in (_fetch.stdout | default(''))"
  no_log: true
  loop: "{{ ai_models[ai_node_role] | default([]) }}"
  loop_control:
    label: "{{ item.repo }} -> {{ item.volume }}"
  when: ai_model_fetch | default(false) | bool

- name: "AI-COMPOSE | Fetch the tiktoken/harmony encodings into the `encodings` volume"
  # gpt-oss's harmony tokenizer reads these from the `encodings` volume; without
  # them vLLM loads the model fine but crashes building the tokenizer ("invalid
  # tiktoken vocab file: No such file or directory"). Idempotent (skips files
  # already present). The fips_off mount is REQUIRED: on the FIPS host this
  # image's OpenSSL fails to init TLS (ssl.SSLError [CRYPTO]) without it.
  ansible.builtin.command:
    cmd: >-
      docker run --rm
      -v encodings:/etc/encodings
      -v {{ ai_compose_dir }}/fips_off:/proc/sys/crypto/fips_enabled:ro
      --entrypoint python3
      {{ ai_vllm_image }}
      -c "{{ _enc_py }}"
  vars:
    # One physical line: the YAML folded scalar (>-) turns newlines into spaces,
    # so any indented continuation would reach python3 as an indented line and
    # raise IndentationError. Keep this a single statement joined by ';'.
    _enc_py: >-
      import urllib.request, os; base='{{ ai_encodings_base_url }}'; todo=[f for f in {{ ai_encodings_files }} if not os.path.exists('/etc/encodings/'+f)]; [urllib.request.urlretrieve(base+'/'+f, '/etc/encodings/'+f) for f in todo]; print('FETCHED' if todo else 'SKIP')
  register: _enc_fetch
  changed_when: "'FETCHED' in (_enc_fetch.stdout | default(''))"
  when:
    - ai_model_fetch | default(false) | bool
    - "'encodings' in (ai_compose_volumes[ai_node_role] | default([]))"

- name: "AI-COMPOSE | Pre-stage the docling VLM (granite-docling) into the artifacts volume (System 2, opt-in)"
  # This docling image runs with --artifacts-path (runtime model downloads
  # DISABLED) and resolves models from /opt/app-root/src/.cache/docling/models in
  # docling's own layout (ibm-granite--granite-docling-258M), NOT an HF cache. So
  # we add it with docling's own tool. Mounting the (empty) docling-models volume
  # at that path seeds it with the image's baked-in models first (Docker volume
  # seeding); `docling-tools models download-hf-repo` then adds granite-docling.
  # Idempotent: docling-tools skips a repo already present. fips_off is required
  # (the image's OpenCV OpenSSL abort()s on the FIPS host without it).
  ansible.builtin.command:
    cmd: >-
      docker run --rm
      {{ ('-e HF_TOKEN=' ~ ai_hf_token) if (ai_hf_token | default('') | length > 0) else '' }}
      -v {{ ai_docling_models_volume }}:/opt/app-root/src/.cache/docling/models
      -v {{ ai_compose_dir }}/fips_off:/proc/sys/crypto/fips_enabled:ro
      --entrypoint docling-tools
      {{ ai_docling_image }}
      models download-hf-repo {{ ai_docling_vlm_repo }}
  register: _docling_vlm_fetch
  changed_when: "'download' in (_docling_vlm_fetch.stdout | default('') | lower) or 'download' in (_docling_vlm_fetch.stderr | default('') | lower)"
  # Best-effort: a hiccup adding the VLM must NOT fail the whole build. docling
  # still serves (its baked-in models seed the volume on first `up`); the VLM
  # pipeline just needs granite-docling, which can be added by hand afterwards.
  failed_when: false
  no_log: true
  when:
    - ai_node_role == 'system2'
    - ai_model_fetch | default(false) | bool

- name: "AI-COMPOSE | Note if the docling VLM pre-stage did not succeed (non-fatal)"
  ansible.builtin.debug:
    msg: >-
      granite-docling pre-stage exit={{ _docling_vlm_fetch.rc | default('n/a') }}.
      If non-zero, add it once the docling stack is up (surfaces the real error):
      sudo docker run --rm -v {{ ai_docling_models_volume }}:/opt/app-root/src/.cache/docling/models
      -v {{ ai_compose_dir }}/fips_off:/proc/sys/crypto/fips_enabled:ro --entrypoint docling-tools
      {{ ai_docling_image }} models download-hf-repo {{ ai_docling_vlm_repo }}
  when:
    - ai_node_role == 'system2'
    - ai_model_fetch | default(false) | bool
    - (_docling_vlm_fetch.rc | default(0)) != 0

- name: "AI-COMPOSE | Deploy all stacks (opt-in; needs the model staged + internet for pull)"
  when: ai_compose_deploy | default(false) | bool
  block:
    - name: "AI-COMPOSE | Retire the pre-split consolidated project before deploying the per-service stacks"
      # The pre-split stack ran as ONE compose project (ai-system1 / ai-system2).
      # Its containers use the SAME explicit container_names + host ports as the
      # new per-service stacks, so `up` collides ("name already in use") until the
      # old project is torn down. Idempotent no-op once it's gone. Keeps volumes.
      ansible.builtin.command:
        cmd: "docker compose -p ai-{{ ai_node_role }} down --remove-orphans"
      register: _retire_old
      changed_when: "'Removing' in (_retire_old.stderr | default('')) or 'Stopping' in (_retire_old.stderr | default(''))"
      failed_when: false

    - name: "AI-COMPOSE | docker compose pull + up -d per stack"
      # Each per-service stack is its own compose project. `pull
      # --ignore-pull-failures` tolerates the local-only custom images (oikb/
      # hfcli/openwiki/mlflow, built on the box). A plain `up -d` respects each
      # stack's profiles, so the alternate/opt-in/on-demand services (granite,
      # oikb, tools) stay down unless their .env opts them in. Converges each stack.
      ansible.builtin.shell:
        cmd: >-
          docker compose pull --ignore-pull-failures;
          docker compose up -d --remove-orphans
        chdir: "{{ dockge_stacks_dir }}/{{ item }}"
      register: _compose_up
      changed_when: "'Started' in (_compose_up.stderr | default('')) or 'Created' in (_compose_up.stderr | default('')) or 'Recreated' in (_compose_up.stderr | default(''))"
      # A stack whose services are ALL behind a profile (vllm-granite, oikb when
      # no key, hfcli/openwiki) has nothing to start on a plain `up` -> compose
      # exits non-zero with "no service selected". That's expected, not an error.
      failed_when:
        - _compose_up.rc != 0
        - "'no service selected' not in (_compose_up.stderr | default(''))"
      loop: "{{ ai_stacks_by_role[ai_node_role] | default([]) }}"
      loop_control:
        label: "{{ item }}"

- name: "AI-COMPOSE | Where the stacks live"
  ansible.builtin.debug:
    msg: >-
      {{ ai_node_role }} split into {{ (ai_stacks_by_role[ai_node_role] | default([])) | length }}
      per-service stacks under {{ dockge_stacks_dir }}/<stack>/ (managed in Dockge).
      Consolidated fallback at {{ ai_compose_dir }}/docker-compose.consolidated.yaml.
      {{ 'Deployed (docker compose up -d per stack).' if (ai_compose_deploy | default(false) | bool)
         else ('NOT deployed. ' ~ ('Populate the model into the `vllm` volume first, then ' if ai_node_role == 'system1' else '')
               ~ 'bring them all up with `it-ai up` (or set ai_compose_deploy=true).') }}
