---
# =============================================================================
# fpga_tools -- the scaffolding around Vivado/Vitis and Libero SoC.
#
# The tool trees themselves are NOT installed or managed here. See defaults for
# why. Everything below is idempotent, survives a reimage, and is the part that
# is easy to get wrong by hand on twelve workstations.
# =============================================================================

- name: "FPGA | Not a development box -- nothing to do"
  ansible.builtin.debug:
    msg: >-
      fpga_tools is development-profile only (i386 multiarch is an approved
      deviation there and nowhere else). Profile is
      {{ deployment_profile | default('unknown') }}.
  when: not (fpga_tools_enabled | bool)

- name: "FPGA | FPGA toolchain support"
  when: fpga_tools_enabled | bool
  block:

    # ---- i386 multiarch ---------------------------------------------------
    # An approved deviation, documented in compliance.md. Vivado's cable
    # drivers and parts of Libero/Synplify are 32-bit and there is no
    # alternative build. Recorded rather than assumed.
    - name: "FPGA | Which architectures does dpkg know about?"
      ansible.builtin.command: dpkg --print-foreign-architectures
      register: _fpga_arches
      changed_when: false
      check_mode: false          # a read-only probe; check mode would skip it
                                 # and the task below would act on no answer
      tags: [packages]

    - name: "FPGA | Enable i386 multiarch (32-bit vendor components)"
      ansible.builtin.command: dpkg --add-architecture i386
      when: "'i386' not in _fpga_arches.stdout_lines"
      register: _fpga_arch_added
      tags: [packages]

    - name: "FPGA | Refresh apt after adding i386"
      ansible.builtin.apt:
        update_cache: true
      when: _fpga_arch_added is changed
      tags: [packages]

    # ---- packages ---------------------------------------------------------
    # The 64-bit half is STRICT: a missing name here is a real error and the
    # pull should stop on it.
    - name: "FPGA | Vendor dependencies, 64-bit"
      ansible.builtin.apt:
        name: "{{ (fpga_packages_common
                   + (fpga_packages_xilinx if fpga_xilinx_enabled | bool else [])
                   + (fpga_packages_microchip if fpga_microchip_enabled | bool else [])) | unique }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: [packages]

    # The 32-bit half is BEST-EFFORT, and separate, for a reason that cost a
    # pull on dev-14: Ubuntu stopped publishing a full i386 archive after 19.10
    # and 24.04 ships only a CURATED SUBSET. Several libraries the vendors'
    # guides list are simply not built for i386 on noble --
    #   libgtk2.0-0t64:i386 -> libcups2t64:i386 -> libgnutls30t64:i386 (absent)
    #   ...                 -> libsystemd0:i386  -> libgcrypt20:i386   (absent)
    # and ONE uninstallable name fails the WHOLE apt transaction, which took
    # the 64-bit half down with it and stopped the pull at this task.
    #
    # So: ask apt what it can actually install, install that, and say plainly
    # what is missing. Skipping quietly would be worse -- Libero would fail
    # later with a confusing error instead of here with a clear one.
    # `apt-get --simulate`, NOT `apt-cache policy`. Policy answers "does this
    # NAME have a candidate", which is not the question -- libgtk2.0-0t64:i386
    # has one and still cannot be installed, because its dependency closure
    # reaches libgnutls30t64:i386 and libgcrypt20:i386, which noble does not
    # satisfy for i386. That distinction is the difference between apt saying
    # "not installable" and "not going to be installed", and a policy probe
    # cannot see it. Simulate resolves the whole tree and does no dpkg work.
    - name: "FPGA | Which i386 packages can apt actually resolve?"
      ansible.builtin.shell: |
        for p in {{ fpga_packages_i386 | join(' ') }}; do
          apt-get -s -q install -y "$p" >/dev/null 2>&1 && echo "$p"
        done
        exit 0
      register: _fpga_i386_have
      changed_when: false
      check_mode: false          # a read-only probe; in check mode the task
                                 # below would otherwise act on no answer
      tags: [packages]

    - name: "FPGA | Vendor dependencies, 32-bit (what this release publishes)"
      ansible.builtin.apt:
        name: "{{ _fpga_i386_have.stdout_lines }}"
        state: present
      when: (_fpga_i386_have.stdout_lines | default([]) | length) > 0
      tags: [packages]

    - name: "FPGA | 32-bit libraries apt cannot install on this release"
      ansible.builtin.debug:
        msg: >-
          apt cannot resolve these for i386 on 24.04 -- either the package is
          not published (the i386 archive has been a curated subset since
          19.10) or its dependencies are not, so they were skipped rather than
          failing the pull:
          {{ fpga_packages_i386 | difference(_fpga_i386_have.stdout_lines | default([])) | join(', ') }}.
          A vendor component that needs one of them will not start. This is the
          32-bit GUI half of Libero/Synplify and Vivado's cable drivers, so
          prove those on the pilot box before imaging --
          `sudo it-fpga check` lists this again at any time, with the reason
          for each.
      when: >-
        (fpga_packages_i386 | difference(_fpga_i386_have.stdout_lines | default([])) | length) > 0
      tags: [packages]

    # ---- where the toolchains go ------------------------------------------
    # The PARENT only, empty and root-owned. The role never creates or writes
    # anything inside these -- the installers do, run under sudo, so the tree
    # ends up root-owned and the engineers who use it cannot modify it.
    #
    # Creating them here removes the one manual step before the installer:
    # the Xilinx .bin needs /tools to exist to write into it, and the Libero
    # installer offered ~/Microchip as its default is how you end up with a
    # 30 GB copy per engineer.
    - name: "FPGA | Install locations exist (empty; the installers fill them)"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - { path: "{{ fpga_xilinx_root }}",    keep: "{{ fpga_xilinx_enabled | bool }}" }
        - { path: "{{ fpga_microchip_root }}", keep: "{{ fpga_microchip_enabled | bool }}" }
      loop_control:
        label: "{{ item.path }}"
      when: item.keep

    # ---- compatibility shims ----------------------------------------------
    # Private compat directory for the old RHEL-era libraries Libero needs and
    # Ubuntu does not package. Created empty: it-fpga populates it, and an
    # empty directory on LD_LIBRARY_PATH is harmless where a missing one is
    # just noise in every ld.so trace.
    - name: "FPGA | Libero compat library directory"
      ansible.builtin.file:
        path: "{{ fpga_libero_compat_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: fpga_microchip_enabled | bool

    # Vivado wants libtinfo.so.5 / libncurses.so.5. Symlinks onto the ncurses 6
    # sonames, NOT the Jammy .debs: a package from another Ubuntu release on a
    # STIG box is a supply-chain problem and is unreachable once the box is
    # offline. If the ABI assumption ever stops holding, Vivado fails loudly at
    # load rather than silently -- `ldd` on the vivado binary says so.
    - name: "FPGA | ncurses 5 compatibility symlinks (Vivado)"
      ansible.builtin.file:
        src: "/usr/lib/x86_64-linux-gnu/lib{{ item }}.so.6"
        dest: "/usr/lib/x86_64-linux-gnu/lib{{ item }}.so.5"
        state: link
        force: false
      loop: [tinfo, ncurses]
      when:
        - fpga_xilinx_enabled | bool
        - fpga_ncurses5_shim | bool

    # FlexLM creates /usr/tmp/.flexlm. Ubuntu has no /usr/tmp.
    # root:root 1777 -- the sticky bit is what makes it safe to share, and is
    # what the "chown $USER /usr/tmp" advice gets wrong: that locks out every
    # engineer but the one who ran it.
    - name: "FPGA | /usr/tmp for FlexLM (root:root, sticky)"
      ansible.builtin.file:
        path: /usr/tmp
        state: directory
        owner: root
        group: root
        mode: "1777"
      when: fpga_usr_tmp | bool

    # Libero looks for RHEL's CA bundle path and cannot reach the licence
    # server or the vendor's package host without it.
    - name: "FPGA | RHEL CA bundle path (Libero)"
      ansible.builtin.file:
        path: /etc/pki/tls/certs
        state: directory
        owner: root
        group: root
        mode: "0755"
      when:
        - fpga_microchip_enabled | bool
        - fpga_rhel_ca_symlink | bool

    - name: "FPGA | RHEL CA bundle symlink (Libero)"
      ansible.builtin.file:
        src: /etc/ssl/certs/ca-certificates.crt
        dest: /etc/pki/tls/certs/ca-bundle.crt
        state: link
        force: true
      when:
        - fpga_microchip_enabled | bool
        - fpga_rhel_ca_symlink | bool

    # ---- device access ----------------------------------------------------
    # MODE="0660" and a group, NOT the MODE="0666" both vendors' instructions
    # ask for. A world-writable device node on a STIG box is a finding, and it
    # buys nothing a group does not.
    - name: "FPGA | Device-access group exists ({{ fpga_device_group }})"
      ansible.builtin.group:
        name: "{{ fpga_device_group }}"
        state: present

    - name: "FPGA | udev rules for JTAG programmers"
      ansible.builtin.template:
        src: 70-fpga-programmers.rules.j2
        dest: /etc/udev/rules.d/70-fpga-programmers.rules
        owner: root
        group: root
        mode: "0644"
      register: _fpga_udev

    - name: "FPGA | Reload udev"
      ansible.builtin.shell: udevadm control --reload-rules && udevadm trigger
      changed_when: false
      when: _fpga_udev is changed

    # ---- environment ------------------------------------------------------
    # /etc/profile.d, not a home directory: every user gets it with nothing to
    # source by hand, and it is one file to change when a version moves.
    - name: "FPGA | System-wide environment (Xilinx)"
      ansible.builtin.template:
        src: xilinx.sh.j2
        dest: /etc/profile.d/xilinx.sh
        owner: root
        group: root
        mode: "0644"
      when: fpga_xilinx_enabled | bool

    - name: "FPGA | System-wide environment (Microchip)"
      ansible.builtin.template:
        src: microchip.sh.j2
        dest: /etc/profile.d/microchip.sh
        owner: root
        group: root
        mode: "0644"
      when: fpga_microchip_enabled | bool

    - name: "FPGA | Remove the environment for a toolchain that is switched off"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop:
        - { path: /etc/profile.d/xilinx.sh,   keep: "{{ fpga_xilinx_enabled | bool }}" }
        - { path: /etc/profile.d/microchip.sh, keep: "{{ fpga_microchip_enabled | bool }}" }
      loop_control:
        label: "{{ item.path }}"
      when: not item.keep

    # Every directory the scripts-tagged tasks below write into, created HERE
    # and tagged the same. `it-pull scripts` runs this role BEFORE it_scripts
    # (local.yml order), so nothing else has made them yet -- that ordering is
    # what broke the first scripts-only pull with "Destination directory
    # /etc/stig-build/fpga does not exist".
    #
    # /etc/stig-build is created explicitly with its own 0700 root:root rather
    # than left to Ansible's implicit parent creation, which would use a
    # default mode and leave a directory that holds generated secrets
    # world-readable until it_scripts ran later and corrected it.
    - name: "FPGA | Directories the script-shipping tasks write into"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/stig-build,      mode: "0700" }
        - { path: /etc/stig-build/fpga, mode: "0755" }
        - { path: "{{ it_scripts_dir | default('/opt/it/scripts') }}",
            mode: "2750", group: "{{ ia_it_group | default('sudo') }}" }
      loop_control:
        label: "{{ item.path }}"
      tags: [scripts]

    # The install selection, so `it-fpga install xilinx` reproduces one box's
    # choice on every other. Not a secret -- it lists modules and device
    # families, nothing more.
    - name: "FPGA | Xilinx install configuration"
      ansible.builtin.copy:
        src: xilinx-install_config.txt
        dest: /etc/stig-build/fpga/xilinx-install_config.txt
        owner: root
        group: root
        mode: "0644"
      when: fpga_xilinx_enabled | bool
      tags: [scripts]

    # ---- launchers and desktop entries ------------------------------------
    - name: "FPGA | Launchers and app-grid entries"
      ansible.builtin.import_tasks: desktop.yml

    # ---- licensing --------------------------------------------------------
    - name: "FPGA | Licence configuration"
      ansible.builtin.import_tasks: license.yml

    # ---- the helper -------------------------------------------------------
    # it_scripts owns /usr/local/sbin; this one lives with the role because it
    # is meaningless without it, and is removed with it.
    # Tagged `scripts` so `it-pull scripts` ships a fix to it-fpga on its own.
    # This USED to be paired with a role-level `packages` tag, which quietly
    # defeated it: --skip-tags beats a task's own tag, so a light `it-pull`
    # skipped the whole role and the new it-fpga never landed. The role tag is
    # gone and the apt tasks carry `packages` themselves.
    - name: "FPGA | Install it-fpga"
      ansible.builtin.copy:
        src: fpga.sh
        dest: "{{ it_scripts_dir | default('/opt/it/scripts') }}/fpga.sh"
      # root:%s, not root:root. A 0750 root:root script cannot be READ or
      # executed by anyone but root, so the self-elevating first line never gets
      # the chance to run -- `it-<name>` fails with Permission denied instead of
      # prompting for sudo, and `it-help` lists it as "(cannot read its script)".
      # Every it_scripts command uses this group; these did not.
        owner: root
        group: "{{ ia_it_group | default('sudo') }}"
        mode: "0750"
      tags: [scripts]

    - name: "FPGA | Short command (it-fpga)"
      ansible.builtin.file:
        src: "{{ it_scripts_dir | default('/opt/it/scripts') }}/fpga.sh"
        dest: /usr/local/sbin/it-fpga
        state: link
        force: true
      tags: [scripts]

    - name: "FPGA | Where things are"
      ansible.builtin.debug:
        msg: >-
          FPGA scaffolding in place.
          {{ 'Xilinx ' ~ fpga_xilinx_version ~ ' expected at ' ~ fpga_xilinx_root ~ '. '
             if fpga_xilinx_enabled | bool else '' }}
          {{ 'Libero ' ~ fpga_libero_version ~ ' expected at ' ~ fpga_libero_dir ~ '. '
             if fpga_microchip_enabled | bool else '' }}
          Licence mode: {{ fpga_license_mode }}.
          The toolchains themselves are NOT installed by Ansible -- check with
          `sudo it-fpga status`, set the licence server with `sudo it-fpga license`.
