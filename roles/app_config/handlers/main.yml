---
- name: restart freshclam
  ansible.builtin.systemd:
    name: clamav-freshclam
    state: restarted

- name: restart clamav-daemon
  ansible.builtin.systemd:
    name: clamav-daemon
    state: restarted
  failed_when: false      # first run: freshclam may not have primed a database yet.
                          # Also masked where clamav_container owns scanning.
