---
# =============================================================================
# code-server -- VS Code in the browser, one instance per user.
#
# code-server is SINGLE-USER PER INSTANCE; there is no multi-tenant mode. So
# every user needs their own port in dev_code_server_port ..
# + dev_code_server_port_span - 1. The pull does NOT hand them out: a port is
# claimed the first time that person runs `my-ide` (code-server-claim.socket ->
# `it-codeserver claim-peer`), recorded in the root-only /etc/code-server/ports,
# and kept for good. The pull writes the settings that claim reads, refreshes
# the configs of people on file, and clears stale ones (`it-codeserver sync`).
#
# Each instance has its OWN generated password, root-only in /etc/code-server.
# desktop_hardening opens the port range (allow, source-restricted) after USG.
# Included from code_server.yml once the package is known to be installed.
# Paths are spelled from playbook_dir because legacy.yml (22.04, Ansible 2.10)
# runs these same files from outside this role.
# =============================================================================

- name: "CODE-SERVER | Password store (root-only)"
  ansible.builtin.file:
    path: /etc/code-server
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: "CODE-SERVER | Settings the port claim reads"
  ansible.builtin.copy:
    dest: /etc/code-server/settings
    owner: root
    group: root
    mode: "0600"
    content: |
      # Written by the pull from dev_code_server_* -- read by it-codeserver.
      CS_PORT={{ dev_code_server_port | int }}
      CS_SPAN={{ dev_code_server_port_span | int }}
      CS_BIND={{ dev_code_server_bind_addr | quote }}
      CS_TLS={{ (dev_code_server_tls | default(true) | bool) | lower }}
      CS_GROUP={{ dev_code_server_group | default('') | quote }}
      CS_EXCLUDE={{ dev_code_server_exclude | default([]) | join(' ') | quote }}
      CS_FALLBACK_USER={{ dev_tools_user | quote }}
      CS_LINGER_ALL={{ (dev_code_server_linger_all | default(true) | bool) | lower }}
      CS_IDLE_SECONDS={{ (dev_code_server_idle_timeout_minutes | default(60) | int) * 60 }}

# The unit every engineer runs. A USER unit: it lives under their own
# `systemd --user`, so starting it needs no root, no sudoers grant and no
# admin -- and because lingering is off, nothing exists at boot.
- name: "CODE-SERVER | The per-user systemd unit"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/dev_tools/files/code-server-user.service"
    dest: /etc/systemd/user/code-server.service
    owner: root
    group: root
    mode: "0644"
  register: _cs_unit
  tags: [scripts]

- name: "CODE-SERVER | Reload systemd so the user unit is visible"
  ansible.builtin.systemd:
    daemon_reload: true
  when: _cs_unit is changed
  tags: [scripts]

- name: "CODE-SERVER | The port-claim socket and service (first my-ide)"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/dev_tools/files/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - code-server-claim.socket
    - code-server-claim@.service
  register: _cs_claim_units

- name: "CODE-SERVER | Listen for first-time claims"
  ansible.builtin.systemd:
    name: code-server-claim.socket
    enabled: true
    state: "{{ 'restarted' if _cs_claim_units is changed else 'started' }}"
    daemon_reload: "{{ _cs_claim_units is changed }}"

# Removing someone from the group has to STOP their instance: systemd units
# enabled by an earlier run stay enabled forever otherwise (trap 3).
- name: "CODE-SERVER | Which instances are enabled right now?"
  ansible.builtin.shell:
    cmd: |
      # NOT `list-unit-files 'code-server@*'`: that matches the TEMPLATE,
      # code-server@.service, whose name contains no user -- so this produced
      # an empty list and the cleanup below has been a no-op since it was
      # written. Twelve failed instances per box survived every pull because
      # nothing ever enumerated them.
      {
        systemctl list-units --all --plain --no-legend 'code-server@*.service' 2>/dev/null \
          | awk '{print $1}'
        ls /etc/systemd/system/*.wants/code-server@*.service 2>/dev/null \
          | xargs -r -n1 basename
      } | sed 's/^code-server@//; s/\.service$//' | grep -vE '^$' | sort -u
      exit 0
  register: _cs_enabled
  changed_when: false

# Every system instance now, not only the ex-members'. The instance moved to a
# user unit, so ANY surviving code-server@<user> is a second copy racing the
# first for the same port -- and it is the one that starts at boot, which is
# what this change exists to stop.
- name: "CODE-SERVER | Stop and disable every old system instance"
  ansible.builtin.systemd:
    name: "code-server@{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ _cs_enabled.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item }}"
  failed_when: false

# Disabling a unit does NOT clear its failed state. Twelve dead
# code-server@<locked-user> units sat in `systemctl --failed` on every
# development box -- the first thing anyone reviewing the machine looks at, and
# an assessor among them. The service is correctly off; only the corpse was
# left behind.
- name: "CODE-SERVER | Clear the failed state of instances that should not run"
  ansible.builtin.command: "systemctl reset-failed code-server@{{ item }}.service"
  loop: "{{ _cs_enabled.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  failed_when: false

- name: "CODE-SERVER | Is the short command still the old symlink?"
  ansible.builtin.stat:
    path: /usr/local/sbin/it-codeserver
  register: _cs_link_stat
  tags: [scripts]

- name: "CODE-SERVER | Install it-codeserver"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/dev_tools/files/code-server-status.sh"
    dest: "{{ it_scripts_dir | default('/opt/it/scripts') }}/code-server-status.sh"
    # root:<admin group>, not root:root. A 0750 root:root script cannot be read
    # or executed by anyone but root, so the self-elevating first line never
    # runs -- the command fails with Permission denied instead of prompting.
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "0750"

  tags: [scripts]
# A REAL FILE, not a symlink into /opt/it. That directory is 2770 root:sudo, so
# an engineer cannot traverse it: stat() on the link target fails with EACCES,
# bash skips the PATH entry, and the shell says "command not found" for a
# command they are explicitly meant to run (the same trap as it_scripts_public).
# `it-codeserver mine` is the ONLY way an engineer can find their port and
# password or start their instance, so it has to be reachable by them.
- name: "CODE-SERVER | Drop the old symlink before placing the real file"
  ansible.builtin.file:
    path: /usr/local/sbin/it-codeserver
    state: absent
  when: (_cs_link_stat.stat.islnk | default(false)) | bool
  tags: [scripts]

- name: "CODE-SERVER | Short command (it-codeserver)"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/dev_tools/files/code-server-status.sh"
    dest: /usr/local/sbin/it-codeserver
    owner: root
    group: root
    mode: "0755"
  tags: [scripts]
# ---------------------------------------------------------------------------
# Instances are not started at boot, so without this an engineer simply cannot
# use the IDE they are entitled to: the unit is a SYSTEM unit, starting it needs
# root, and they are not admins.
#
# The grant names `mine` and nothing else. `mine` derives the account from the
# CALLER inside the script and takes no username argument, so a member of the
# group can start, stop and restart their own instance and has no way to name
# somebody else's -- which would run a server as that person, on their port,
# behind their password.
#
# Deliberately NOT NOPASSWD, matching the it-repo grant: the STIG requires sudo
# to authenticate, and this belongs in /var/log/sudo.log with a name against it.
# The sudoers grant this replaced is REMOVED, not merely unused. `systemctl
# --user` needs no privilege, so nothing has to be granted -- and a live sudo
# rule that no longer has a purpose is exactly the finding an assessor writes up.
# ---------------------------------------------------------------------------
# THE ENGINEER'S FRONT DOOR. `it-codeserver` is an admin tool and reads like
# one; nobody should have to type it, or know what code-server is, to open an
# editor. `my-ide` and a tile in the applications grid are the whole interface
# for the people who actually use it -- start it, open it, show the password.
# ---------------------------------------------------------------------------
- name: "CODE-SERVER | my-ide (what an engineer runs)"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/dev_tools/files/my-ide.sh"
    # /usr/local/BIN, not sbin: this is not an administrative command, and bin
    # is on every user's PATH without argument.
    dest: /usr/local/bin/my-ide
    owner: root
    group: root
    mode: "0755"
  tags: [scripts]

- name: "CODE-SERVER | The IDE tile in the applications grid"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/dev_tools/files/my-ide.desktop"
    dest: /usr/share/applications/my-ide.desktop
    owner: root
    group: root
    mode: "0644"
  register: _cs_tile
  tags: [scripts]

# GNOME reads the desktop DATABASE, not the directory: without this the tile
# can stay missing until the next reboot.
- name: "CODE-SERVER | Refresh the desktop database"
  ansible.builtin.command: update-desktop-database /usr/share/applications
  changed_when: false
  failed_when: false
  when: _cs_tile is defined and _cs_tile is changed
  tags: [scripts]

# Configs and the ledger are written by it-codeserver ONLY, so the claim and
# the pull cannot disagree about a port or a password.
- name: "CODE-SERVER | Refresh claimed instances, clear stale configs"
  ansible.builtin.command: /usr/local/sbin/it-codeserver sync
  register: _cs_sync
  changed_when: _cs_sync.stdout is search('(?m)^(FRESH|CLEARED) ')
  when: not ansible_check_mode

- name: "CODE-SERVER | Who is on file"
  ansible.builtin.set_fact:
    _cs_users: "{{ (_cs_sync.stdout_lines | default([])) | select('match', '^USER ')
                   | map('regex_replace', '^USER (\\S+) .*$', '\\1') | list }}"

- name: "CODE-SERVER | Ledger started fresh / configs cleared / left out"
  ansible.builtin.debug:
    msg: "{{ (_cs_sync.stdout_lines | default([])) | reject('match', '^USER ') | list }}"
  when: (_cs_sync.stdout_lines | default([])) | reject('match', '^USER ') | list | length > 0

- name: "CODE-SERVER | Retire old system units, apply lingering, per user on file"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/dev_tools/tasks/code_server_user.yml"
  loop: "{{ _cs_users }}"
  loop_control:
    loop_var: cs_user
    label: "{{ cs_user }}"
  when: _cs_users | length > 0

- name: "CODE-SERVER | Remove the old sudo grant (a user service needs none)"
  ansible.builtin.file:
    path: "/etc/sudoers.d/60-{{ dev_code_server_group }}-codeserver"
    state: absent
  tags: [scripts]
- name: "CODE-SERVER | Where things are"
  ansible.builtin.debug:
    msg: >-
      code-server: {{ _cs_users | length }} user(s) on file
      {{ ('(' ~ (_cs_users | join(', ')) ~ ')') if _cs_users else '' }}.
      Ports {{ dev_code_server_port }}-{{ dev_code_server_port + dev_code_server_port_span - 1 }}
      on {{ dev_code_server_bind_addr }}, claimed at each person's first my-ide
      and kept in /etc/code-server/ports. `sudo it-codeserver` lists who is on
      which port.
