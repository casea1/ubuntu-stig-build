---
# Installed by bootstrap.sh at build time, and by it-pull whenever this file
# changes (a failed install there only warns: an offline box keeps what it has).
# Collections only -- hardening is Canonical's USG (an apt package via Ubuntu
# Pro), so there is no Galaxy role to pull.
#
# RANGES, not pins: a floor, and a ceiling at the last major that still
# supports noble's ansible-core 2.16 -- without one, galaxy installed the
# newest community.general (13.x, needs 2.18) on every new box. Raise the
# ceilings with the ansible-core version, never alone. To freeze a gold image, set each `version:` to an exact
# release from a known-good box (`ansible-galaxy collection list`); a pin that
# noble's ansible-core cannot load would stop every new bootstrap.
#
# legacy.yml (22.04, Ansible 2.10) does not use this file: it runs on the
# collections bundled with 22.04's `ansible` package.

collections:
  - name: community.general # ufw, ini_file, modprobe, lvol (disk_expand), alternatives (xfce)
    version: ">=8.0.0,<12.0.0"  # 12.x needs ansible-core 2.17, 13.x 2.18; noble ships 2.16
  - name: ansible.posix     # acl (local_accounts, managed_dirs), sysctl (remote_desktop)
    version: ">=1.5.0,<3.0.0"   # 2.x supports 2.16; cap the next major the same way
