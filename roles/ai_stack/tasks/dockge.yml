---
# =============================================================================
# ai_stack :: dockge.yml -- Dockge, a web UI to manage the box's Docker Compose
# stacks. This is the MANAGEMENT PLANE, deliberately separate from your AI
# workload stack (which you deploy from your own compose files).
#
# SECURITY: Dockge mounts the Docker socket, so its web UI is root-equivalent on
# this host. Treat {{ dockge_port }} as privileged -- restrict it to an admin
# subnet in ai_firewall_allow_ports (`from:`), and create the admin account on
# first login.
#
# Dockge quirk: the stacks directory must be bind-mounted at the SAME path inside
# the container as on the host (it shells out to `docker compose` using that path)
# and named via DOCKGE_STACKS_DIR. Runs after docker.yml (Docker up) while the box
# is still online (image pull). Idempotent: only creates the container if absent.
# =============================================================================

- name: "Dockge | Remove any retired Portainer container (replaced by Dockge)"
  # We swapped Portainer -> Dockge. Drop the old management container if a prior
  # build left one; its named volume (portainer_data) is left in place -- remove it
  # by hand with `docker volume rm portainer_data` if you want the space back.
  ansible.builtin.command: docker rm -f portainer
  register: _portainer_rm
  changed_when: "'portainer' in (_portainer_rm.stdout | default(''))"
  failed_when:
    - _portainer_rm.rc != 0
    - "'No such container' not in (_portainer_rm.stderr | default(''))"

- name: "Dockge | Ensure the stacks dir exists ({{ dockge_stacks_dir }})"
  # ai_compose writes the per-service AI stacks straight into subdirs here
  # (/opt/stacks/<stack>/), and this whole dir is bind-mounted into Dockge, so
  # every stack shows up natively -- no per-stack bind mount needed.
  ansible.builtin.file:
    path: "{{ dockge_stacks_dir }}"
    state: directory
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "0750"

- name: "Dockge | Is the container already present?"
  ansible.builtin.command: docker ps -aq --filter "name=^dockge$"
  register: _dockge_ps
  changed_when: false
  check_mode: false      # read-only probe: must run in --check too

- name: "Dockge | Deploy Dockge ({{ dockge_image }})"
  # --restart=always so it survives reboot; named volume dockge_data is created
  # implicitly. `docker run` pulls the image if missing (do it now, while online).
  # The whole stacks dir is bind-mounted at the SAME path, so ai_compose's
  # per-service stacks (/opt/stacks/<stack>/compose.yaml) appear natively in Dockge.
  ansible.builtin.command: >-
    docker run -d --name dockge --restart=always
    -p {{ dockge_port }}:5001
    -v /var/run/docker.sock:/var/run/docker.sock
    -v dockge_data:/app/data
    -v {{ dockge_stacks_dir }}:{{ dockge_stacks_dir }}
    -e DOCKGE_STACKS_DIR={{ dockge_stacks_dir }}
    {{ dockge_image }}
  when: (_dockge_ps.stdout | trim) == ""
  changed_when: true
