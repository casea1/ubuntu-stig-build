# System 2 -- DORMANT break-glass fallback: the whole node as ONE compose
# project. NOT deployed. The live config is the per-service stacks under
# /opt/stacks/<stack>/, which carry the explanatory comments; this file is a
# mirror of them and shares the same external volumes.
#   docker compose -f docker-compose.consolidated.yaml up -d
name: ai-system2

networks:
  oi:
    driver: bridge

volumes:
  granite-embed: { external: true }        # granite-embedding-small-english-r2 weights
  granite-vision: { external: true }       # granite-vision-4.1-4b weights
  lgtm-data: { external: true }            # Grafana/LGTM state (dashboards, TSDB)
  mlflow-artifacts: { external: true }     # MLflow artifact store
  postgres_mlflow_data: { external: true } # MLflow's internal Postgres data
  openwiki-out: { external: true }         # OpenWiki output workdir

services:
  vllm-embed:
    image: vllm/vllm-openai:v0.22.1-cu129-ubuntu2404
    container_name: vllm-embed
    ipc: host
    ports:
      - "8002:8002"
    volumes:
      - granite-embed:/granite-embed
      - ./fips_off:/proc/sys/crypto/fips_enabled:ro   # host FIPS carve-out (see docs/operate.md)
    command:
      - --model=/granite-embed
      - --served-model-name=granite-embedding-small-english-r2
      - --runner=pooling                  # embedding mode (replaces the removed --task=embed)
      - --tensor-parallel-size=1          # System 2 has ONE GPU
      - --gpu-memory-utilization=0.10
      - --port=8002
    networks: [oi]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu] }

  vllm-vision:
    image: vllm/vllm-openai:v0.22.1-cu129-ubuntu2404
    container_name: vllm-vision
    ipc: host
    ports:
      - "8003:8003"
    volumes:
      - granite-vision:/granite-vision
      - ./fips_off:/proc/sys/crypto/fips_enabled:ro
    command:
      - --model=/granite-vision
      - --served-model-name=granite-vision-4.1-4b
      - --tensor-parallel-size=1
      - --gpu-memory-utilization=0.35
      - --max-model-len=16384
      - --port=8003
    networks: [oi]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu] }

  docling-serve:
    image: ghcr.io/docling-project/docling-serve-cu128:v1.24.0
    container_name: docling-serve
    ports:
      - "5001:5001"
    volumes:
      - ./fips_off:/proc/sys/crypto/fips_enabled:ro
    environment:
      - DOCLING_SERVE_MAX_SYNC_WAIT=6000
      - DOCLING_SERVE_ENABLE_UI=false
      - OMP_NUM_THREADS=4
      - UVICORN_WORKERS=1
      - DOCLING_SERVE_ENABLE_REMOTE_SERVICES=true
      - DOCLING_SERVE_ALLOW_CUSTOM_VLM_CONFIG=true
    networks: [oi]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu] }

  tika:
    image: apache/tika:3.3.1.0
    container_name: tika
    ports:
      - "9998:9998"
    networks: [oi]
    restart: unless-stopped

  lgtm:
    image: grafana/otel-lgtm:0.29.0
    container_name: open-webui-lgtm
    ports:
      - "3001:3000"        # Grafana UI (admins)
      - "4317:4317"        # OTLP gRPC  (from System 1's Open WebUI)
      - "4318:4318"        # OTLP HTTP
    volumes:
      - lgtm-data:/data
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ubuntu-stig-build.yaml:ro
      - ./grafana/openwebui-dashboard.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/openwebui-dashboard.json:ro
    networks: [oi]
    restart: unless-stopped

  oikb:
    image: oikb:latest          # built on the box by ansible (ai_compose)
    container_name: oikb
    profiles: ["oikb"]
    working_dir: /app
    ports:
      - "8081:8080"
    extra_hosts:
      - "${SYSTEM1_HOSTS_ENTRY:-localhost:127.0.0.1}"
    environment:
      OPEN_WEBUI_URL: "${OPEN_WEBUI_URL:-http://dev-ai1:3000}"   # System 1, cross-node
      OPEN_WEBUI_API_KEY: "${OPEN_WEBUI_API_KEY:-}"
      GITLAB_URL: "${GITLAB_URL:-}"
      GITLAB_TOKEN: "${GITLAB_TOKEN:-}"
      LOG_FORMAT: "json"
    command: oikb daemon
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://0.0.0.0:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./.oikb.yaml:/app/.oikb.yaml
    networks: [oi]
    restart: unless-stopped

  mlflow-db:
    image: pgvector/pgvector:pg16-trixie      # same image as System 1's pgvector
    container_name: mlflow-db
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:?set in .env}
      POSTGRES_DB: mlflow
    volumes:
      - postgres_mlflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [oi]
    restart: unless-stopped

  mlflow:
    image: mlflow:v3.15.1-psycopg2      # built on the box by ansible (ai_compose)
    container_name: mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:${MLFLOW_DB_PASSWORD}@mlflow-db:5432/mlflow
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
      --disable-security-middleware
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    depends_on:
      mlflow-db:
        condition: service_healthy
    networks: [oi]
    restart: unless-stopped

  hfcli:
    image: hfcli:latest         # built on the box by ansible (ai_compose)
    container_name: hfcli
    profiles: ["tools"]
    volumes:
      - granite-embed:/granite-embed
      - granite-vision:/granite-vision
    networks: [oi]

  openwiki:
    image: openwiki:latest      # built on the box by ansible (ai_compose)
    container_name: openwiki
    profiles: ["tools"]
    extra_hosts:
      - "${SYSTEM1_HOSTS_ENTRY:-localhost:127.0.0.1}"
    working_dir: /work
    volumes:
      - openwiki-out:/work
    environment:
      OPENWIKI_PROVIDER: "${OPENWIKI_PROVIDER:-openai-compatible}"
      OPENAI_COMPATIBLE_BASE_URL: "${OPENAI_COMPATIBLE_BASE_URL:-http://dev-ai1:8000/v1}"
      OPENAI_COMPATIBLE_API_KEY: "${OPENAI_COMPATIBLE_API_KEY:-not-used}"
      OPENWIKI_MODEL_ID: "${OPENWIKI_MODEL_ID:-gpt-oss-120b}"
    networks: [oi]

  openwiki-view:
    image: openwiki:latest
    container_name: openwiki-view
    working_dir: /work
    command: ["sh", "-c", "mkdir -p openwiki && exec openwiki visualize --no-open --port 4321"]
    volumes:
      - openwiki-out:/work
    ports:
      - "4321:8080"
    networks: [oi]
    restart: unless-stopped

  openwiki-view-proxy:
    image: openwiki-view:latest
    container_name: openwiki-view-proxy
    network_mode: "service:openwiki-view"
    depends_on: [openwiki-view]
    restart: unless-stopped
