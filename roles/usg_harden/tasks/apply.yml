---
# =============================================================================
# usg_harden/apply.yml -- everything that RUNS the `usg` binary.
#
# Split out of main.yml so it can be skipped as a unit when the usg package is
# not installed. It used to sit inline, and `apt install usg` was a HARD
# failure: on dev-16 the package was not available from the attached Pro
# repositories, the task aborted the play, and every role after usg_harden --
# usg_remediate (which does its own STIG remediation and never calls `usg`),
# usbguard, powerstrux, it_scripts -- never ran. The box lost both the
# hardening this role could not deliver and all the hardening it could.
#
# Imported with `when: _usg_installed`, which main.yml resolves by asking the
# box for the binary rather than by trusting an exit code.
# =============================================================================

# ---- Smart-card (CAC) opt-out via a generated tailoring file ------------
# This image is password-login only (smartcard POA&M'd), but disa_stig's
# "Enable Smart Card Logins in PAM" rule (smartcard_pam_enabled) wires
# pam_pkcs11.so into the auth stack -> "no suitable token / No smart card
# found" on every auth when no CAC reader is present. When usg_disable_smartcard
# is set (and the operator hasn't supplied their OWN tailoring file), generate a
# tailoring file from USG's own content and DE-SELECT those rules, so `usg fix`
# never wires up pam_pkcs11 and `usg audit` doesn't flag them. Generating the
# file (rather than hand-authoring XML) keeps the benchmark href / profile id /
# namespaces correct by construction.
- name: "USG | Generate + patch a smartcard-opt-out tailoring file"
  when:
    - usg_disable_smartcard | default(true) | bool
    - (usg_tailoring_file | default('') | length) == 0
    - (usg_disable_smartcard_rules | default([]) | length) > 0
  block:
    - name: "USG | Ensure the tailoring dir exists"
      ansible.builtin.file:
        path: "{{ usg_managed_tailoring_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "USG | Generate a tailoring file from the {{ usg_profile }} profile"
      ansible.builtin.command:
        cmd: "usg generate-tailoring {{ usg_profile }} {{ usg_managed_tailoring_file }}"
        creates: "{{ usg_managed_tailoring_file }}"

    - name: "USG | De-select the smartcard/PKCS11 rules in the tailoring file"
      # Flip selected="true" -> "false" on each smartcard rule's <xccdf:select>.
      # idref may or may not carry the ssgproject prefix, hence the optional group.
      ansible.builtin.replace:
        path: "{{ usg_managed_tailoring_file }}"
        regexp: '(idref="(?:xccdf_org\.ssgproject\.content_rule_)?{{ item | regex_escape }}"[^>]*\bselected=")true(")'
        replace: '\1false\2'
      loop: "{{ usg_disable_smartcard_rules }}"

    # `usg generate-tailoring` emits <select> lines only for rules that exist
    # in USG'S OWN bundled SSG content. it-oscap evaluates the NEWER
    # ComplianceAsCode release pinned in ssg_content_version, which adds
    # rules -- and a rule with no <select> line has nothing for the replace
    # above to flip, so it is selected by default and fails.
    #
    # That is exactly what happened to the smart-card family: USG 0.1.78
    # does not carry smartcard_pam_enabled, service_sssd_enabled or
    # sssd_enable_user_cert, so the tailoring said nothing about them and
    # the 0.1.81 scan reported all three as findings the accredited
    # baseline had already de-scoped. Add the missing ones explicitly.
    #
    # An idref the evaluated datastream does not contain is ignored, so
    # these are harmless against older content.
    - name: "USG | Read back the tailoring file"
      ansible.builtin.slurp:
        src: "{{ usg_managed_tailoring_file }}"
      register: _usg_tailoring_raw

    - name: "USG | Which de-selects did USG's own content not carry?"
      ansible.builtin.set_fact:
        _usg_tailoring_missing: >-
          {{ usg_disable_smartcard_rules
             | reject('in', (_usg_tailoring_raw.content | b64decode))
             | list }}

    - name: "USG | Add de-selects for rules only the newer SSG carries"
      ansible.builtin.blockinfile:
        path: "{{ usg_managed_tailoring_file }}"
        marker: "<!-- {mark} ansible: de-selects absent from USG's own content -->"
        insertbefore: '</(xccdf:)?Profile>'
        block: |
          {% for r in _usg_tailoring_missing %}
          <xccdf:select idref="xccdf_org.ssgproject.content_rule_{{ r }}" selected="false"/>
          {% endfor %}
      when: (_usg_tailoring_missing | default([])) | length > 0

    - name: "USG | Report the added de-selects"
      ansible.builtin.debug:
        msg: >-
          {{ _usg_tailoring_missing }} are not in USG's bundled content, so
          the generated tailoring had no <select> line to flip. Added
          explicit de-selects -- without them a scan against the newer SSG
          (ssg_content_version) reports rules this baseline has de-scoped.
      when: (_usg_tailoring_missing | default([])) | length > 0

    - name: "USG | Mark the generated tailoring file as in play"
      ansible.builtin.set_fact:
        _managed_tailoring_used: true

# ---- Resolve the effective tailoring file ------------------------------
# Operator's own file wins; otherwise the generated smartcard opt-out (if any).
- name: "USG | Pick the effective tailoring file"
  ansible.builtin.set_fact:
    _effective_tailoring_file: >-
      {{ usg_tailoring_file
         if (usg_tailoring_file | default('') | length) > 0
         else (usg_managed_tailoring_file if (_managed_tailoring_used | default(false)) else '') }}

- name: "USG | Validate the tailoring file exists (if one is in play)"
  ansible.builtin.stat:
    path: "{{ _effective_tailoring_file }}"
  register: _usg_tailoring_stat
  when: (_effective_tailoring_file | length) > 0

- name: "USG | Compute the fix/audit target (tailoring file OR profile -- never both)"
  # `usg fix|audit` rejects a profile AND a tailoring file together
  # ("You cannot provide both a tailoring file and a profile!"). A tailoring
  # file already declares the profile it extends, so when one is in play we pass
  # ONLY `--tailoring-file <path>`; otherwise we pass the bare profile name.
  ansible.builtin.set_fact:
    _usg_target: >-
      {{ ('--tailoring-file ' ~ _effective_tailoring_file)
         if ((_effective_tailoring_file | length) > 0
              and _usg_tailoring_stat.stat.exists | default(false))
         else usg_profile }}

# ---- Lockout backstop ---------------------------------------------------
# `usg fix disa_stig` (and the DISA profile) require a usable password on an
# admin account or you WILL be locked out. Confirm at least one sudo/admin
# group member has a hashed password before we run the fix.
- name: "USG | Verify an admin account has a usable password (lockout backstop)"
  ansible.builtin.shell: |
    set -o pipefail
    for u in $(getent group sudo admin 2>/dev/null | awk -F: '{print $4}' | tr ',' '\n' | sort -u); do
      [ -n "$u" ] || continue
      h=$(getent shadow "$u" 2>/dev/null | cut -d: -f2)
      case "$h" in
        \$*) echo "ok:$u"; exit 0 ;;
      esac
    done
    exit 1
  args:
    executable: /bin/bash
  register: _admin_pw
  changed_when: false
  failed_when: false

- name: "USG | Decide whether it is safe to run `usg fix`"
  ansible.builtin.set_fact:
    _usg_fix_safe: "{{ (usg_fix_enabled | default(true) | bool) and (_admin_pw.rc == 0) }}"

- name: "USG | POA&M WARNING -- `usg fix` skipped (no admin password set)"
  ansible.builtin.debug:
    msg: >-
      `usg fix` was NOT run: no sudo/admin account has a usable password, so
      applying the DISA profile would lock this box out. Set one with
      `sudo passwd <admin>` and re-run. (usg audit still runs below.)
  when:
    - usg_fix_enabled | default(true) | bool
    - _admin_pw.rc != 0

# ---- Apply the fix (once per image, unless forced) ---------------------
- name: "USG | Has this profile already been fixed on this box?"
  ansible.builtin.slurp:
    src: "{{ usg_stamp_file }}"
  register: _usg_stamp
  failed_when: false

- name: "USG | Apply `usg fix {{ usg_profile }}` (disruptive; reboot after)"
  ansible.builtin.command: "usg fix {{ _usg_target }}"
  register: _usg_fix
  changed_when: _usg_fix.rc == 0
  when:
    - _usg_fix_safe | bool
    - usg_force_fix | default(false) | bool
      or not (_usg_stamp is defined and _usg_stamp.get('content')
              and (_usg_stamp.content | b64decode | trim) == usg_profile)

- name: "USG | Record that the profile was applied + require a reboot"
  when: _usg_fix is defined and not (_usg_fix is skipped) and _usg_fix.rc == 0
  block:
    - name: "USG | Ensure the stamp dir exists"
      ansible.builtin.file:
        path: "{{ usg_stamp_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "USG | Write the applied-profile stamp"
      ansible.builtin.copy:
        dest: "{{ usg_stamp_file }}"
        content: "{{ usg_profile }}\n"
        owner: root
        group: root
        mode: "0644"

    - name: "USG | fix applied -> reboot required"
      ansible.builtin.set_fact:
        usg_reboot_required: true

# ---- Audit -- NORMALLY SKIPPED HERE ------------------------------------
# usg_remediate re-runs the same `usg audit` after remediation, and that is
# the one worth keeping: it reflects the finished box, not a box half-way
# through the build. Running it in both places cost a full benchmark
# evaluation on every pull and produced a report that was superseded
# minutes later. So this one fires only when the re-audit will NOT --
# usg_remediate disabled, its re-audit turned off, or audits switched off
# entirely -- which keeps the guarantee that a box always ends a build with
# a report.
- name: "USG | Will usg_remediate re-audit after this?"
  ansible.builtin.set_fact:
    _usg_audit_here: >-
      {{ (usg_audit_on_pull | default('build')) != 'never'
         and not (usg_remediate_enabled | default(true) | bool
                  and usg_remediate_reaudit | default(true) | bool) }}

- name: "USG | Ensure the report dir exists"
  ansible.builtin.file:
    path: "{{ usg_report_dir }}"
    state: directory
    owner: "{{ usg_report_dir_owner | default('root') }}"
    group: "{{ usg_report_dir_group | default('root') }}"
    mode: "{{ usg_report_dir_mode | default('0750') }}"

- name: "USG | Snapshot the report set before the audit (to detect a fresh one)"
  when: _usg_audit_here | bool
  # usg audit returns rc=2 BOTH for a normal scan with failing rules AND for a
  # usage error (e.g. profile+tailoring together) that produces no report, so rc
  # alone can't tell success from failure. A successful run writes a NEW
  # timestamped file, so we compare the file count before/after instead.
  ansible.builtin.find:
    paths: /var/lib/usg
    patterns: ["*.html", "*.xml"]
    file_type: file
  register: _usg_reports_before

- name: "USG | Run `usg audit {{ usg_profile }}` -> compliance report"
  when: _usg_audit_here | bool
  # usg audit writes its HTML + XCCDF results into /var/lib/usg/ by default
  # (no output-path flags in the stock CLI). We run it plainly for maximum
  # version compatibility, then copy the artifacts into the collection dir.
  ansible.builtin.command: "usg audit {{ _usg_target }}"
  register: _usg_audit
  changed_when: false
  # A non-zero rc here just means "some rules failed" or a version quirk --
  # neither should abort the whole build; the report copy below still runs.
  failed_when: false

- name: "USG | Collect the usg audit artifacts from /var/lib/usg"
  when: _usg_audit_here | bool
  ansible.builtin.find:
    paths: /var/lib/usg
    patterns: ["*.html", "*.xml"]
    file_type: file
  register: _usg_artifacts

- name: "USG | Copy audit artifacts into {{ usg_report_dir }} (single collection point)"
  when: _usg_audit_here | bool
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ usg_report_dir }}/"
    remote_src: true
    owner: "{{ usg_report_dir_owner | default('root') }}"
    group: "{{ usg_report_file_group | default('root') }}"
    mode: "{{ usg_report_file_mode | default('0640') }}"
  loop: "{{ _usg_artifacts.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: "USG | Audit result"
  when: _usg_audit_here | bool
  # A fresh audit adds a new timestamped report, so the count grows; if it did
  # NOT grow, the audit produced nothing (usage error / quirk) -- surface that
  # loudly instead of pointing at stale reports.
  ansible.builtin.debug:
    msg: >-
      {{ 'usg audit complete; fresh report in ' ~ usg_report_dir ~ ' (and /var/lib/usg).'
         if ((_usg_artifacts.files | default([]) | length) > (_usg_reports_before.files | default([]) | length))
         else 'usg audit produced NO new report (rc=' ~ _usg_audit.rc ~ '). stderr: '
              ~ (_usg_audit.stderr | default('') | trim)
              ~ ' | Run manually: sudo usg audit ' ~ (_usg_target | default(usg_profile)) }}
