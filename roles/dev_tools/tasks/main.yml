---
# Developer tooling. Runs AFTER app_config and BEFORE hardening (usg_harden) — it needs
# internet and must finish before hardening locks down /tmp / PAM / network.

# dev_tools ships it-vscode into /opt/it/scripts, but the role
# that CREATES that directory (it_scripts) runs much later in local.yml. On a
# first build the copy therefore failed outright -- "Destination directory
# /opt/it/scripts does not exist" -- and because the play stops on the first
# failure, every role after dev_tools (fpga_tools, remote_desktop, usg_harden,
# usg_remediate, usbguard, powerstrux, it_scripts) never ran: the box was left
# UNHARDENED. Create it here, with the same owner/group/mode it_scripts uses, so
# both roles converge on one answer instead of fighting over it each pull.
- name: "DEV-TOOLS | Directories the script-shipping tasks write into"
  ansible.builtin.file:
    path: "{{ it_scripts_dir | default('/opt/it/scripts') }}"
    state: directory
    owner: root
    group: "{{ ia_it_group | default('sudo') }}"
    mode: "2750"
  tags: [scripts]

- name: Install developer toolchains (compilers, SDKs, Docker)
  ansible.builtin.import_tasks: toolchains.yml
  tags: [packages]

# NodeSource is an internet apt repo; skipped on a box reading a local repo
# (see offline_repo). Node then has to come from the offline repo if it is
# needed at all.
- name: Install Node.js (NodeSource LTS)
  ansible.builtin.import_tasks: nodejs.yml
  when:
    - dev_nodejs_enabled | default(true) | bool
    - not (offline_repo_enabled | default(false) | bool)
  tags: [packages]

- name: Provision the shared Python environment (/opt/eng-venv)
  ansible.builtin.import_tasks: python_env.yml
  tags: [packages]

- name: Install and wire VS Code extensions
  ansible.builtin.import_tasks: vscode.yml
  when: editor_choice == "vscode"

# One or the other on EVERY pull. The removal must not depend on the pull that
# turned it off: an install file imported only when enabled can never run its
# own "remove when disabled" tasks, which is how boxes kept it before.
- name: code-server (opt-in per box -- dev_code_server_enabled)
  ansible.builtin.import_tasks: code_server.yml
  when: dev_code_server_enabled | default(false) | bool

- name: Remove code-server where it is not enabled
  ansible.builtin.import_tasks: code_server_retire.yml
  when: not (dev_code_server_enabled | default(false) | bool)
