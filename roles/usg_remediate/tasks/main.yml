---
# =============================================================================
# usg_remediate -- close the REASONABLE residual DISA-STIG findings that `usg fix`
# leaves open, on BOTH profiles, running AFTER usg_harden AND the firewall roles.
#
# WHY this role exists: `usg fix` is stamped run-once, and the `usg audit` inside
# usg_harden is a snapshot taken MID-BUILD (before the firewall roles bring ufw
# up), so a handful of findings show open in that report. Everything here is
# idempotent and re-applied every ansible-pull (config-drift correction). Nothing
# here can lock out password login.
#
# Deliberately left as POA&M (NOT auto-fixed -- each needs a secret, infra, or a
# kernel swap): FIPS mode (usg_enable_fips), UEFI/GRUB boot-loader password (needs
# a hashed secret), audit-log offload (needs a remote collector). The SSSD/CAC
# rules are de-selected in the tailoring instead (see usg_disable_smartcard_rules).
# =============================================================================

# ---------------------------------------------------------------------------
# 1) SMART CARD / pam_pkcs11 cleanup
# Fixes "ERROR:pam_pkcs11.c:365: no suitable token available / Error 2308: No
# smart card found" on boxes hardened BEFORE the smartcard tailoring opt-out
# existed (smartcard_pam_enabled had already wired pam_pkcs11.so into the stack,
# and `usg fix` is stamped run-once so it won't undo it). We simply COMMENT OUT
# the pam_pkcs11 auth line -- this removes an auth *requirement*, never touches
# pam_unix, so password login cannot be lost.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# FIRST, unconditionally: the PAM auth-stack checker.
#
# It has to exist before anything that edits or verifies PAM, and it did not.
# It used to be installed ~60 lines BELOW the nullok verify that calls it, so on
# a box that had never run this role the verify executed a command that was not
# there yet -- `failed_when: false` swallowed the 127, stdout came back empty,
# and the guard fired with an empty reason and aborted the play. That is exactly
# what happened on dev-ai1, 2026-08-27, on a box whose auth stack was fine.
# ---------------------------------------------------------------------------
- name: "REMED | Install the PAM auth-stack checker"
  ansible.builtin.copy:
    src: pam-auth-check.py
    dest: "{{ pam_auth_check_path }}"
    owner: root
    group: root
    mode: "0750"

- name: "REMED | Smart card / pam_pkcs11 cleanup"
  when: usg_cleanup_pam_pkcs11 | default(true) | bool
  block:
    - name: "REMED | Find pam.d files that still reference pam_pkcs11"
      ansible.builtin.find:
        paths: /etc/pam.d
        patterns: "*"
        contains: 'pam_pkcs11\.so'
        file_type: file
      register: _pkcs11_pam

    - name: "REMED | Comment out active pam_pkcs11 lines (keeps pam_unix intact)"
      ansible.builtin.replace:
        path: "{{ item.path }}"
        # Match an uncommented auth line whose MODULE is pam_pkcs11.so; prefix '#'.
        # The [^#]* (not .*) before the module ensures we never match a line where
        # pam_pkcs11.so only appears in an inline comment after a DIFFERENT module
        # (e.g. `auth required pam_unix.so # pam_pkcs11.so`) -- commenting that out
        # would drop pam_unix and could lock the box out.
        regexp: '(?m)^(?!\s*#)(\s*auth\s+[^#]*\bpam_pkcs11\.so.*)$'
        replace: '#\1  # disabled by usg_remediate (password-login only)'
      loop: "{{ _pkcs11_pam.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"

    # Rare on this fleet (SSG edits common-auth directly rather than shipping a
    # pam-auth-update profile), but if one exists, `pam-auth-update` could re-add
    # the module on a future package trigger. Surface it so the operator can
    # `pam-auth-update` it off; we don't auto-edit pam-configs (regeneration risk).
    - name: "REMED | Detect a pam-auth-update pkcs11 profile (advisory)"
      ansible.builtin.find:
        paths: /usr/share/pam-configs
        patterns: "*"
        contains: 'pam_pkcs11\.so'
        file_type: file
      register: _pkcs11_profile

    - name: "REMED | Warn if a pkcs11 pam-config profile is present"
      ansible.builtin.debug:
        msg: >-
          A pam-auth-update profile referencing pam_pkcs11 exists
          ({{ _pkcs11_profile.files | map(attribute='path') | list | join(', ') }}).
          The active auth line was commented out, but run
          `sudo pam-auth-update` and untick PKCS#11 so it isn't re-added on a
          package update.
      when: (_pkcs11_profile.files | default([]) | length) > 0

# ---------------------------------------------------------------------------
# 1b) LOGIN BANNER for console + SSH
# USG/STIG writes the DoD Standard Mandatory Notice to /etc/issue.net (and points
# sshd at it) on EVERY `usg fix`, so SSH/console logins show the DoD banner. We
# want the box's configured banner instead (gui_banner_text -- the DCSA banner,
# or emi_unclass_banner on the unclassified EMI variant). To make this survive
# interrupted re-runs (USG re-writes /etc/issue.net each run; if a later run dies
# before this role, an sshd pointed at /etc/issue.net would revert to DoD), sshd
# is pointed at a DEDICATED file (/etc/dcsa-warning-banner) that USG never
# touches, via a drop-in that sorts FIRST. /etc/issue.net + /etc/issue are still
# overwritten so no DoD text lingers. Same documented text deviation as the GUI.
# ---------------------------------------------------------------------------
- name: "REMED | Login banner (console + SSH)"
  when:
    - usg_ssh_banner_dcsa | default(true) | bool
    - (gui_banner_text | default('') | length) > 0
  block:
    - name: "REMED | Write the banner to a DEDICATED file USG never rewrites"
      # sshd points HERE, not at /etc/issue.net. `usg fix` re-writes the DoD
      # Standard Mandatory Notice into /etc/issue.net on EVERY run, so an sshd
      # pointed at /etc/issue.net reverts to the DoD banner whenever a later
      # re-run is interrupted before this role runs. USG never touches this
      # dedicated path, so once one complete build writes it, SSH stays on the
      # DCSA banner across interrupted re-runs.
      ansible.builtin.template:
        src: issue.net.j2
        dest: /etc/dcsa-warning-banner
        owner: root
        group: root
        mode: "0644"

    - name: "REMED | Also overwrite /etc/issue.net + /etc/issue (leave no DoD text behind)"
      ansible.builtin.template:
        src: issue.net.j2
        dest: "{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - /etc/issue.net
        - /etc/issue

    - name: "REMED | Pin sshd at the site banner (sorts FIRST -> wins over USG)"
      # 00-0-... sorts before USG's 00-complianceascode-*.conf; sshd uses the
      # FIRST Banner value it reads, so ours wins regardless of USG's drop-in.
      #
      # The path defaults to /etc/issue.net because the benchmark's
      # sshd_enable_warning_banner_net checks for exactly that literal value --
      # a dedicated path fails the rule no matter what text is in it. The task
      # above rewrites /etc/issue.net with the site banner on every complete
      # build, so the content is still ours. Set usg_ssh_banner_path back to
      # /etc/dcsa-warning-banner to trade that finding for immunity to a re-run
      # that `usg fix` starts and something interrupts before this role runs
      # (USG restores the DoD text to /etc/issue.net, never to the dedicated
      # file).
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-0-dcsa-banner.conf
        content: "Banner {{ usg_ssh_banner_path | default('/etc/issue.net') }}\n"
        owner: root
        group: root
        mode: "0644"
      notify: Restart ssh

    - name: "REMED | Refuse root SSH logins outright (PermitRootLogin no)"
      # Ubuntu ships `PermitRootLogin prohibit-password`, and `usg fix` leaves it
      # there -- the benchmark rule it satisfies only forbids root logging in with
      # a PASSWORD, so a key still works. The org checklist (item 2) asks for no
      # root SSH login at all, and it is what makes the audit trail attributable:
      # admins log in as themselves and elevate with sudo. Confirmed on ASP-2,
      # 2026-08-27, where `sshd -T` reported `permitrootlogin without-password`
      # on a fully hardened box.
      #
      # 00-1- sorts before USG's 00-complianceascode-*.conf, and sshd takes the
      # FIRST value it reads for a keyword, so this wins.
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-1-no-root-login.conf
        content: |
          # Managed by ansible (usg_remediate). Set usg_ssh_disable_root_login:
          # false if something on this box genuinely needs to SSH in as root.
          PermitRootLogin no
        owner: root
        group: root
        mode: "0644"
      when: usg_ssh_disable_root_login | default(true) | bool
      notify: Restart ssh

    - name: "REMED | Drop the root-login denial when it has been switched off"
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/00-1-no-root-login.conf
        state: absent
      when: not (usg_ssh_disable_root_login | default(true) | bool)
      notify: Restart ssh

    - name: "REMED | Remove the superseded drop-in (older name, pointed at /etc/issue.net)"
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/00-dcsa-banner.conf
        state: absent
      notify: Restart ssh

    - name: "REMED | Swap USG's post-auth DoD acknowledgement (ssh_confirm.sh) to DCSA"
      # `usg fix` drops /etc/profile.d/ssh_confirm.sh with the DoD Standard
      # Mandatory Notice HARDCODED plus a y/N gate, shown AFTER SSH auth (this is
      # the "USG banner" seen post-password). Overwrite it to display the durable
      # /etc/dcsa-warning-banner instead, keeping the acknowledgement gate (a
      # legitimate consent control) but on the DCSA/EMI text. USG regenerates the
      # DoD version on each `usg fix`; this task (running after usg_harden)
      # re-swaps it every complete build.
      ansible.builtin.copy:
        dest: /etc/profile.d/ssh_confirm.sh
        owner: root
        group: root
        mode: "0644"
        content: |
          #!/bin/bash
          # Managed by usg_remediate -- do not edit by hand. Shows the site
          # warning banner (/etc/dcsa-warning-banner: DCSA, or the EMI banner on
          # the unclassified EMI variant) and requires acknowledgement on
          # interactive SSH logins. Replaces USG's hardcoded DoD-text version.
          # `[ -t 0 ]` (stdin is a real terminal) keeps the read loop from
          # spinning on NON-interactive SSH (scp, git, VS Code Remote-SSH), which
          # set $SSH_CLIENT but have no TTY to answer the prompt.
          if [ -t 0 ] && { [ -n "$SSH_CLIENT" ] || [ -n "$SSH_TTY" ]; }; then
              _banner=/etc/dcsa-warning-banner
              while true; do
                  [ -s "$_banner" ] && cat "$_banner"
                  read -p "
          Do you agree? [y/N] " yn
                  case "$yn" in
                      [Yy]* ) break ;;
                      [Nn]* ) exit 1 ;;
                  esac
              done
          fi

# ---------------------------------------------------------------------------
# 2) /var/log FILE PERMS + /var/log/audit DIR MODE
# file_permissions_var_log_stig (UBTU-24-700010) + directory_permissions_var_log_audit
# ---------------------------------------------------------------------------
- name: "REMED | /var/log permission fixes"
  when: usg_fix_log_permissions | default(true) | bool
  block:
    - name: "REMED | Find over-permissive files under /var/log (UBTU-24-700010)"
      # Mirrors the DISA remediation: any file with setuid/setgid/exec or
      # group/other-write/other-read+sticky, excluding the wtmp/btmp/lastlog files.
      ansible.builtin.command:
        cmd: >-
          find -P /var/log/ -perm /u+xs,g+xws,o+xwrt
          ! -name "[bw]tmp" ! -name "[bw]tmp.*" ! -name "[bw]tmp-*"
          ! -name "lastlog" ! -name "lastlog.*"
          -type f -regextype posix-extended -regex ".*"
      register: _var_log_bad
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "REMED | Tighten perms on those files (u-xs,g-xws,o-xwrt)"
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "u-xs,g-xws,o-xwrt"
        state: file
      loop: "{{ _var_log_bad.stdout_lines | default([]) }}"
      loop_control:
        label: "{{ item }}"

    - name: "REMED | Stat /var/log/audit"
      ansible.builtin.stat:
        path: /var/log/audit
      register: _audit_dir

    # The required mode is CONDITIONAL, which is why a flat 0750 failed the
    # scan: the benchmark wants 0750 only when auditd.conf's log_group is a
    # group other than root, and 0700 when it is root (or unset).
    - name: "REMED | Read auditd's log_group"
      ansible.builtin.command:
        cmd: "awk -F= '/^[[:space:]]*log_group[[:space:]]*=/ {gsub(/ /,\"\",$2); print $2}' /etc/audit/auditd.conf"
      register: _audit_log_group
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "REMED | /var/log/audit mode (0750 with a non-root log_group, else 0700)"
      ansible.builtin.file:
        path: /var/log/audit
        state: directory
        mode: "{{ '0750' if (_audit_log_group.stdout | default('') | trim) not in ['', 'root'] else '0700' }}"
      when:
        - _audit_dir.stat.exists | default(false)
        - _audit_dir.stat.isdir | default(false)

# ---------------------------------------------------------------------------
# 2b) SHARED LIBRARY GROUP OWNERSHIP -- UBTU-24-300009 / V-270699.
# The DISA check is narrow and unambiguous:
#   find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' ! -group root
# Any output is a finding. A shared object never needs a non-root group, so
# applying the DISA fix verbatim is safe and self-healing on every pull.
#
# Do NOT widen this to every file under those directories. SSG's OVAL
# (root_permissions_syslibrary_files) does exactly that, which is why it fails
# here while the DISA check passes: Ubuntu ships setgid helpers such as
# /usr/lib/x86_64-linux-gnu/utempter/utempter (group utmp) and
# /usr/lib/dbus-1.0/dbus-daemon-launch-helper (group messagebus) that REQUIRE
# their group to function, and that the STIG itself permits -- the rule title
# is "group-owned by root OR A SYSTEM ACCOUNT". chgrp root on those breaks
# utmp accounting and D-Bus system activation. The residual SSG failure is
# adjudicated in ckl-answers.yml.j2 with the evidence attached.
# ---------------------------------------------------------------------------
- name: "REMED | Shared library files group-owned by root (UBTU-24-300009)"
  when: usg_fix_library_group | default(true) | bool
  block:
    - name: "REMED | Find *.so* files not group-owned by root"
      ansible.builtin.shell:
        cmd: >-
          find /lib /lib64 /usr/lib /usr/lib64 -xdev -type f -name '*.so*'
          ! -group root -exec chgrp root {} + -print 2>/dev/null || true
      register: _syslib_chgrp
      changed_when: (_syslib_chgrp.stdout | default('') | trim) | length > 0

    - name: "REMED | Report the library files re-grouped"
      ansible.builtin.debug:
        msg: "Re-grouped to root: {{ _syslib_chgrp.stdout_lines | default([]) }}"
      when: (_syslib_chgrp.stdout | default('') | trim) | length > 0

# ---------------------------------------------------------------------------
# 3) CHRONY -- remote time source, configured DIRECTLY IN /etc/chrony/chrony.conf.
# The SSG OVAL reads chrony.conf (and its confdir includes) but NOT sourcedir/
# *.sources, so the directives must live in chrony.conf to satisfy:
#   chronyd_specify_remote_server  -> a `server` line
#   chronyd_server_directive       -> `server` (not `pool`)
#   chronyd_or_ntpd_set_maxpoll    -> `maxpoll <N>` on each server line
#   chronyd_sync_clock             -> a `makestep` line
# ---------------------------------------------------------------------------
- name: "REMED | Chrony remote time source (STIG server directive)"
  when: (usg_chrony_servers | default([]) | length) > 0
  block:
    - name: "REMED | Is chrony configured on this box?"
      ansible.builtin.stat:
        path: /etc/chrony/chrony.conf
      register: _chrony_conf

    - name: "REMED | Configure chrony directives in chrony.conf"
      when: _chrony_conf.stat.exists | default(false)
      block:
        - name: "REMED | Comment out `pool` directives (STIG wants server-only)"
          ansible.builtin.replace:
            path: /etc/chrony/chrony.conf
            regexp: '(?m)^(?!\s*#)(\s*)(pool\s+.*)$'
            replace: '\1# \2  # disabled by usg_remediate (STIG: server directive)'
          notify: Restart chrony

        - name: "REMED | Write the STIG time servers into chrony.conf (server + iburst + maxpoll)"
          ansible.builtin.blockinfile:
            path: /etc/chrony/chrony.conf
            marker: "# {mark} ANSIBLE MANAGED -- usg_remediate DISA-STIG time source"
            block: |
              {% for s in usg_chrony_servers %}
              server {{ s }} iburst maxpoll {{ usg_chrony_maxpoll | default(16) }}
              {% endfor %}
          notify: Restart chrony

        - name: "REMED | Ensure a makestep directive is present (chronyd_sync_clock)"
          ansible.builtin.lineinfile:
            path: /etc/chrony/chrony.conf
            regexp: '^\s*#?\s*makestep\b.*$'
            line: "{{ usg_chrony_makestep }}"
            state: present
          when: (usg_chrony_makestep | default('') | length) > 0
          notify: Restart chrony

        - name: "REMED | Remove the stale sources.d drop-in from the old approach"
          ansible.builtin.file:
            path: /etc/chrony/sources.d/stig.sources
            state: absent
          notify: Restart chrony

# ---------------------------------------------------------------------------
# 4) UFW ACTIVE (check_ufw_active) -- belt-and-suspenders. The firewall roles
# already enable ufw before this role; re-assert so an audit-only build (USG
# skipped) is never left with an inactive firewall.
# ---------------------------------------------------------------------------
- name: "REMED | Ensure ufw is active"
  community.general.ufw:
    state: enabled

# ufw_rate_limit (UBTU-24-600200) has no OVAL -- it is an OCIL/manual check, so
# it reports fail whatever the box does and this will not move the score. It is
# implemented anyway because rate-limiting SSH is worth having on its own.
#
# SSH ONLY, deliberately. `ufw limit` denies a source that opens more than six
# connections in thirty seconds; applied to the AI stack's published ports or
# the EMI imaging services that is a self-inflicted outage, and Docker's DNAT
# bypasses ufw for those ports regardless (see docs/reference.md). Every other
# listening port stays an explicit deviation.
- name: "REMED | Rate-limit inbound SSH"
  community.general.ufw:
    rule: limit
    port: "{{ sshd_port | default('22') }}"
    proto: tcp
  when: usg_ufw_rate_limit_ssh | default(true) | bool

# ---------------------------------------------------------------------------
# 5) EXTRA AUDIT RULES USG DOES NOT SHIP (all profiles): reboot/shutdown, cron.
# USG's STIG ruleset does not ship an explicit reboot-audit rule; auditd records
# SYSTEM_BOOT/SYSTEM_SHUTDOWN natively but without a searchable audit key. Drop a
# rule for the reboot(2) + kexec_load syscalls -- the kernel entry points for
# reboot/poweroff/halt/kexec no matter which tool (shutdown, reboot, systemctl,
# ...) triggered them -- keyed so it's greppable (`ausearch -k {{ audit_reboot_rules_key }}`).
# augenrules concatenates *.rules in name order; 71- keeps this BEFORE USG's
# 99-*-finalize `-e 2` (immutable) line. Because `usg fix` has already set the
# running config immutable, a live `augenrules --load` is refused -- the rule is
# staged in rules.d and loaded by the audit service on the post-build REBOOT.
# ---------------------------------------------------------------------------
- name: "REMED | Audit rules staged in rules.d"
  block:
    # This used to be a bare "does rules.d exist, else skip", and it hid a real
    # hole: on ASP-2 auditd was running with the directory ABSENT, so every
    # audit-rule task below skipped silently and the box enforced nothing --
    # while the file-based OVALs still passed, because there was no
    # non-conforming file for them to find. Distinguish the two cases: auditd
    # installed means the directory is ours to create; auditd genuinely absent
    # is the only thing that may skip.
    - name: "REMED | Is auditd installed?"
      ansible.builtin.stat:
        path: /sbin/auditctl
      register: _auditctl

    - name: "REMED | Ensure auditd's rules.d exists (auditd is installed)"
      ansible.builtin.file:
        path: /etc/audit/rules.d
        state: directory
        owner: root
        group: root
        mode: "0750"
      when: _auditctl.stat.exists | default(false)

    - name: "REMED | Is auditd's rules.d present?"
      ansible.builtin.stat:
        path: /etc/audit/rules.d
      register: _audit_rulesd

    - name: "REMED | auditd is not installed -- audit rules are NOT being enforced"
      ansible.builtin.debug:
        msg: >-
          /sbin/auditctl is absent, so this box has no audit daemon and none of
          the STIG audit rules are enforced. Every audit task below is being
          skipped. If that is not deliberate, install auditd and re-run.
      when: not (_auditctl.stat.exists | default(false))

    # RESOLVE THE SYSCALL NAMES AGAINST THIS BOX'S OWN TABLES FIRST.
    #
    # This is what took the whole fleet's audit ruleset down. The b32 line used
    # to hardcode `-S kexec_load`, but syscall names are per-architecture: in
    # the i386 table entry 283 is called `sys_kexec_load`, and only the x86_64
    # table calls it `kexec_load`. auditctl rejected the b32 line with
    #   Syscall name unknown: kexec_load
    #   There was an error in line 6 of /etc/audit/audit.rules
    # and, because auditctl STOPS at the first rule it cannot apply, every rule
    # after line 6 never reached the kernel -- 68 rules on disk, 1 loaded, on
    # every box. The file-based OVALs all still passed, so no scan caught it.
    #
    # `ausyscall <arch> <name>` is NOT a usable oracle: it fuzzy-matches and
    # exits 0 for `b32 kexec_load` even though auditctl rejects that name. An
    # EXACT match against `ausyscall <arch> --dump` does predict auditctl, so
    # test that, trying the bare name then the `sys_`-prefixed variant, and emit
    # only what this box can actually load. An arch with nothing resolvable
    # (b32 on arm64, say) is skipped rather than written and rejected.
    - name: "REMED | Resolve reboot-audit syscall names per architecture"
      ansible.builtin.shell:
        cmd: |
          for a in b64 b32; do
            names=""
            for s in {{ audit_reboot_rules_syscalls | default(['reboot', 'kexec_load']) | join(' ') }}; do
              for cand in "$s" "sys_$s"; do
                if ausyscall "$a" --dump 2>/dev/null \
                     | awk -v n="$cand" '$2==n{f=1} END{exit !f}'; then
                  names="$names -S $cand"; break
                fi
              done
            done
            [ -n "$names" ] && echo "$a$names"
          done
          exit 0
      register: _reboot_syscalls
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - _audit_rulesd.stat.exists | default(false)
        - audit_reboot_rules_enabled | default(true) | bool

    - name: "REMED | Install the reboot/shutdown audit rule (key={{ audit_reboot_rules_key | default('reboot') }})"
      when:
        - _audit_rulesd.stat.exists | default(false)
        - audit_reboot_rules_enabled | default(true) | bool
        - (_reboot_syscalls.stdout_lines | default([])) | length > 0
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/71-reboot.rules
        owner: root
        group: root
        mode: "0600"          # file_permissions_etc_audit_rulesd wants 0600
        content: |
          ## Managed by usg_remediate -- do not edit by hand.
          ## Audit system reboot / shutdown / power-off / kexec. reboot(2) is the
          ## kernel entry point for reboot, poweroff and halt; kexec_load(2) is the
          ## kexec reboot path. Syscall NAMES differ per arch (i386 calls it
          ## sys_kexec_load), so these were resolved against this box's own
          ## tables -- do not hand-edit one in without checking `ausyscall`.
          ## -> find them with: ausearch -k {{ audit_reboot_rules_key | default('reboot') }}
          {% for line in _reboot_syscalls.stdout_lines %}
          -a always,exit -F arch={{ line.split() | first }} {{ line.split()[1:] | join(' ') }} -k {{ audit_reboot_rules_key | default('reboot') }}
          {% endfor %}
      notify: Load audit rules

    # UBTU-24-500010 puts a watch on /var/log/sudo.log, and USG writes it. A
    # watch on a path that does not exist is rejected exactly like an unknown
    # syscall -- and aborts the load in exactly the same way. Nothing in this
    # build ever created the file, so once the syscall fault above is fixed
    # this one takes over as the next line the load dies on.
    #
    # Creating an empty file would satisfy auditctl and leave the control
    # hollow, so point sudo at it too. `validate` is not optional here: a
    # malformed sudoers drop-in costs everyone sudo.
    - name: "REMED | sudo logs to /var/log/sudo.log (UBTU-24-500010)"
      when: usg_sudo_logfile_enabled | default(true) | bool
      block:
        - name: "REMED | sudoers drop-in for the sudo logfile"
          ansible.builtin.copy:
            dest: /etc/sudoers.d/99-stig-logfile
            owner: root
            group: root
            mode: "0440"
            content: |
              ## Managed by usg_remediate -- do not edit by hand.
              Defaults logfile="/var/log/sudo.log"
            validate: "visudo -cf %s"

        - name: "REMED | Create /var/log/sudo.log so its audit watch can load"
          ansible.builtin.file:
            path: /var/log/sudo.log
            state: touch
            owner: root
            group: root
            mode: "0600"
            modification_time: preserve
            access_time: preserve

    # UBTU-24-200270 / V-274870. USG's ruleset ships no watch on the cron
    # spool or /etc/cron.d, so the rule failed on every box in the fleet
    # (audit_rules_etc_cron_d and audit_rules_var_spool_cron both fail). The
    # DISA check greps `auditctl -l` for these two lines VERBATIM -- including
    # the key `cronjobs` -- so the text below is not stylistic.
    #
    # STAT THE PATHS FIRST. `auditctl -w` on a path that does not exist fails,
    # and auditctl STOPS at the first bad line -- so one unguarded watch takes
    # every rule after it down with it and the box silently audits almost
    # nothing. /var/spool/cron ships with the `cron` package and is absent on a
    # box that does not have it. Same guard the privileged-command block uses,
    # and for the same reason.
    #
    # As with 71-reboot.rules, `usg fix` has already made the running config
    # immutable, so this lands in the kernel on the next reboot, not now.
    # /var/spool/cron ships with the `cron` package. The AI nodes schedule with
    # systemd timers and do not have it, so the directory is absent, the watch
    # was skipped, and UBTU-24-200270 stayed half-satisfied
    # (audit_rules_etc_cron_d passed, audit_rules_var_spool_cron did not).
    #
    # Create it rather than leave the control unmet. An empty spool directory
    # costs nothing, and the point of the rule is that ANYTHING appearing there
    # is audited -- which only works if the watch is loaded before something
    # does. dpkg takes ownership cleanly if `cron` is installed later.
    # Debian's own mode for it is 0755 root:root.
    - name: "REMED | Ensure the cron spool exists so its audit watch can load"
      ansible.builtin.file:
        path: /var/spool/cron
        state: directory
        owner: root
        group: root
        mode: "0755"
      when:
        - audit_cron_rules_enabled | default(true) | bool
        - audit_cron_spool_create | default(true) | bool

    # THE TWO WATCH STRINGS ARE NOT WRITTEN THE SAME WAY, AND THAT IS DELIBERATE.
    # SSG's two OVALs for this one STIG rule disagree with each other about the
    # trailing slash -- verified against ssg-ubuntu2404-ds.xml 0.1.81:
    #   /etc/cron.d/     contains: ^\s*-w\s+/etc/cron.d/\s+-p\s+wa(\s|$)+
    #   /var/spool/cron  contains: ^\s*-w\s+/var/spool/cron\s+-p\s+wa(\s|$)+
    # One requires the slash, the other requires its absence. Writing both with
    # a uniform trailing slash -- which is what DISA's fix text tells you to do
    # -- passes audit_rules_etc_cron_d and fails audit_rules_var_spool_cron,
    # which is exactly what dev-ai1 reported on 2026-08-28.
    #
    # auditctl normalises the trailing slash away, so `auditctl -l` prints
    # `-w /etc/cron.d -p wa -k cronjobs` either way and DISA's own check text
    # (which greps the KERNEL) is satisfied by both forms. Only the file-reading
    # OVAL cares. So: match each OVAL exactly, per path.
    - name: "REMED | Which cron paths exist on this box?"
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ audit_cron_watches }}"
      loop_control:
        label: "{{ item.path }}"
      register: _cron_paths
      when:
        - _audit_rulesd.stat.exists | default(false)
        - audit_cron_rules_enabled | default(true) | bool

    - name: "REMED | Cron audit rules (UBTU-24-200270)"
      when:
        - _audit_rulesd.stat.exists | default(false)
        - audit_cron_rules_enabled | default(true) | bool
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/72-cron.rules
        owner: root
        group: root
        mode: "0600"          # file_permissions_etc_audit_rulesd wants 0600
        content: |
          ## Managed by usg_remediate -- do not edit by hand.
          ## Audit anything cron is given to run as root or a privileged user.
          ## Only paths that exist are watched -- a watch on a missing path
          ## fails and aborts the rest of the rule load.
          ## -> ausearch -k cronjobs
          {% for r in _cron_paths.results | default([]) %}
          {% if r.stat.exists | default(false) %}
          -w {{ r.item.write_as }} -p wa -k cronjobs
          {% endif %}
          {% endfor %}
      notify: Load audit rules

    - name: "REMED | WARN -- a cron path is missing, so its audit rule is not written"
      ansible.builtin.debug:
        msg: >-
          {{ _cron_paths.results | default([]) | rejectattr('stat.exists')
             | map(attribute='item.path') | list }} do(es) not exist, so UBTU-24-200270
          cannot be fully satisfied on this box. The DISA check greps `auditctl -l`
          for both watches. Install the `cron` package if this box is meant to run
          cron jobs; if it genuinely has no cron, adjudicate the rule instead.
      when:
        - _cron_paths.results | default([]) | rejectattr('stat.exists') | list | length > 0

# ---------------------------------------------------------------------------
# 5b) DID THE RULES ACTUALLY REACH THE KERNEL?
# Rules on disk are not rules in the kernel, and nothing else in this build
# notices the difference -- the benchmark's audit OVALs read FILES, so a box
# enforcing one rule out of a hundred scores the same as one enforcing all of
# them. ASP-2 ran that way for weeks. Handlers have not fired at this point in
# the play, so this reports the state the box has been running in.
# ---------------------------------------------------------------------------
- name: "REMED | Audit rules: kernel vs disk"
  when: _auditctl.stat.exists | default(false)
  block:
    - name: "REMED | Count what the kernel enforces and what is on disk"
      ansible.builtin.shell:
        cmd: |
          loaded=$(auditctl -l 2>/dev/null | grep -cvE '^(No rules|)$' || true)
          rd=$(cat /etc/audit/rules.d/*.rules 2>/dev/null | grep -cvE '^[[:space:]]*(#|$)' || true)
          ar=$(grep -cvE '^[[:space:]]*(#|$)' /etc/audit/audit.rules 2>/dev/null || true)
          imm=$(auditctl -s 2>/dev/null | awk '/^enabled/{print $2}')
          echo "${loaded:-0} ${rd:-0} ${ar:-0} ${imm:-?}"
      register: _audit_counts
      changed_when: false
      failed_when: false

    - name: "REMED | Audit rules are NOT reaching the kernel"
      ansible.builtin.debug:
        msg: >-
          {{ (_audit_counts.stdout | default('0 0 0 ?')).split()[0] }} audit rule(s) in the kernel
          against {{ [(_audit_counts.stdout | default('0 0 0 ?')).split()[1] | int,
                      (_audit_counts.stdout | default('0 0 0 ?')).split()[2] | int] | max }} on disk
          (auditctl enabled={{ (_audit_counts.stdout | default('0 0 0 ?')).split()[3] }}).
          This box is auditing far less than the baseline defines, and the STIG scan
          CANNOT see it -- the audit OVALs read files, not the kernel. If enabled=2
          the rules load on the next reboot; otherwise `augenrules --load` is failing.
          Verify with `sudo it-checklist` item 6.
      when:
        - (_audit_counts.stdout | default('')) | length > 0
        - ((_audit_counts.stdout).split()[1] | int) + ((_audit_counts.stdout).split()[2] | int) > 0
        - (_audit_counts.stdout).split()[0] | int
          < ([(_audit_counts.stdout).split()[1] | int, (_audit_counts.stdout).split()[2] | int] | max) / 2

# ---------------------------------------------------------------------------
# 5c) AUDIT THE PRIVILEGED COMMANDS THE BENCHMARK CHECKS (UBTU-24-900080..900330)
# `usg fix` writes this class of rule for only part of the set -- su, fdisk,
# kmod, modprobe and unix_update pass while chfn/chsh/chage/passwd/gpasswd/
# usermod/newgrp/crontab/mount/umount/sudo/sudoedit/ssh-agent/ssh-keysign/
# pam_timestamp_check/apparmor_parser/chcon/setfacl/chacl all fail. That single
# gap is the majority of the residual findings on a fully built box.
#
# Only paths that EXIST are written: auditctl rejects a path rule for a missing
# file, which would make `augenrules --load` fail as a whole. Commands already
# covered by another rules.d file are skipped too, so we never load a duplicate
# rule (auditctl errors on "Rule exists"); our own file is excluded from that
# scan or the block would delete its own rules on the next run.
#
# 72- keeps this after USG's own files and before its 99-*-finalize `-e 2`.
# As with 71-reboot.rules, `usg fix` has already made the running config
# immutable, so these load on the next reboot rather than immediately.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# 5b-pre) LEGACY AUDIT RULE FILES
# Must run BEFORE the privileged-command block below, which reads every other
# *.rules file to decide what is already covered.
#
# A box first built under the pre-USG ansible-lockdown role carries
# /etc/audit/rules.d/stig.rules, whose privileged-command rules use the old form
#   -a always,exit -F path=/usr/bin/chage ... -F auid!=-1 -k privileged-chage
# where the benchmark's OVAL requires USG's form
#   -a always,exit -F path=/usr/bin/chage ... -F auid!=unset -F key=privileged
# Both load fine, but the OVAL requires EVERY matching line to conform, so the
# legacy line fails a rule the compliant line beside it already satisfies. That
# was 22 findings on ASP-2.
#
# Retiring the whole file closed those 22 and OPENED 21 others: the same file
# was the only source of the session-event, usergroup-modification, xattr,
# sudoers, login-event and cron.d rules, which USG does not write at all. It
# also carried modprobe, whose OVAL is not strict and was passing on the legacy
# line alone. Deleting the file traded one set of findings for another.
#
# So prune rather than delete, and only where it is provably safe: a legacy
# line goes only when another rules file already covers that exact path in the
# compliant form. Anything else stays, and the run says which and why.
# ---------------------------------------------------------------------------
- name: "REMED | Prune legacy audit rules (surgical, not wholesale)"
  when: usg_remove_legacy_audit_rules | default(true) | bool
  block:
    - name: "REMED | Install the audit-rule pruner"
      ansible.builtin.copy:
        src: audit-rules-prune.py
        dest: /usr/local/sbin/audit-rules-prune
        owner: root
        group: root
        mode: "0750"

    # An earlier version of this role MOVED these files out wholesale. Put them
    # back before pruning, or the rules it should have kept stay lost.
    - name: "REMED | Restore any file the wholesale retirement moved out"
      ansible.builtin.command:
        cmd: "mv -n {{ usg_legacy_audit_backup_dir }}/{{ item | basename }} {{ item }}"
        creates: "{{ item }}"
        removes: "{{ usg_legacy_audit_backup_dir }}/{{ item | basename }}"
      loop: "{{ usg_legacy_audit_rule_files }}"
      loop_control:
        label: "{{ item | basename }}"
      notify: Load audit rules

    - name: "REMED | Which legacy audit rule files are present?"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ usg_legacy_audit_rule_files }}"
      register: _legacy_audit_stat
      loop_control:
        label: "{{ item }}"

    - name: "REMED | Prune the non-compliant privileged-command lines"
      ansible.builtin.command:
        cmd: "/usr/local/sbin/audit-rules-prune {{ item }} /etc/audit/rules.d"
      loop: "{{ _legacy_audit_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}"
      loop_control:
        label: "{{ item | basename }}"
      register: _legacy_prune
      changed_when: "'dropping' in (_legacy_prune.stdout | default(''))"
      notify: Load audit rules

    - name: "REMED | What the pruner did"
      ansible.builtin.debug:
        msg: "{{ _legacy_prune.results | default([]) | map(attribute='stdout_lines') | list }}"
      when: _legacy_prune.results | default([]) | length > 0

- name: "REMED | Audit rules for privileged commands"
  when: usg_audit_privileged_commands_enabled | default(true) | bool
  block:
    - name: "REMED | Is auditd's rules.d present?"
      ansible.builtin.stat:
        path: /etc/audit/rules.d
      register: _privcmd_rulesd

    - name: "REMED | Which privileged-command binaries exist on this box?"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ usg_audit_privileged_commands }}"
      register: _privcmd_stat
      loop_control:
        label: "{{ item }}"
      when: _privcmd_rulesd.stat.exists | default(false)

    - name: "REMED | Read the audit rules USG already wrote (excluding our own file)"
      ansible.builtin.shell:
        cmd: >-
          find /etc/audit/rules.d -maxdepth 1 -name '*.rules'
          ! -name '72-privileged-commands.rules' -exec cat {} +
      register: _privcmd_existing
      changed_when: false
      failed_when: false
      check_mode: false
      when: _privcmd_rulesd.stat.exists | default(false)

    # Two steps, not one expression with vars: `difference` on a real list is
    # unambiguous. Paths are compared whole, so /usr/bin/su is never mistaken
    # for the /usr/bin/sudo rule the way a substring match would.
    - name: "REMED | Which commands does an existing rule already cover?"
      ansible.builtin.set_fact:
        _privcmd_covered: "{{ _privcmd_existing.stdout | default('') | regex_findall('-F path=(\\S+)') }}"
      when: _privcmd_rulesd.stat.exists | default(false)

    - name: "REMED | Build the list of commands still needing a rule"
      ansible.builtin.set_fact:
        _privcmd_missing: >-
          {{ _privcmd_stat.results
             | selectattr('stat.exists', 'defined') | selectattr('stat.exists')
             | map(attribute='item') | list
             | difference(_privcmd_covered) }}
      when: _privcmd_rulesd.stat.exists | default(false)

    - name: "REMED | Install the privileged-command audit rules (key={{ usg_audit_privileged_commands_key }})"
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/72-privileged-commands.rules
        owner: root
        group: root
        mode: "0600"
        content: |
          ## Managed by usg_remediate -- do not edit by hand.
          ## Privileged commands the DISA benchmark checks that `usg fix` did not
          ## cover. Find them with: ausearch -k {{ usg_audit_privileged_commands_key }}
          {% for cmd in _privcmd_missing %}
          -a always,exit -F path={{ cmd }} -F perm=x -F auid>=1000 -F auid!=unset -F key={{ usg_audit_privileged_commands_key }}
          {% endfor %}
      when: _privcmd_rulesd.stat.exists | default(false)
      notify: Load audit rules

    - name: "REMED | /etc/audit/rules.d/*.rules must be 0600 (UBTU-24-900040)"
      ansible.builtin.shell:
        cmd: >-
          find /etc/audit/rules.d -maxdepth 1 -name '*.rules' -perm /0177
          -exec chmod 0600 {} + -print
      register: _rulesd_perm
      changed_when: (_rulesd_perm.stdout | default('') | trim) | length > 0

# ---------------------------------------------------------------------------
# 5d) SYSTEMD-JOURNAL PERMISSIONS (UBTU-24-700020 / 700030)
# The journal directories must be 2750 or tighter and `journalctl` itself 0740.
# 0740 means journalctl is root-execute-only -- admins read logs with `sudo
# journalctl`, which is what every it-* script already does.
# ---------------------------------------------------------------------------
- name: "REMED | systemd-journal permissions"
  when: usg_fix_journal_permissions | default(true) | bool
  block:
    - name: "REMED | Journal directories must be 2750 or less permissive"
      ansible.builtin.shell:
        cmd: >-
          find /run/log/journal /var/log/journal -maxdepth 1 -type d
          -perm /0027 -exec chmod g-w,o-rwx {} + -print 2>/dev/null || true
      register: _journal_dirs
      changed_when: (_journal_dirs.stdout | default('') | trim) | length > 0

    - name: "REMED | journalctl must be mode 0740"
      ansible.builtin.file:
        path: /usr/bin/journalctl
        mode: "0740"
        state: file

# ---------------------------------------------------------------------------
# 5e) ACCOUNT LOCKOUT (UBTU-24-200610)
# Six rules -- deny / fail_interval / unlock_time / audit / silent -- read their
# VALUES from /etc/security/faillock.conf, which is all this block writes.
#
# The values alone are not enough. Each rule's OVAL first requires pam_faillock
# to be in /etc/pam.d/common-auth; without those lines faillock.conf is inert
# and every one of the six fails no matter what it contains. That is exactly
# what the ASP-2 scan showed. The PAM stack itself is handled in 5f-2 below,
# which is the part that carries lockout risk -- this block still cannot cost a
# working login on its own. See defaults/main.yml for the unlock_time reasoning.
# ---------------------------------------------------------------------------
- name: "REMED | Account lockout policy (faillock.conf)"
  when: usg_fix_faillock | default(true) | bool
  block:
    - name: "REMED | Is faillock.conf present? (skip where pam_faillock is absent)"
      ansible.builtin.stat:
        path: /etc/security/faillock.conf
      register: _faillock_conf

    - name: "REMED | Set the faillock directives"
      ansible.builtin.lineinfile:
        path: /etc/security/faillock.conf
        regexp: "{{ item.re }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { re: '^\s*#?\s*deny\s*=', line: "deny = {{ usg_faillock_deny }}" }
        - { re: '^\s*#?\s*fail_interval\s*=', line: "fail_interval = {{ usg_faillock_fail_interval }}" }
        - { re: '^\s*#?\s*unlock_time\s*=', line: "unlock_time = {{ usg_faillock_unlock_time }}" }
        - { re: '^\s*#?\s*audit\s*$', line: "audit" }
        - { re: '^\s*#?\s*silent\s*$', line: "silent" }
      loop_control:
        label: "{{ item.line }}"
      when: _faillock_conf.stat.exists | default(false)

# ---------------------------------------------------------------------------
# 5f) PAM: PASSWORD HASHING ROUNDS (UBTU-24-400220)
# `rounds` only applies when a password is CHANGED, so nothing here can reject a
# valid password. pam_faildelay moved to the pam-auth-update block below, which
# is where common-auth is actually generated from.
# ---------------------------------------------------------------------------
- name: "REMED | PAM password hashing rounds"
  block:
    - name: "REMED | Correct an existing rounds= on the pam_unix password line"
      # `usg fix` writes rounds=5000, which is NOT the benchmark's value, so the
      # append-only task below skips the line and the finding stays open. This
      # rewrites the value in place, leaving every other option untouched.
      ansible.builtin.replace:
        path: /etc/pam.d/common-password
        regexp: '^(\s*password\s+(?:\[[^]]*\]|\S+)\s+pam_unix\.so\s+.*\brounds=)\d+'
        replace: '\g<1>{{ usg_pam_unix_rounds }}'
      when: usg_fix_pam_rounds | default(false) | bool

    - name: "REMED | Set pam_unix password hashing rounds (UBTU-24-400220)"
      # Appends `rounds=N` to the existing pam_unix.so password line, leaving
      # every other option on it untouched. Skips a line that already has it.
      ansible.builtin.replace:
        path: /etc/pam.d/common-password
        regexp: '^(\s*password\s+(?:\[[^]]*\]|\S+)\s+pam_unix\.so(?!.*\brounds=)(?:\s+\S+)*)\s*$'
        replace: '\1 rounds={{ usg_pam_unix_rounds }}'
      when: usg_fix_pam_rounds | default(false) | bool

# ---------------------------------------------------------------------------
# 5f-0) PAM: remove `nullok` (UBTU-24-300028 / no_empty_passwords) -- HIGH
#
# Ubuntu's pam-auth-update writes `pam_unix.so nullok`, which permits login to
# an account whose password field is EMPTY. Nothing on these boxes has an empty
# password (no_empty_passwords_etc_shadow passes), so removing it changes no
# working login -- it removes the possibility that a future account created
# without a password becomes remotely usable.
#
# Safe by construction: this only narrows what pam_unix accepts. It cannot
# reject a password that is currently valid. The stack is re-verified after,
# because it is still an edit to the file that locked this fleet out once.
#
# pam-auth-update regenerates common-auth with nullok on a libpam-runtime
# upgrade, so this re-applies on every build, like the 10_linux GRUB edit.
# ---------------------------------------------------------------------------
- name: "REMED | Remove `nullok` from the PAM stack (no empty-password logins)"
  when: usg_fix_pam_nullok | default(true) | bool
  block:
    - name: "REMED | Strip nullok from common-auth / common-password"
      ansible.builtin.replace:
        path: "/etc/pam.d/{{ item }}"
        regexp: '(\s)nullok(_secure)?\b'
        replace: '\1'
      loop:
        - common-auth
        - common-password
      register: _nullok_strip

    - name: "REMED | Re-verify the auth stack after the nullok edit"
      ansible.builtin.command:
        cmd: "{{ pam_auth_check_path }} /etc/pam.d/common-auth"
      register: _nullok_verify
      changed_when: false
      failed_when: false

    # Two different situations, and conflating them stopped a production run on
    # a healthy box. Only a real BROKEN/UNKNOWN verdict is a reason to abort.
    - name: "REMED | The checker itself did not run"
      ansible.builtin.debug:
        msg: >-
          {{ pam_auth_check_path }} produced no verdict (rc={{ _nullok_verify.rc }}).
          The auth stack was NOT evaluated -- this is a problem with the check,
          not evidence of a problem with PAM. Verify by hand before rebooting:
          `sudo {{ pam_auth_check_path }} /etc/pam.d/common-auth`.
      when: (_nullok_verify.stdout | default('') | trim) | length == 0

    - name: "REMED | Fail loudly if the nullok edit broke the auth stack"
      ansible.builtin.fail:
        msg: >-
          Removing nullok left an auth stack that cannot authenticate:
          {{ _nullok_verify.stdout | trim }}.
          Restore with `pam-auth-update --force` and set
          usg_fix_pam_nullok: false.
      when:
        - (_nullok_verify.stdout | default('') | trim) | length > 0
        - "'OK' not in _nullok_verify.stdout"

# ---------------------------------------------------------------------------
# 5f-2) PAM STACK: pam_faillock + pam_faildelay, via pam-auth-update profiles
#
# Seven findings (the five faillock rules, faillock_audit/silent, and
# pam_faildelay) need lines in /etc/pam.d/common-auth, not just values in
# /etc/security/faillock.conf. On ASP-2 faillock.conf was correct and all six
# faillock rules still failed, because the OVAL's first test is the PAM stack
# itself:
#   ^\s*auth\s+(requisite|required)\s+pam_faillock\.so.*preauth
#   ... ^\s*auth.*pam_unix\.so
#   ... ^\s*auth\s+\[default=die\]\s+pam_faillock\.so\s+authfail
# and none of those lines were present. The faillock.conf values are inert
# without them.
#
# common-auth is GENERATED by pam-auth-update from /usr/share/pam-configs/, so
# hand-editing it is both fragile and temporary -- the next libpam-runtime
# upgrade regenerates the file and drops the edit. Ubuntu 24.04 ships no
# faillock profile of its own (libpam-modules carries only `unix` and
# `mkhomedir`), so we install profiles. These are byte-for-byte the ones SSG's
# own remediation writes, including the priorities, which is what puts preauth
# above pam_unix and authfail below it.
#
# Safety: common-auth and common-account are backed up first, and the result is
# verified to still contain pam_unix.so and to reference no module that is
# missing from disk. A failed check restores the backups before anything can
# reach a login prompt.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# 5f-1) PAM PRE-FLIGHT -- runs on EVERY box, whatever else is enabled.
#
# ASP-2 shipped a /etc/pam.d/common-auth, written by the pre-USG
# ansible-lockdown role in June, that denied every login on the box: pam_unix
# was present, every module existed, the file parsed -- and pam_faillock had
# been inserted twice without recalculating pam_unix's success=2, so a correct
# password was walked straight into pam_deny. It cost the operator a full
# recovery from a live USB.
#
# Nothing in a normal build would have caught that, so check it explicitly and
# say so loudly. This only READS the file.
# ---------------------------------------------------------------------------
- name: "REMED | Pre-flight: can this box's PAM stack authenticate at all?"
  ansible.builtin.command:
    cmd: "{{ pam_auth_check_path }} /etc/pam.d/common-auth"
  register: _pam_preflight
  changed_when: false
  failed_when: false
  check_mode: false

- name: "REMED | WARN -- the PAM auth stack rejects every password"
  ansible.builtin.debug:
    msg: >-
      {{ _pam_preflight.stdout_lines | default(['(no output)']) }}
      ---
      This box CANNOT authenticate any local password, and that is true right
      now, before this role changes anything. It is almost always a pre-USG
      ansible-lockdown leftover. Repair with `sudo pam-auth-update --force`,
      then TEST A LOGIN ON A SECOND TTY BEFORE CLOSING YOUR SESSION.
  when: _pam_preflight.rc | default(0) != 0

- name: "REMED | PAM stack: faillock + faildelay (pam-auth-update profiles)"
  when: usg_fix_pam_stack | default(true) | bool
  block:
    - name: "REMED | Back up the generated PAM files"
      ansible.builtin.copy:
        src: "/etc/pam.d/{{ item }}"
        dest: "/etc/pam.d/{{ item }}.usg-remediate.bak"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
        force: true
      loop:
        - common-auth
        - common-account

    - name: "REMED | Install the pam-config profiles"
      ansible.builtin.template:
        src: "pam-config-{{ item }}.j2"
        dest: "/usr/share/pam-configs/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - cac_faillock
        - cac_faillock_notify
        - cac_faildelay
      register: _pam_profiles

    - name: "REMED | Regenerate common-auth / common-account"
      ansible.builtin.command:
        cmd: "pam-auth-update --enable cac_faillock cac_faillock_notify cac_faildelay"
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: _pam_update
      changed_when: _pam_update.rc == 0

    # "pam_unix is present and every module exists" is NOT enough -- that is
    # exactly what the broken stack on ASP-2 looked like while denying every
    # login. The offsets are what matter, so walk them.
    - name: "REMED | Verify the regenerated stack still authenticates"
      ansible.builtin.shell:
        cmd: |
          set -e
          libdir=$(dirname "$(find /usr/lib -name pam_unix.so -print -quit)")
          for m in $(awk '!/^[[:space:]]*#/ {for (i=1;i<=NF;i++) if ($i ~ /^pam_.*\.so$/) print $i}' \
                     /etc/pam.d/common-auth /etc/pam.d/common-account | sort -u); do
            [ -e "$libdir/$m" ] || { echo "MISSING MODULE $m"; exit 1; }
          done
          {{ pam_auth_check_path }} /etc/pam.d/common-auth
      register: _pam_verify
      changed_when: false
      failed_when: false

    - name: "REMED | Restore the PAM backups if verification failed"
      ansible.builtin.copy:
        src: "/etc/pam.d/{{ item }}.usg-remediate.bak"
        dest: "/etc/pam.d/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
        force: true
      loop:
        - common-auth
        - common-account
      when: "'OK' not in (_pam_verify.stdout | default(''))"

    - name: "REMED | Fail loudly if the PAM stack had to be rolled back"
      ansible.builtin.fail:
        msg: >-
          pam-auth-update produced a common-auth that would not authenticate
          ({{ _pam_verify.stdout | default('no output') | trim }}). The previous
          files have been restored from
          /etc/pam.d/common-{auth,account}.usg-remediate.bak and the box is
          unchanged. Set usg_fix_pam_stack: false to skip this block.
      when: "'OK' not in (_pam_verify.stdout | default(''))"

# ---------------------------------------------------------------------------
# 5g) OFFLOAD AUDIT LOGS (UBTU-24-900240 / auditd_offload_logs)
# The OVAL checks one thing: that /etc/cron.weekly/audit-offload exists and is
# non-empty. It does not inspect what the script does, so the finding is closed
# by any real implementation.
#
# The default script stages a compressed copy of the rotated audit logs under
# usg_audit_offload_dir and prunes to the last N. That is a genuine offload for
# an air-gapped box -- an operator carries the staged archives off on removable
# media -- and it is deliberately NOT a no-op file written only to pass a scan.
# On a connected box set usg_audit_offload_command to rsync/scp to the log host
# and that runs instead.
# ---------------------------------------------------------------------------
- name: "REMED | Weekly audit log offload"
  when: usg_fix_audit_offload | default(true) | bool
  block:
    - name: "REMED | Staging dir for offloaded audit logs"
      ansible.builtin.file:
        path: "{{ usg_audit_offload_dir }}"
        state: directory
        owner: root
        group: "{{ ia_it_group | default('sudo') }}"
        mode: "0750"

    - name: "REMED | cifs-utils, for the remote-share push"
      ansible.builtin.apt:
        name: cifs-utils
        state: present
      when: usg_audit_offload_smb_enabled | default(false) | bool
      failed_when: false        # air-gapped with no local repo: warned below, not fatal

    # The credentials file is NEVER written by this repo and never committed.
    # It is placed by hand (or by vault) on the box, root-only, and the offload
    # script refuses to mount without it. Say so at build time rather than
    # letting the first failure be a silent cron job in a week's time.
    - name: "REMED | Is the share credentials file present?"
      ansible.builtin.stat:
        path: "{{ usg_audit_offload_smb_credentials }}"
      register: _offload_cred
      when: usg_audit_offload_smb_enabled | default(false) | bool

    - name: "REMED | WARN -- offload push is configured but has no credentials"
      ansible.builtin.debug:
        msg: >-
          usg_audit_offload_smb_enabled is true but {{ usg_audit_offload_smb_credentials }}
          does not exist, so the weekly push will SKIP (the local copy is still
          staged in {{ usg_audit_offload_dir }}). Create it root-only, 0600:
          printf 'username=svc_audit\npassword=...\ndomain=...\n' >
          {{ usg_audit_offload_smb_credentials }} && chmod 0600 {{ usg_audit_offload_smb_credentials }}
      when:
        - usg_audit_offload_smb_enabled | default(false) | bool
        - not (_offload_cred.stat.exists | default(false))

    - name: "REMED | Install /etc/cron.weekly/audit-offload"
      ansible.builtin.template:
        src: audit-offload.j2
        dest: /etc/cron.weekly/audit-offload
        owner: root
        group: root
        mode: "0750"

# ---------------------------------------------------------------------------
# 5b) DISABLE CUPS PRINTING (all profiles) -- least-functionality hardening.
# CUPS listens on :631 and is unneeded on these boxes; leaving it running is an
# extra attack surface. Disable AND mask cups.service + cups.socket (the socket
# would otherwise re-activate the service on demand) + cups-browsed. failed_when
# false so a box that never installed CUPS (e.g. a headless AI node) is a no-op.
# Set disable_cups: false per box if you genuinely need local printing.
# ---------------------------------------------------------------------------
- name: "REMED | Disable + mask CUPS printing services (all profiles)"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - cups.service
    - cups.socket
    - cups-browsed.service
  failed_when: false          # units may be absent (not installed) -> nothing to do
  when: disable_cups | default(true) | bool

# ---------------------------------------------------------------------------
# 5h) FINAL PERMISSION SWEEP -- runs LAST, immediately before the re-audit.
#
# The mode fixes earlier in this role were applied and were still wrong when the
# scan ran on ASP-2: /var/log/journal 2755, journalctl 0755, /var/log/audit
# 0750, /etc/audit/rules.d/71-reboot.rules 0640. Between those tasks and the
# audit, handlers fire (augenrules --load) and daemons restart, and auditd and
# systemd-journald both re-apply their own idea of the right mode to the
# directories they own. Re-asserting here closes that window; it is idempotent,
# so on a box where nothing reset them it is a no-op.
#
# /run/log/journal is on tmpfs and is recreated at every boot, so a chmod alone
# never survives a reboot -- the tmpfiles.d drop-in is what makes it stick.
# ---------------------------------------------------------------------------
- name: "REMED | Final permission sweep (before the re-audit)"
  when: usg_final_permission_sweep | default(true) | bool
  block:
    - name: "REMED | Persist the journal directory mode across reboots"
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/00-stig-journal.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by usg_remediate -- do not edit by hand.
          # dir_permissions_system_journal wants 2750 or tighter. systemd
          # creates these 2755, and /run/log/journal is tmpfs (recreated every
          # boot), so this re-applies the mode at boot. `z` adjusts an existing
          # path without creating one that should not exist.
          z /run/log/journal 2750 root systemd-journal -
          z /run/log/journal/* 2750 root systemd-journal -
          z /var/log/journal 2750 root systemd-journal -
          z /var/log/journal/* 2750 root systemd-journal -

    # tmpfiles runs early and systemd-journald creates/adjusts its own
    # directories, so on ASP-2 the modes were 2750 in one scan and back to 2755
    # in the next, across a reboot. A unit ordered AFTER journald re-asserts
    # them once the daemon has finished creating them, which tmpfiles alone
    # cannot guarantee.
    - name: "REMED | Unit that re-asserts journal modes after journald starts"
      ansible.builtin.copy:
        dest: /etc/systemd/system/stig-journal-perms.service
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by usg_remediate -- do not edit by hand.
          [Unit]
          Description=Enforce STIG permissions on the systemd journal directories
          Documentation=man:systemd-journald.service(8)
          After=systemd-journald.service systemd-tmpfiles-setup.service
          Wants=systemd-journald.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/sh -c 'find /run/log/journal /var/log/journal -maxdepth 1 -type d -perm /0027 -exec chmod g-w,o-rwx {} + 2>/dev/null; exit 0'

          [Install]
          WantedBy=multi-user.target
      register: _journal_unit

    - name: "REMED | Enable the journal permission unit"
      ansible.builtin.systemd:
        name: stig-journal-perms.service
        enabled: true
        state: started
        daemon_reload: true
      failed_when: false

    - name: "REMED | Re-assert the journal directory modes now"
      ansible.builtin.shell:
        cmd: >-
          find /run/log/journal /var/log/journal -maxdepth 1 -type d
          -perm /0027 -exec chmod g-w,o-rwx {} + -print 2>/dev/null || true
      register: _journal_sweep
      changed_when: (_journal_sweep.stdout | default('') | trim) | length > 0

    - name: "REMED | Re-assert journalctl 0740"
      ansible.builtin.file:
        path: /usr/bin/journalctl
        mode: "0740"
        state: file

    - name: "REMED | Re-assert /etc/audit/rules.d/*.rules 0600"
      ansible.builtin.shell:
        cmd: >-
          find /etc/audit/rules.d -maxdepth 1 -name '*.rules' -perm /0177
          -exec chmod 0600 {} + -print
      register: _rulesd_sweep
      changed_when: (_rulesd_sweep.stdout | default('') | trim) | length > 0
      failed_when: false

    # /var/log FILE MODES, AGAIN -- and this time continuously.
    # Section 2 already tightens these, but it runs near the top of a role that
    # then installs packages: apt, dpkg and unattended-upgrades all recreate
    # their logs 0644 AFTER that task, so by the time scap_scan runs at the end
    # of the pull /var/log/dpkg.log and /var/log/apt/*.log are over-permissive
    # again. That is why UBTU-24-700010 failed on every box in the fleet
    # despite a fix that was itself correct. Re-run it here, last, and install a
    # timer so it also holds between pulls (unattended-upgrades runs daily).
    - name: "REMED | Continuous /var/log mode enforcement (UBTU-24-700010)"
      ansible.builtin.copy:
        dest: /etc/systemd/system/stig-log-perms.service
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by usg_remediate -- do not edit by hand.
          # DISA UBTU-24-700010: no file under /var/log may have any of the
          # 0137 bits. btmp/wtmp/lastlog are excluded by the STIG itself.
          # Symbolic mode, not `chmod 640` -- this only ever REMOVES bits, so a
          # 0600 log is never widened to group-readable.
          [Unit]
          Description=Enforce STIG permissions on files under /var/log

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c "find /var/log -xdev -type f -perm /137 ! -name '*[bw]tmp' ! -name '*[bw]tmp.*' ! -name '*lastlog' ! -name '*lastlog.*' -exec chmod u-xs,g-xws,o-rwxt {} + 2>/dev/null; exit 0"

    - name: "REMED | Timer for the /var/log mode enforcement"
      ansible.builtin.copy:
        dest: /etc/systemd/system/stig-log-perms.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by usg_remediate -- do not edit by hand.
          [Unit]
          Description=Daily STIG permission sweep over /var/log

          [Timer]
          OnBootSec=10min
          OnUnitActiveSec=1d
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: "REMED | Enable the /var/log permission timer"
      ansible.builtin.systemd:
        name: stig-log-perms.timer
        enabled: true
        state: started
        daemon_reload: true
      failed_when: false

    - name: "REMED | Run the /var/log permission sweep now"
      ansible.builtin.shell:
        cmd: >-
          find /var/log -xdev -type f -perm /137
          ! -name '*[bw]tmp' ! -name '*[bw]tmp.*'
          ! -name '*lastlog' ! -name '*lastlog.*'
          -exec chmod u-xs,g-xws,o-rwxt {} + -print 2>/dev/null || true
      register: _var_log_final_sweep
      changed_when: (_var_log_final_sweep.stdout | default('') | trim) | length > 0

    - name: "REMED | Re-read auditd's log_group"
      ansible.builtin.command:
        cmd: "awk -F= '/^[[:space:]]*log_group[[:space:]]*=/ {gsub(/ /,\"\",$2); print $2}' /etc/audit/auditd.conf"
      register: _audit_log_group_final
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "REMED | Re-assert /var/log/audit mode (0700 when log_group is root)"
      ansible.builtin.file:
        path: /var/log/audit
        state: directory
        mode: "{{ '0750' if (_audit_log_group_final.stdout | default('') | trim) not in ['', 'root'] else '0700' }}"
      failed_when: false

# ---------------------------------------------------------------------------
# 6) RE-AUDIT -- regenerate the USG report so it reflects the fully-built,
# remediated box rather than the mid-build snapshot. Pro-attached boxes only.
# (_usg_active / _usg_target are facts set by usg_harden earlier in this play.)
# ---------------------------------------------------------------------------
- name: "REMED | Regenerate the USG compliance report (post-build)"
  when:
    - usg_remediate_reaudit | default(true) | bool
    - _usg_active | default(false) | bool
  block:
    - name: "REMED | Re-run `usg audit {{ usg_profile }}` after remediation"
      ansible.builtin.command: "usg audit {{ _usg_target | default(usg_profile) }}"
      register: _reaudit
      changed_when: false
      failed_when: false

    - name: "REMED | Collect refreshed audit artifacts from /var/lib/usg"
      ansible.builtin.find:
        paths: /var/lib/usg
        patterns: ["*.html", "*.xml"]
        file_type: file
      register: _reaudit_art

    - name: "REMED | Ensure the report dir exists"
      ansible.builtin.file:
        path: "{{ usg_report_dir }}"
        state: directory
        owner: "{{ usg_report_dir_owner | default('root') }}"
        group: "{{ usg_report_dir_group | default('root') }}"
        mode: "{{ usg_report_dir_mode | default('0750') }}"

    - name: "REMED | Copy refreshed reports into {{ usg_report_dir }}"
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ usg_report_dir }}/"
        remote_src: true
        owner: "{{ usg_report_dir_owner | default('root') }}"
        group: "{{ usg_report_file_group | default('root') }}"
        mode: "{{ usg_report_file_mode | default('0640') }}"
      loop: "{{ _reaudit_art.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
